}

// ── DRAG LIST CARD → AREA (dashboard) ─────────────────────────────
function initDashListDrag(card,task){
  card.addEventListener('pointerdown',function(e){
    if(e.button!==0||e.target.closest('.eq-dtask-mem'))return;
    var sx=e.clientX,sy=e.clientY,dragging=false,ghost=null;
    var pid=e.pointerId;
    function onMove(ev){
      var dx=ev.clientX-sx,dy=ev.clientY-sy;
      if(!dragging&&Math.sqrt(dx*dx+dy*dy)>7){
        dragging=true;
        try{card.setPointerCapture(pid);}catch(err){}
        ghost=document.createElement('div');ghost.className='eq-k-ghost';
        ghost.style.cssText='width:200px;left:'+(ev.clientX-100)+'px;top:'+(ev.clientY-18)+'px;';
        ghost.innerHTML='<div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:'+(task.color||'#5AB4E8')+';border-radius:3px 0 0 3px;"></div><div style="padding:5px 8px;font-size:11px;font-weight:600;color:rgba(255,255,255,.85);">'+task.text+'</div>';
        document.body.appendChild(ghost);card.style.opacity='.2';
        _dashListDrag={ghost:ghost,card:card,task:task};
      }
      if(dragging&&ghost){
        ghost.style.left=(ev.clientX-100)+'px';ghost.style.top=(ev.clientY-18)+'px';
        document.querySelectorAll('.eq-das-card').forEach(function(c){
          var r=c.getBoundingClientRect();
          c.classList.toggle('drop-over',ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom);
        });
      }
    }
    function onUp(ev){
      document.removeEventListener('pointermove',onMove);document.removeEventListener('pointerup',onUp);
      if(dragging){
        if(ghost&&ghost.parentNode)ghost.parentNode.removeChild(ghost);
        card.style.opacity='';
        var targetArea=null;
        document.querySelectorAll('.eq-das-card').forEach(function(c){
          var r=c.getBoundingClientRect();
          if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom)targetArea=c.dataset.areaId;
          c.classList.remove('drop-over');
        });
        _dashListDrag=null;
        if(targetArea)dropTaskOnArea(task,targetArea);
        // prevent the click handler from firing after drag
        card.addEventListener('click',function stop(e2){e2.stopImmediatePropagation();card.removeEventListener('click',stop);},{capture:true,once:true});
      }
    }
    document.addEventListener('pointermove',onMove);document.addEventListener('pointerup',onUp);
  });
}

function dropTaskOnArea(task,areaId){

function saveTaskEdit(task,text,resp,deadline){
  var changes={text:text,resp:resp||null,deadline:deadline||''};
  if(task._type==='standalone'){
    standaloneTasks=(standaloneTasks||[]).map(function(t){return t.id===task.id?Object.assign({},t,changes):t;});
  } else {
    projects=(projects||[]).map(function(p){
      if(p.id!==task._projId)return p;
      var st=Object.assign({},p.stageTasks||{});
      st[task._stage]=(st[task._stage]||[]).map(function(t){return t.id===task.id?Object.assign({},t,changes):t;});
      return Object.assign({},p,{stageTasks:st});
    });
  }
  saveTaskChange();closeTaskEditModal();renderDashboard();
}

var AREA_ICONS={'campo':'🪣','logística':'🚚','logistica':'🚚','diseño':'💻','dirección':'🧭','direccion':'🧭','administración':'🗂️','administracion':'🗂️','producción':'⚙️','produccion':'⚙️','gestión':'📊','gestion':'📊','marketing':'📣','ventas':'💼','desarrollo':'💻','finanzas':'💰','operaciones':'🔧','rrhh':'👥','legal':'⚖️','calidad':'✅','taller':'🛠️'};
function areaIcon(name){return AREA_ICONS[(name||'').toLowerCase()]||'🏢';}
function getAreaById(id){for(var i=0;i<workAreas.length;i++){if(workAreas[i].id===id)return workAreas[i];}return null;}
function getAreaMembers(areaId){return teamMembers.filter(function(m){return(memberAreas[m.id]||[]).indexOf(areaId)>-1;});}

// ── AREA LIST (left panel) ─────────────────────────────────────────
function renderAreaList(){
  var list=document.getElementById('eqTeamList');if(!list)return;
  list.innerHTML='';
  var allTasks=collectAllTasks();
  workAreas.forEach(function(ar){
    var members=getAreaMembers(ar.id);
    var active=allTasks.filter(function(t){
      if(t.done)return false;
      if(t.area===ar.name)return true;
      if(t.member&&t.member.area===ar.name)return true;
      if(t.resp&&(memberAreas[t.resp]||[]).indexOf(ar.id)>-1)return true;
      return false;
    }).length;
    var row=document.createElement('div');
    row.className='eq-arow'+(ar.id===_selArea?' sel':'');
    row.onclick=(function(id){return function(e){if(!e.target.closest('.eq-arow-del'))selectArea(id);};})(ar.id);
    var icon=document.createElement('div');icon.className='eq-a-icon';
    icon.style.background='linear-gradient(135deg,'+ar.color+'33,'+ar.color+'18)';
    icon.style.border='.5px solid '+ar.color+'44';
    icon.textContent=areaIcon(ar.name);
    var info=document.createElement('div');info.className='eq-a-info';
    info.innerHTML='<div class="eq-a-name">'+ar.name+'</div><div class="eq-a-sub">'+members.length+' persona'+(members.length!==1?'s':'')+' · '+active+' tareas</div>';
    var cnt=document.createElement('span');cnt.className='eq-a-cnt';cnt.textContent=members.length;
    var del=document.createElement('button');del.className='eq-arow-del';del.title='Eliminar área';del.textContent='×';
    del.onclick=(function(id){return function(e){e.stopPropagation();deleteWorkArea(id);};})(ar.id);
    row.appendChild(icon);row.appendChild(info);row.appendChild(cnt);row.appendChild(del);
    list.appendChild(row);
  });
}

// ── SELECT AREA ────────────────────────────────────────────────────

// ── AREA MAIN VIEW (redesigned — mirrors team view) ─────────────────
function getAreaFilteredTasks(ar){
  var all=collectAllTasks();
  // Only show tasks explicitly assigned to this area
  return all.filter(function(t){return t.area===ar.name;});
}
function addMemberToAreaById(mid,areaId){
  if(!memberAreas[mid])memberAreas[mid]=[];
  if(memberAreas[mid].indexOf(areaId)>-1)return;
  memberAreas[mid].push(areaId);
  saveMemberAreas();
  if(_selArea===areaId){renderRightArea(areaId);renderAreaList();renderAreaMain(areaId);}
}

function buildAreaOrgCard(task,ar){
  var card=document.createElement('div');card.className='eq-aorg-card';
  var bar=document.createElement('div');bar.className='eq-aorg-cbar';bar.style.background=task.color||ar.color;
  var info=document.createElement('div');info.style.cssText='flex:1;min-width:0;cursor:pointer;';
  info.title='Editar tarea';
  var txt=document.createElement('div');txt.className='eq-aorg-ctxt';txt.textContent=task.text;
  var dl=document.createElement('div');dl.className='eq-aorg-cdl';
  dl.textContent=(task.deadline?fmtDl(task.deadline):'Sin fecha')+(task.source&&task.source!=='Tarea libre'?' · '+task.source:'');
  info.appendChild(txt);info.appendChild(dl);
  // Click on info → edit
  info.addEventListener('click',function(e){e.stopPropagation();showAreaTaskEdit(task,ar);});
  card.appendChild(bar);card.appendChild(info);
  if(task.resp){
    var rm=getMember(task.resp);
    if(rm){
      var rav=document.createElement('div');rav.className='eq-aorg-rav';rav.style.background=rm.color||'#1A6FD4';
      var ravd=memberAvatars[rm.id];
      if(ravd){var ri=document.createElement('img');ri.src=ravd;rav.appendChild(ri);}
      else rav.textContent=rm.id;
      card.appendChild(rav);
    }
  }
  // Edit icon on hover
  var editBtn=document.createElement('div');editBtn.className='eq-aorg-edit-btn';editBtn.textContent='✏️';editBtn.title='Editar';
  editBtn.addEventListener('click',function(e){e.stopPropagation();showAreaTaskEdit(task,ar);});
  card.appendChild(editBtn);
  if(!task.done)initAreaOrgDrag(card,task,ar);
  return card;
}

function initAreaOrgDrag(card,task,ar){
  card.addEventListener('pointerdown',function(e){
    if(e.button!==0)return;
    e.preventDefault();card.setPointerCapture(e.pointerId);
    var sx=e.clientX,sy=e.clientY,moved=false,ghost=null;
    function onMove(ev){
      if(!ghost&&(Math.abs(ev.clientX-sx)>7||Math.abs(ev.clientY-sy)>7)){
        moved=true;
        ghost=document.createElement('div');ghost.className='eq-aorg-ghost';
        ghost.textContent=task.text;
        ghost.style.left=(ev.clientX+12)+'px';ghost.style.top=(ev.clientY-16)+'px';
        document.body.appendChild(ghost);card.classList.add('at-dragging');
        _aorgDrag={ghost:ghost,card:card,task:task,ar:ar};
      }
      if(ghost){ghost.style.left=(ev.clientX+12)+'px';ghost.style.top=(ev.clientY-16)+'px';}
      document.querySelectorAll('.eq-aorg-mcard').forEach(function(mc){
        var r=mc.getBoundingClientRect();
        mc.classList.toggle('drop-over',ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom);
      });
    }
    function onUp(ev){
      card.removeEventListener('pointermove',onMove);card.removeEventListener('pointerup',onUp);
      if(ghost&&ghost.parentNode)ghost.parentNode.removeChild(ghost);ghost=null;
      card.classList.remove('at-dragging');
      var dropped=null;
      document.querySelectorAll('.eq-aorg-mcard').forEach(function(mc){
        var r=mc.getBoundingClientRect();
        if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom)dropped=mc.dataset.mid;
        mc.classList.remove('drop-over');
      });
      _aorgDrag=null;
      if(moved&&dropped)teamTaskUpdate(task,{resp:dropped,area:ar.name});
    }
    card.addEventListener('pointermove',onMove);card.addEventListener('pointerup',onUp);
  });
}

function genMemberId(name){
  var parts=name.trim().split(/\s+/);
  var id=parts.map(function(p){return p.charAt(0).toUpperCase();}).join('').slice(0,3);
  // Ensure uniqueness
  var existing=teamMembers.map(function(m){return m.id;});
  if(existing.indexOf(id)===-1)return id;
  for(var i=2;i<99;i++){var try2=id+i;if(existing.indexOf(try2)===-1)return try2;}
  return id+Date.now().toString().slice(-3);
}

// Drag entre zona prioridades ↔ zona hoy
function initHoyDrag(card,task,mid,prioZone,todayZone,srcZone){
  card.addEventListener('pointerdown',function(e){
    // Ignore right-click, buttons, and checkboxes — info area is allowed (threshold distinguishes click vs drag)
    if(e.button!==0||e.target.closest('button')||e.target.closest('.eq-tcard-chk')||e.target.closest('.eq-hcard-chk'))return;
    var sx=e.clientX,sy=e.clientY,dragging=false,ghost=null,captured=false;
    var pid=e.pointerId;
    var dropZone=srcZone==='prio'?todayZone:prioZone;
    function onMove(ev){
      var dx=ev.clientX-sx,dy=ev.clientY-sy;
      if(!dragging&&Math.sqrt(dx*dx+dy*dy)>8){
        dragging=true;
        // Capture only when drag actually starts (won't interfere with clicks)
        if(!captured){try{card.setPointerCapture(pid);}catch(err){}captured=true;}
        ghost=document.createElement('div');ghost.className='eq-hoy-ghost';
        ghost.textContent=task.text;ghost.style.cssText='position:fixed;z-index:9998;pointer-events:none;';
        document.body.appendChild(ghost);
        card.style.opacity='.3';
      }
      if(dragging&&ghost){
        ghost.style.left=(ev.clientX-40)+'px';ghost.style.top=(ev.clientY-22)+'px';
        var r=dropZone.getBoundingClientRect();
        var over=ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom;
        dropZone.classList.toggle('drop-over',over);
      }
    }
    function onUp(ev){
      document.removeEventListener('pointermove',onMove);document.removeEventListener('pointerup',onUp);
      if(ghost){ghost.remove();ghost=null;}
      card.style.opacity='';dropZone.classList.remove('drop-over');
      if(dragging){
        // Suppress the click that would fire after pointerup (prevents edit modal on drag-release)
        card.addEventListener('click',function stopClick(ce){ce.stopPropagation();ce.preventDefault();},{once:true,capture:true});
        var r=dropZone.getBoundingClientRect();
        if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom){
          toggleTaskPriority(task,mid);
        }
      }
      dragging=false;captured=false;
    }
    document.addEventListener('pointermove',onMove);document.addEventListener('pointerup',onUp);
  });
}

function renderHoy(mid,cont,all){
  var ds=today();var t=new Date();t.setHours(0,0,0,0);

  // Prioridades del día — include done (trophy)
  var prioAll=all.filter(function(x){return!!x.priority&&(x.deadline===ds||!x.deadline);});
  var prioUndone=prioAll.filter(function(x){return!x.done;});
  var prioDone=prioAll.filter(function(x){return x.done;});

  // Tareas de hoy (no prioridad) — include done (tachadas)
  var todayAll=all.filter(function(x){return x.deadline===ds&&!x.priority;});
  var todayUndone=todayAll.filter(function(x){return!x.done;});
  var todayDone=todayAll.filter(function(x){return x.done;});

  // Atrasadas — solo sin completar
  var overdue=all.filter(function(x){if(!x.deadline||x.done)return false;return new Date(x.deadline+'T00:00:00')<t;});

  // Próximos 3 días — solo sin completar
  var upcoming=all.filter(function(x){
    if(!x.deadline||x.done)return false;
    var d=new Date(x.deadline+'T00:00:00');var diff=Math.floor((d-t)/86400000);
    return diff>0&&diff<=3;
  });

  // ── Bloque conectado: Prioridades + Hoy ────────────────────────
  var block=document.createElement('div');block.className='eq-hoy-block';

  var prioZone=document.createElement('div');prioZone.className='eq-hoy-prio-zone';
  // Build prioridades header — with big trophy when ALL are done
  var allPrioDone=prioAll.length>0&&prioUndone.length===0;
  var prioHdr=document.createElement('div');prioHdr.className='eq-shdr';
  if(allPrioDone){
    var trophyBig=document.createElement('span');
    var doAnim=!!window._prioJustAllDone;window._prioJustAllDone=false;
    trophyBig.className='eq-prio-all-trophy'+(doAnim?' pop':'');trophyBig.textContent='🏆';
    prioHdr.appendChild(trophyBig);
  }
  prioHdr.appendChild(document.createTextNode('⭐ Prioridades del día'+(prioAll.length?' — '+prioUndone.length+'/'+prioAll.length:'')));
  prioZone.appendChild(prioHdr);

  var todayZone=document.createElement('div');todayZone.className='eq-hoy-today-zone';
  todayZone.appendChild(mkSHdr('Hoy'+(todayAll.length?' — '+todayAll.length:''),'blue'));

  // Llenar zonas (ambas referencias ya existen → se puede iniciar drag)
  if(!prioAll.length){prioZone.appendChild(mkSecEmpty('Sin prioridades para hoy'));}
  else{
    prioUndone.forEach(function(t2){var c=buildHoyCard(t2,mid,true,{});initHoyDrag(c,t2,mid,prioZone,todayZone,'prio');prioZone.appendChild(c);});
    prioDone.forEach(function(t2){prioZone.appendChild(buildHoyCard(t2,mid,true,{}));});
  }

  if(!todayAll.length){todayZone.appendChild(mkSecEmpty('Todo al día'));}
  else{
    todayUndone.forEach(function(t2){var c=buildHoyCard(t2,mid,false,{showTomorrow:true});initHoyDrag(c,t2,mid,prioZone,todayZone,'today');todayZone.appendChild(c);});
    todayDone.forEach(function(t2){todayZone.appendChild(buildHoyCard(t2,mid,false,{}));});
  }

  block.appendChild(prioZone);
  var sep=document.createElement('div');sep.className='eq-hoy-zone-sep';block.appendChild(sep);
  block.appendChild(todayZone);
  cont.appendChild(block);

  // ── Atrasadas — siempre visible ─────────────────────────────────
  cont.appendChild(mkSHdr('Atrasadas'+(overdue.length?' — '+overdue.length:''),'red'));
  if(overdue.length){overdue.forEach(function(t2){cont.appendChild(buildHoyCard(t2,mid,false,{showToday:true}));});}
  else{cont.appendChild(mkSecEmpty('Sin tareas atrasadas'));}

  // ── Próximos 3 días — siempre visible, lista plana ──────────────
  cont.appendChild(mkSHdr('Próximos 3 días'+(upcoming.length?' — '+upcoming.length:''),''));
  if(upcoming.length){upcoming.forEach(function(t2){cont.appendChild(buildUpcomingCard(t2,mid));});}
  else{cont.appendChild(mkSecEmpty('Sin tareas próximas'));}

  // ── Sin fecha — tareas asignadas sin fecha límite ─────────────────
  var noDate=all.filter(function(x){return!x.deadline&&!x.priority&&!x.done;});
  if(noDate.length){
    cont.appendChild(mkSHdr('Sin fecha — '+noDate.length,''));
    noDate.forEach(function(t2){cont.appendChild(buildHoyCard(t2,mid,false,{}));});
  }
}

// ── TAB: SEMANA ────────────────────────────────────────────────────
function renderSemana(mid,cont,all){
  var ds=today();
  var allSecs=[];
  var draggableCards=[];

  weekDates().forEach(function(dayDate){
    var dayDs=fmt(dayDate);
    var dayTks=all.filter(function(t){return t.deadline===dayDs&&!t.done;});
    var doneTks=all.filter(function(t){return t.deadline===dayDs&&t.done;});
    var isToday=dayDs===ds;

    var sec=document.createElement('div');sec.className='eq-wday';sec.dataset.dayDs=dayDs;
    allSecs.push(sec);

    // ── Day header — always shown ──
    var dh=document.createElement('div');dh.className='eq-wday-hdr';
    var dn=document.createElement('span');
    dn.className='eq-wday-name'+(isToday?' today':'');
    dn.textContent=(isToday?'HOY — ':'')+DS[dayDate.getDay()]+' '+dayDate.getDate()+' '+MN[dayDate.getMonth()];
    var dl=document.createElement('div');dl.className='eq-wline';
    var dc=document.createElement('span');dc.className='eq-wcnt';
    if(!dayTks.length&&!doneTks.length){dc.style.opacity='.3';dc.textContent='—';}
    else if(!dayTks.length&&doneTks.length){dc.style.color='#27AE72';dc.style.background='rgba(39,174,114,.12)';dc.textContent='✓ '+doneTks.length;}
    else dc.textContent=dayTks.length;
    dh.appendChild(dn);dh.appendChild(dl);dh.appendChild(dc);sec.appendChild(dh);

    // ── Pending tasks (draggable) ──
    if(dayTks.length){
      dayTks.forEach(function(t){
        var card=buildTCard(t,mid);
        card.style.touchAction='none';
        sec.appendChild(card);
        draggableCards.push({card:card,task:t});
      });
    } else if(!doneTks.length){
      var emp=document.createElement('div');
      emp.style.cssText='padding:7px 12px 10px;font-size:10px;color:rgba(255,255,255,.13);font-style:italic;';
      emp.textContent='Sin tareas · suelta aquí para mover';
      sec.appendChild(emp);
    }

    // ── Done tasks ──
    doneTks.forEach(function(t){sec.appendChild(buildTCard(t,mid));});

    cont.appendChild(sec);
  });

  // Init drag on all undone cards once all sections exist in DOM
  draggableCards.forEach(function(cd){
    initSemanaCardDrag(cd.card,cd.task,mid,allSecs);
  });
}

// ── DRAG BETWEEN WEEK DAYS ─────────────────────────────────────────
function initSemanaCardDrag(card,task,mid,allSecs){
  card.addEventListener('pointerdown',function(e){
    if(e.button!==0)return;
    if(e.target.closest('button')||e.target.closest('.eq-tcard-chk'))return;
    var rect=card.getBoundingClientRect();
    var offX=e.clientX-rect.left,offY=e.clientY-rect.top;
    var startX=e.clientX,startY=e.clientY;
    var dragging=false,floater=null,phantom=null,lastSec=null;

    function onMove(e2){
      var dx=e2.clientX-startX,dy=e2.clientY-startY;
      if(!dragging&&Math.sqrt(dx*dx+dy*dy)>7){
        dragging=true;
        card.setPointerCapture(e.pointerId);

        // Phantom: dashed outline that stays at insertion point
        phantom=document.createElement('div');
        phantom.style.cssText='height:'+card.offsetHeight+'px;margin-bottom:6px;border-radius:10px;border:1.5px dashed rgba(90,180,232,.38);background:rgba(90,180,232,.04);flex-shrink:0;pointer-events:none;box-sizing:border-box;';

        // Floater: full-quality card clone that follows cursor
        floater=card.cloneNode(true);
        floater.style.cssText='position:fixed;left:'+rect.left+'px;top:'+rect.top+'px;width:'+rect.width+'px;z-index:12000;pointer-events:none;opacity:.97;box-shadow:0 18px 52px rgba(0,0,0,.8);transform:scale(1.025) rotate(-.5deg);margin:0;border-radius:10px;';
        document.body.appendChild(floater);

        // Fade original in place (acts as source indicator)
        card.style.opacity='0.15';
        card.style.pointerEvents='none';

        allSecs.forEach(function(s){s.classList.add('sem-can-drop');});
      }

      if(dragging&&floater){
        floater.style.left=(e2.clientX-offX)+'px';
        floater.style.top=(e2.clientY-offY)+'px';

        // Find which section cursor is over (with generous hitbox)
        var targetSec=null;
        allSecs.forEach(function(s){
          s.classList.remove('sem-drop-over');
          var r=s.getBoundingClientRect();
          if(e2.clientY>=r.top-12&&e2.clientY<=r.bottom+12)targetSec=s;
        });

        if(targetSec){
          targetSec.classList.add('sem-drop-over');
          lastSec=targetSec;

          // Find insertion point: which eq-tcard is the cursor above the midpoint of?
          var cards=Array.from(targetSec.querySelectorAll('.eq-tcard')).filter(function(c){return c!==card;});
          var insertBefore=null;
          for(var i=0;i<cards.length;i++){
            var cr=cards[i].getBoundingClientRect();
            if(e2.clientY<cr.top+cr.height/2){insertBefore=cards[i];break;}
          }
          // Move phantom to insertion point (causes other cards to shift)
          if(insertBefore){targetSec.insertBefore(phantom,insertBefore);}
          else{
            // Append after last tcard
            var all2=targetSec.querySelectorAll('.eq-tcard');
            var ref=all2.length?all2[all2.length-1].nextSibling:null;
            if(ref)targetSec.insertBefore(phantom,ref);
            else targetSec.appendChild(phantom);
          }
        }
      }
    }

    function onUp(e2){
      document.removeEventListener('pointermove',onMove);
      document.removeEventListener('pointerup',onUp);

      if(floater){floater.remove();floater=null;}
      if(phantom){phantom.remove();phantom=null;}
      card.style.opacity='';card.style.pointerEvents='';
      allSecs.forEach(function(s){s.classList.remove('sem-drop-over');s.classList.remove('sem-can-drop');});

      if(dragging){
        card.addEventListener('click',function stop(ce){ce.stopPropagation();ce.preventDefault();},{once:true,capture:true});
        if(lastSec){
          var newDs=lastSec.dataset.dayDs;
          if(newDs&&newDs!==task.deadline){rescheduleTask(task,mid,newDs);return;}
        }
      }
    }

    document.addEventListener('pointermove',onMove);
    document.addEventListener('pointerup',onUp);
  });
}

  if(!task.done){
    var acts=document.createElement('div');acts.className='eq-tcard-actions';

    var starBtn=document.createElement('button');starBtn.className='eq-tcard-act star'+(task.priority?' on':'');

      rescheduleTask(t,mbid,fmt(nm));
    };})(task,mid);

var _eqDpEl=null;
var _EQ_MNS=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
var _EQ_DAYS=['L','M','X','J','V','S','D'];
function openEqDatePicker(anchorEl, currentDs, onPick){
  closeEqDatePicker();
  var ts=today();
  var initDate=currentDs?new Date(currentDs+'T00:00:00'):new Date();
  var viewY=initDate.getFullYear(), viewM=initDate.getMonth();
  function build(){
    if(_eqDpEl){_eqDpEl.remove();}
    _eqDpEl=document.createElement('div');_eqDpEl.className='eq-datepick';
    // Header
    var hdr=document.createElement('div');hdr.className='eq-datepick-hdr';
    var prev=document.createElement('button');prev.className='eq-datepick-nav';prev.textContent='‹';
    prev.onclick=function(e){e.stopPropagation();if(viewM===0){viewM=11;viewY--;}else viewM--;build();};
    var lbl=document.createElement('div');lbl.className='eq-datepick-lbl';lbl.textContent=_EQ_MNS[viewM]+' '+viewY;
    var next=document.createElement('button');next.className='eq-datepick-nav';next.textContent='›';
    next.onclick=function(e){e.stopPropagation();if(viewM===11){viewM=0;viewY++;}else viewM++;build();};
    hdr.appendChild(prev);hdr.appendChild(lbl);hdr.appendChild(next);
    // Grid
    var grid=document.createElement('div');grid.className='eq-datepick-grid';
    _EQ_DAYS.forEach(function(d){var c=document.createElement('div');c.className='eq-datepick-wday';c.textContent=d;grid.appendChild(c);});
    var first=new Date(viewY,viewM,1);
    var startDow=first.getDay();var off=(startDow===0?6:startDow-1);
    var dim=new Date(viewY,viewM+1,0).getDate();
    var prevDim=new Date(viewY,viewM,0).getDate();
    for(var i=0;i<off;i++){var cx=document.createElement('div');cx.className='eq-datepick-day other';cx.textContent=prevDim-off+1+i;grid.appendChild(cx);}
    for(var d=1;d<=dim;d++){
      var ds=viewY+'-'+String(viewM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      var cx2=document.createElement('div');cx2.className='eq-datepick-day';cx2.textContent=d;
      if(ds===ts)cx2.classList.add('today');

      (function(dsi,el){el.onclick=function(e){e.stopPropagation();currentDs=dsi;onPick(dsi);closeEqDatePicker();};})(ds,cx2);
      grid.appendChild(cx2);
    }
    var total=off+dim;var rem=7-total%7;if(rem<7)for(var j=1;j<=rem;j++){var cx3=document.createElement('div');cx3.className='eq-datepick-day other';cx3.textContent=j;grid.appendChild(cx3);}
    _eqDpEl.appendChild(hdr);_eqDpEl.appendChild(grid);
    document.body.appendChild(_eqDpEl);
    // Position
    var rect=anchorEl.getBoundingClientRect();
    var top=rect.bottom+6, left=rect.left;
    if(left+240>window.innerWidth)left=window.innerWidth-246;
    if(top+290>window.innerHeight)top=rect.top-296;
    _eqDpEl.style.top=top+'px';_eqDpEl.style.left=left+'px';
  }
  build();
  setTimeout(function(){
    document.addEventListener('pointerdown',function hdl(e){
      if(_eqDpEl&&!_eqDpEl.contains(e.target)){closeEqDatePicker();document.removeEventListener('pointerdown',hdl);}
    });
  },10);
}

  // Solo tareas con deadline esta semana (hoy → +6 días)
  function isThisWeek(t){
    if(!t.deadline)return false;
    var d=new Date(t.deadline+'T00:00:00');return d>=t0&&d<t7;
  }

  var allTasks=getMemberTasks(mid);

  // Completadas esta semana
  var doneTasks=[];
  (standaloneTasks||[]).forEach(function(t){
    if((t.resp||'')===mid&&t.done&&isThisWeek(t))
      doneTasks.push(Object.assign({},t,{type:'standalone',source:'Tarea libre',color:'rgba(255,255,255,.28)'}));
  });
  (projects||[]).forEach(function(p){
    if(p.catId==='cotizaciones'||!p.stageTasks)return;
    Object.keys(p.stageTasks).forEach(function(stage){
      (p.stageTasks[stage]||[]).forEach(function(t){

      });
    });
  });

  // Activas solo esta semana
  var activeTasks=allTasks.filter(function(t){return!t.done&&isThisWeek(t);});
  var colData={
    notstarted:activeTasks.filter(function(t){return!t.colStatus||t.colStatus==='notstarted';}),
    inprogress:activeTasks.filter(function(t){return t.colStatus==='inprogress';}),
    done:doneTasks
  };
  var cols=[
    {id:'notstarted',label:'Sin empezar',cls:'cn',dot:'#5AB4E8'},
    {id:'inprogress',label:'En proceso',cls:'cp',dot:'#E8A020'},
    {id:'done',label:'Concluidas',cls:'cd',dot:'#27AE72'}
  ];

  var kanban=document.createElement('div');kanban.className='eq-kanban';
  cols.forEach(function(col){
    var tasks=colData[col.id]||[];
    var colEl=document.createElement('div');colEl.className='eq-kcol '+col.cls;
    var hdr=document.createElement('div');hdr.className='eq-kcol-hdr';
    var dot=document.createElement('div');dot.className='eq-kcol-dot';dot.style.background=col.dot;
    var ttl=document.createElement('span');ttl.className='eq-kcol-ttl';ttl.textContent=col.label;
    var cnt=document.createElement('span');cnt.className='eq-kcol-cnt';cnt.textContent=tasks.length;
    hdr.appendChild(dot);hdr.appendChild(ttl);hdr.appendChild(cnt);colEl.appendChild(hdr);
    var body=document.createElement('div');body.className='eq-kcol-body';body.dataset.colid=col.id;
    if(!tasks.length){var emp=document.createElement('div');emp.className='eq-kcol-empty';emp.textContent='Sin tareas';body.appendChild(emp);}
    tasks.forEach(function(task){body.appendChild(buildKCard(task,col.id,mid));});
    colEl.appendChild(body);kanban.appendChild(colEl);
  });
  cont.appendChild(kanban);

function buildKCard(task,colId,mid){

  var parts=[];if(task.source&&task.source!=='Tarea libre')parts.push(task.source);if(task.stage)parts.push(task.stage);
  meta.textContent=parts.join(' · ')||'Tarea libre';

// ── KANBAN DRAG ────────────────────────────────────────────────────
function initKDrag(card,task,colId,mid){
  card.addEventListener('pointerdown',function(e){
    if(e.button!==0)return;
    if(e.target.closest('.eq-kchk'))return;
    e.preventDefault();
    card.setPointerCapture(e.pointerId);
    var rect=card.getBoundingClientRect();
    var ghost=document.createElement('div');
    ghost.className='eq-k-ghost';
    ghost.innerHTML=card.innerHTML;
    ghost.style.width=rect.width+'px';
    ghost.style.left=rect.left+'px';
    ghost.style.top=rect.top+'px';
    document.body.appendChild(ghost);
    var ph=document.createElement('div');ph.className='eq-k-ph';ph.style.minHeight=rect.height+'px';
    card.parentNode.insertBefore(ph,card.nextSibling);
    card.classList.add('k-dragging');
    _kDrag={ghost:ghost,card:card,ph:ph,task:task,colId:colId,mid:mid,ox:e.clientX-rect.left,oy:e.clientY-rect.top};
    document.addEventListener('pointermove',onKMove);
    document.addEventListener('pointerup',onKUp);
  });
}

function onKMove(e){
  if(!_kDrag)return;
  _kDrag.ghost.style.left=(e.clientX-_kDrag.ox)+'px';
  _kDrag.ghost.style.top=(e.clientY-_kDrag.oy)+'px';
  // Find target column body
  var bodies=document.querySelectorAll('.eq-kcol-body');
  var target=null;
  bodies.forEach(function(b){
    var r=b.getBoundingClientRect();
    if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top-48&&e.clientY<=r.bottom+48)target=b;
  });
  if(!target)return;
  // Find insertion point (live shift)
  var cards=Array.from(target.querySelectorAll('.eq-kcard:not(.k-dragging)'));
  var insertBefore=null;
  for(var i=0;i<cards.length;i++){
    var r=cards[i].getBoundingClientRect();
    if(e.clientY<r.top+r.height/2){insertBefore=cards[i];break;}
  }
  if(insertBefore){target.insertBefore(_kDrag.ph,insertBefore);}
  else{target.appendChild(_kDrag.ph);}
}

function onKUp(e){
  if(!_kDrag)return;
  document.removeEventListener('pointermove',onKMove);
  document.removeEventListener('pointerup',onKUp);
  var ghost=_kDrag.ghost;var card=_kDrag.card;var ph=_kDrag.ph;
  var task=_kDrag.task;var mid=_kDrag.mid;var fromCol=_kDrag.colId;
  if(ghost.parentNode)ghost.parentNode.removeChild(ghost);
  card.classList.remove('k-dragging');
  var targetColBody=ph.parentNode;
  var toCol=targetColBody?targetColBody.dataset.colid:null;
  if(ph.parentNode)ph.parentNode.removeChild(ph);
  _kDrag=null;
  if(toCol&&toCol!==fromCol){updateKColStatus(task,toCol,mid);}
}

function updateKColStatus(task,toCol,mid){
  var done=toCol==='done';
  var colStatus=done?'done':toCol;
  if(task.type==='standalone'){
    standaloneTasks=standaloneTasks.map(function(t){return t.id===task.id?Object.assign({},t,{done:done,colStatus:colStatus}):t;});
  } else {
    for(var i=0;i<projects.length;i++){
      if(projects[i].id===task.projId&&projects[i].stageTasks&&projects[i].stageTasks[task.stage]){
        projects[i].stageTasks[task.stage]=projects[i].stageTasks[task.stage].map(function(t){return t.id===task.id?Object.assign({},t,{done:done,colStatus:colStatus}):t;});
        break;
      }
    }
  }
  saveTaskChange();renderMain(mid);renderStats(mid);renderTeamList();
}

document.getElementById('avatarFileInp').onchange=function(){
  var file=this.files[0];if(!file||!_avatarFor)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var ctx=canvas.getContext('2d');
      if(_avatarFor==='_team'){
        // Wide banner crop (3:1) for team header
        canvas.width=480;canvas.height=200;
        var srcR=img.width/img.height,tgtR=480/200;
        var sw,sh,sx2,sy2;
        if(srcR>tgtR){sh=img.height;sw=sh*tgtR;sx2=(img.width-sw)/2;sy2=0;}
        else{sw=img.width;sh=sw/tgtR;sx2=0;sy2=0;}
        ctx.drawImage(img,sx2,sy2,sw,sh,0,0,480,200);
      } else {
        // Square crop from top-center for member avatars
        canvas.width=canvas.height=320;
        var s=Math.min(img.width,img.height);
        var sx=(img.width-s)/2,sy=0;
        ctx.drawImage(img,sx,sy,s,s,0,0,320,320);
      }
      memberAvatars[_avatarFor]=canvas.toDataURL('image/jpeg',0.82);
      _avatarFor=null;saveAvatars();renderAll();
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);this.value='';
};

  document.getElementById('remInp').value='';
  document.getElementById('remWrap').style.display='none';
  saveReminders();renderReminders(_mid);
}
function toggleReminder(mid,rid){
  if(!memberReminders[mid])return;
  memberReminders[mid].items=(memberReminders[mid].items||[]).map(function(r){
    return r.id===rid?Object.assign({},r,{done:!r.done}):r;
  });
  saveReminders();renderReminders(mid);
}
function deleteReminder(mid,rid){
  if(!memberReminders[mid])return;
  memberReminders[mid].items=(memberReminders[mid].items||[]).filter(function(r){return r.id!==rid;});
  saveReminders();renderReminders(mid);
}

function renderGoals(mid){renderGList('week',mid);renderGList('month',mid);}

function renderGList(type,mid){
  var elId=type==='week'?'glWeek':'glMonth';
  var listEl=document.getElementById(elId);if(!listEl)return;
  listEl.innerHTML='';
  var key=type==='week'?'weekGoals':'monthGoals';
  var goals=((memberGoals[mid]||{})[key])||[];
  if(!goals.length){var e=document.createElement('div');e.className='eq-gempty';e.textContent='Sin metas — agrega con +';listEl.appendChild(e);return;}
  goals.forEach(function(g){
    var item=document.createElement('div');item.className='eq-gitem';
    var chk=document.createElement('div');chk.className='eq-gchk'+(g.done?' done':'');
    chk.onclick=(function(gid,tp,mbid){return function(){toggleGoal(mbid,tp,gid);};})(g.id,type,mid);
    var gtxt=document.createElement('span');gtxt.className='eq-gtxt'+(g.done?' done':'');gtxt.textContent=g.text;
    var del=document.createElement('button');del.className='eq-gdel';del.textContent='×';
    del.onclick=(function(gid,tp,mbid){return function(){deleteGoal(mbid,tp,gid);};})(g.id,type,mid);
    item.appendChild(chk);item.appendChild(gtxt);item.appendChild(del);listEl.appendChild(item);
  });
  var done=goals.filter(function(g){return g.done;}).length;
  if(goals.length>0&&done===goals.length){
    var b=document.createElement('div');b.className='eq-gbonus';b.textContent='🏆 ¡Metas cumplidas!';listEl.appendChild(b);
  }
}

function toggleGoal(mid,type,goalId){
  if(!memberGoals[mid])return;
  var key=type==='week'?'weekGoals':'monthGoals';
  memberGoals[mid][key]=(memberGoals[mid][key]||[]).map(function(g){return g.id===goalId?Object.assign({},g,{done:!g.done}):g;});
  saveGoals();renderGList(type,mid);
}

function deleteGoal(mid,type,goalId){
  if(!memberGoals[mid])return;
  var key=type==='week'?'weekGoals':'monthGoals';
  memberGoals[mid][key]=(memberGoals[mid][key]||[]).filter(function(g){return g.id!==goalId;});
  saveGoals();renderGList(type,mid);
}

function addGoal(type){
  var inpId=type==='week'?'wkInp':'moInp';
  var text=document.getElementById(inpId).value.trim();
  if(!text||!_mid)return;
  if(!memberGoals[_mid])memberGoals[_mid]={};
  var key=type==='week'?'weekGoals':'monthGoals';
  if(!memberGoals[_mid][key])memberGoals[_mid][key]=[];
  memberGoals[_mid][key].push({id:Date.now(),text:text,done:false});
  document.getElementById(inpId).value='';
  document.getElementById(type==='week'?'wkWrap':'moWrap').style.display='none';
  saveGoals();renderGList(type,_mid);
}

function setupGBtn(btnId,wrapId,inpId,type){
  document.getElementById(btnId).onclick=function(){
    if(!_mid)return;
    var w=document.getElementById(wrapId);
    var open=w.style.display!=='none';
    w.style.display=open?'none':'';
    if(!open)document.getElementById(inpId).focus();
  };
  document.getElementById(inpId).addEventListener('keydown',function(e){
    if(e.key==='Enter')addGoal(type);
    if(e.key==='Escape'){this.value='';document.getElementById(wrapId).style.display='none';}
  });
}
setupGBtn('btnWk','wkWrap','wkInp','week');
setupGBtn('btnMo','moWrap','moInp','month');
document.getElementById('btnRem').onclick=function(){
  if(!_mid)return;
  var w=document.getElementById('remWrap');
  var open=w.style.display!=='none';
  w.style.display=open?'none':'';
  if(!open)document.getElementById('remInp').focus();
};
document.getElementById('remInp').addEventListener('keydown',function(e){
  if(e.key==='Enter')addReminder();
  if(e.key==='Escape'){this.value='';document.getElementById('remWrap').style.display='none';}
});

// Enter key on add-member inputs
document.getElementById('newMName').addEventListener('keydown',function(e){if(e.key==='Enter')saveNewMember();if(e.key==='Escape')toggleAddForm();});
</script>
</body>
