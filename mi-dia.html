<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>document.documentElement.style.setProperty("--vh",window.innerHeight+"px");</script>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1A6FD4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trazzo">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<title>Mi día — Dcoder Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html{height:-webkit-fill-available;}
body{height:100%;min-height:-webkit-fill-available;background:#0c0c0c;color:#fff;font-family:'Inter',sans-serif;overflow:hidden;}

/* ── PAGE SHELL (no shared topbar here — more room for the notebook) ── */
.layout{display:flex;flex-direction:column;height:100dvh;height:var(--vh,100vh);overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#17120c 0%,#0c0c0c 60%);}

/* ── TOP ROW: back button + day nav, all in one compact bar ── */
.day-nav{flex-shrink:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:8px 14px 4px;}
.back-btn{justify-self:start;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.6);font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:20px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
.back-btn:hover{background:rgba(255,255,255,0.12);color:#fff;}
.day-nav-center{display:flex;align-items:center;justify-content:center;gap:12px;}
.day-nav-spacer{justify-self:end;}
.day-arrow{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.6);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.day-arrow:hover{background:rgba(255,255,255,0.12);color:#fff;}
.day-label{font-size:14px;font-weight:700;color:#f3ead9;min-width:170px;text-align:center;text-transform:capitalize;}
.day-today-btn{background:rgba(232,160,32,0.14);border:0.5px solid rgba(232,160,32,0.32);color:#E8A020;font-size:11px;font-weight:700;padding:5px 13px;border-radius:20px;cursor:pointer;font-family:'Inter',sans-serif;transition:background .15s;}
.day-today-btn:hover{background:rgba(232,160,32,0.24);}
.day-today-btn:disabled{opacity:.35;cursor:default;}

/* ── NOTEBOOK ── */
.notebook-outer{flex:1;min-height:0;display:flex;justify-content:center;padding:2px 8px 6px;overflow:hidden;}
.notebook{flex:1;max-width:1600px;min-height:0;display:flex;background:linear-gradient(160deg,#2a2018 0%,#1c160f 100%);border-radius:14px;box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,0.04) inset;overflow:hidden;}
.nb-page{flex:1;min-width:0;background:
    repeating-linear-gradient(transparent 0 30px, rgba(140,110,70,0.1) 30px 31px),
    linear-gradient(135deg,#f6eeda 0%,#ede1c4 100%);
  display:flex;flex-direction:column;overflow-y:auto;position:relative;}
.nb-page::-webkit-scrollbar{width:5px;}
.nb-page::-webkit-scrollbar-thumb{background:rgba(90,60,20,0.18);border-radius:3px;}
/* Dog-eared corner — a well-loved notebook has a curled page corner */
.nb-page::before{content:'';position:absolute;right:0;bottom:0;width:30px;height:30px;
  background:linear-gradient(135deg,transparent 50%,rgba(90,60,20,0.16) 50%);
  border-top:0.5px solid rgba(90,60,20,0.12);border-left:0.5px solid rgba(90,60,20,0.12);
  pointer-events:none;}
.nb-rings{width:26px;flex-shrink:0;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,.08) 40%,rgba(0,0,0,.08) 60%,rgba(0,0,0,.35));display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:18px 0;}
.nb-ring{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8d8d8d,#3a3a3a 70%);box-shadow:0 1px 3px rgba(0,0,0,.5) inset,0 1px 1px rgba(255,255,255,.2);flex-shrink:0;}

/* ── LEFT PAGE: priorities + tasks ── */
.nb-page-left{position:relative;}
/* Classic ruled-paper margin line */
.nb-page-left::after{content:'';position:absolute;left:46px;top:0;bottom:0;width:1px;background:rgba(190,70,70,0.28);pointer-events:none;}
.nb-left-inner{padding:18px 22px 22px 56px;position:relative;}
.nb-title{font-family:'Inter',sans-serif;font-size:26px;font-weight:800;letter-spacing:-.01em;color:#3a2e1c;line-height:1;position:relative;z-index:1;}
.nb-tape{position:absolute;top:10px;left:40px;width:84px;height:22px;background:rgba(232,160,32,0.28);border:0.5px solid rgba(232,160,32,0.15);transform:rotate(-3deg);box-shadow:0 2px 4px rgba(0,0,0,.08);pointer-events:none;z-index:0;}
.nb-subtitle{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(58,46,28,0.4);margin-top:4px;}
.nb-box{margin-top:20px;border:1.5px solid rgba(58,46,28,0.22);border-radius:10px;padding:14px 16px 10px;background:rgba(255,255,255,0.22);}
.nb-box-hdr{display:flex;align-items:center;gap:7px;margin-bottom:6px;}
.nb-box-title{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#5c4425;}
.nb-box-cnt{margin-left:auto;font-size:10px;font-weight:700;color:rgba(92,68,37,0.5);}
.nb-empty{font-size:12px;font-style:italic;color:rgba(58,46,28,0.35);padding:4px 2px 2px;}
.nb-task-row{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid rgba(58,46,28,0.1);cursor:grab;touch-action:none;}
.nb-task-row:last-child{border-bottom:none;}
.nb-task-row.dragging{opacity:.35;}
.nb-prio-box{background:rgba(232,160,32,0.14);border-color:rgba(160,110,20,0.32);}
.nb-prio-box .nb-box-title{color:#8a5a0f;}
.nb-prio-box .nb-task-row{border-bottom-color:rgba(138,90,15,0.16);}
.nb-prio-box .nb-chk{border-color:rgba(138,90,15,0.45);}
.nb-prio-box .nb-chk.on{background:#b9790f;border-color:#b9790f;}
.nb-chk{width:18px;height:18px;border-radius:50%;border:1.6px solid rgba(58,46,28,0.4);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .12s;}
.nb-chk.on{background:#5c7a4a;border-color:#5c7a4a;}
.nb-chk.on::after{content:'✓';color:#fff;font-size:11px;font-weight:800;}
.nb-task-txt{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:#3a2e1c;line-height:1.35;}
.nb-task-row.done .nb-task-txt{text-decoration:line-through;color:rgba(58,46,28,0.38);}
.nb-star-btn{background:none;border:none;font-size:15px;line-height:1;cursor:pointer;flex-shrink:0;padding:2px;color:rgba(58,46,28,0.22);}
.nb-star-btn.on{color:#b9790f;}
.nb-add-row{margin-top:4px;}
.nb-add-inp{width:100%;background:none;border:none;border-top:1px dashed rgba(58,46,28,0.2);padding:9px 2px 2px;font-size:13px;font-weight:600;color:#3a2e1c;font-family:'Inter',sans-serif;outline:none;}
.nb-add-inp::placeholder{color:rgba(58,46,28,0.35);}
.nb-drag-ghost{position:fixed;z-index:9998;pointer-events:none;background:#fdf7ea;border:1px solid rgba(58,46,28,0.3);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;color:#3a2e1c;box-shadow:0 10px 24px rgba(0,0,0,.35);max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── RIGHT PAGE: notes canvas ── */
.nb-right-inner{padding:18px 18px 18px;flex:1;display:flex;flex-direction:column;min-height:0;}
.nb-notes-hdr{display:flex;align-items:center;gap:10px;flex-shrink:0;padding:0 4px 10px;}
.nb-notes-title{font-family:'Inter',sans-serif;font-size:14px;font-weight:800;letter-spacing:-.01em;color:#3a2e1c;}
.nb-save-state{font-size:10px;color:rgba(58,46,28,0.4);margin-left:auto;}
.nb-tools{display:flex;align-items:center;gap:6px;}
.nb-tool-btn{width:30px;height:30px;border-radius:8px;border:1.5px solid rgba(58,46,28,0.2);background:rgba(255,255,255,0.3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;padding:0;}
.nb-tool-btn:hover{background:rgba(255,255,255,0.55);}
.nb-tool-btn.active{border-color:rgba(58,46,28,0.55);box-shadow:0 0 0 2px rgba(58,46,28,0.12);}
.nb-tool-dot{width:14px;height:14px;border-radius:50%;}
.nb-tool-btn[data-tool="eraser"]{font-size:13px;}
.nb-canvas-wrap{flex:1;min-height:0;position:relative;border:1.5px solid rgba(58,46,28,0.18);border-radius:10px;overflow:hidden;background:repeating-linear-gradient(transparent 0 27px, rgba(140,110,70,0.14) 27px 28px);touch-action:none;}
#noteCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}

/* ── MOBILE/PORTRAIT ── */
/* A clear fixed split instead of one long scrolling page: tasks get a
   bounded area up top (scrolls on its own if the list is long), notes
   get the rest of the height so the writing surface is never squished. */
@media (max-width:900px){
  .notebook{flex-direction:column;border-radius:14px;}
  .nb-rings{width:100%;height:14px;flex-shrink:0;flex-direction:row;background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.06) 40%,rgba(0,0,0,.06) 60%,rgba(0,0,0,.3));padding:0 18px;}
  .nb-page-left{flex:0 1 42%;min-height:160px;}
  .nb-page-right{flex:1 1 auto;min-height:0;}
  .nb-canvas-wrap{min-height:160px;}
}
@media (max-width:520px){
  .nb-page-left::after{left:28px;}
  .nb-left-inner{padding-left:36px;}
  .nb-tape{left:22px;}
  .nb-title{font-size:26px;}
}
</style>
</head>
<body>

<div class="layout">
  <div class="day-nav">
    <button class="back-btn" onclick="location.href='equipo.html'" title="Volver a Equipo">&#8249; Equipo</button>
    <div class="day-nav-center">
      <button class="day-arrow" id="dayPrevBtn" title="Día anterior">&#8249;</button>
      <div class="day-label" id="dayLabel">—</div>
      <button class="day-arrow" id="dayNextBtn" title="Día siguiente">&#8250;</button>
      <button class="day-today-btn" id="dayTodayBtn">Hoy</button>
    </div>
    <div class="day-nav-spacer"></div>
  </div>

  <div class="notebook-outer">
    <div class="notebook">
      <div class="nb-page nb-page-left">
        <div class="nb-left-inner">
          <div class="nb-tape"></div>
          <div class="nb-title" id="nbTitle">Today</div>
          <div class="nb-subtitle" id="nbSubtitle"></div>

          <div class="nb-box nb-prio-box">
            <div class="nb-box-hdr">
              <span class="nb-box-title">Prioridades</span>
              <span class="nb-box-cnt" id="nbPrioCnt"></span>
            </div>
            <div id="nbPrioList"></div>
          </div>

          <div class="nb-box">
            <div class="nb-box-hdr">
              <span class="nb-box-title">Tareas</span>
              <span class="nb-box-cnt" id="nbTaskCnt"></span>
            </div>
            <div id="nbTaskList"></div>
            <div class="nb-add-row">
              <input class="nb-add-inp" id="nbAddInp" placeholder="+ Agregar tarea…" maxlength="300">
            </div>
          </div>
        </div>
      </div>

      <div class="nb-rings" id="nbRings"></div>

      <div class="nb-page nb-page-right">
        <div class="nb-right-inner">
          <div class="nb-notes-hdr">
            <span class="nb-notes-title">Notas</span>
            <div class="nb-tools">
              <button class="nb-tool-btn active" data-tool="pen" data-color="#2b2420" title="Pluma negra"><span class="nb-tool-dot" style="background:#2b2420;"></span></button>
              <button class="nb-tool-btn" data-tool="pen" data-color="#1A4FA0" title="Pluma azul"><span class="nb-tool-dot" style="background:#1A4FA0;"></span></button>
              <button class="nb-tool-btn" data-tool="pen" data-color="#8a1f2b" title="Pluma roja"><span class="nb-tool-dot" style="background:#8a1f2b;"></span></button>
              <button class="nb-tool-btn" data-tool="eraser" title="Borrador">⌫</button>
              <button class="nb-tool-btn" id="nbClearBtn" title="Borrar todo">🗑</button>
            </div>
            <span class="nb-save-state" id="nbSaveState"></span>
          </div>
          <div class="nb-canvas-wrap" id="nbCanvasWrap">
            <canvas id="noteCanvas"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
(function() {
  firebase.initializeApp({
    apiKey: "AIzaSyC3LG6e_7YAbYQhdPe6IC_Mq3SFop0XPsk",
    authDomain: "trazzo-c9eaf.firebaseapp.com",
    projectId: "trazzo-c9eaf",
    storageBucket: "trazzo-c9eaf.firebasestorage.app",
    messagingSenderId: "106264633340",
    appId: "1:106264633340:web:4b2560a57e75321c709c79"
  });
  var db = firebase.firestore();
  // ── AUTH GUARD ──────────────────────────────────────────────
  firebase.auth().onAuthStateChanged(function(u) {
    if (u && ['dcoderstudio@gmail.com', 'proyectos@dcoderstudio.com', 'ale@dcoderstudio.com', 'gonzalo@dcoderstudio.com'].indexOf(u.email) > -1) return;
    location.replace('/login.html');
  });
  // ── END AUTH GUARD ──────────────────────────────────────────

  var DOC = db.collection('workspace').doc('proyectos');
  // Las notas a mano se guardan DENTRO del mismo documento compartido
  // (no en una colección aparte): esa es la única ruta de Firestore que
  // ya tiene permisos de lectura/escritura en toda la app, así que
  // evitamos depender de reglas de seguridad nuevas que nadie configuró
  // todavía. Para no acercarnos al límite de 1MB del documento, solo se
  // conservan las notas de los últimos DAILY_NOTES_KEEP días.
  var DAILY_NOTES_KEEP = 60;
  var dailyNotes = {};

  var projects = [], standaloneTasks = [], teamMembers = [];

  function fmt(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function todayStr() { return fmt(new Date()); }
  function parseDate(ds) { return new Date(ds + 'T12:00:00'); }

  var _selDate = todayStr();

  function getMember(id) { for (var i = 0; i < teamMembers.length; i++) { if (teamMembers[i].id === id) return teamMembers[i]; } return null; }

  function collectAllTasks() {
    var all = [];
    (standaloneTasks || []).forEach(function(t) {
      all.push(Object.assign({}, t, { _type: 'standalone', _projId: null, _stage: null, source: 'Tarea libre', member: t.resp ? getMember(t.resp) : null }));
    });
    (projects || []).forEach(function(p) {
      if (p.catId === 'cotizaciones' || p.quoteArchived || !p.stageTasks) return;
      Object.keys(p.stageTasks).forEach(function(stage) {
        (p.stageTasks[stage] || []).forEach(function(t) {
          if (!t.sharedWithTeam) return;
          all.push(Object.assign({}, t, { _type: 'project', _projId: p.id, _stage: stage, source: p.name, member: t.resp ? getMember(t.resp) : null }));
        });
      });
    });
    return all;
  }

  function teamTaskUpdate(task, changes) {
    if (task._type === 'standalone') {
      standaloneTasks = (standaloneTasks || []).map(function(t) { return t.id === task.id ? Object.assign({}, t, changes) : t; });
    } else {
      projects = (projects || []).map(function(p) {
        if (p.id !== task._projId) return p;
        var st = Object.assign({}, p.stageTasks || {});
        st[task._stage] = (st[task._stage] || []).map(function(t) { return t.id === task.id ? Object.assign({}, t, changes) : t; });
        return Object.assign({}, p, { stageTasks: st });
      });
    }
    _ignoreSnap = true;
    DOC.set({ projects: projects, standaloneTasks: standaloneTasks }, { merge: true }).catch(function(e) { console.warn(e); });
    renderLists();
  }
  // Applies several task changes (e.g. a whole reordered list's new
  // sortOrder) in one save + render instead of one round-trip per task.
  function teamTaskUpdateBulk(updates) {
    updates.forEach(function(u) {
      var task = u.task, changes = u.changes;
      if (task._type === 'standalone') {
        standaloneTasks = (standaloneTasks || []).map(function(t) { return t.id === task.id ? Object.assign({}, t, changes) : t; });
      } else {
        projects = (projects || []).map(function(p) {
          if (p.id !== task._projId) return p;
          var st = Object.assign({}, p.stageTasks || {});
          st[task._stage] = (st[task._stage] || []).map(function(t) { return t.id === task.id ? Object.assign({}, t, changes) : t; });
          return Object.assign({}, p, { stageTasks: st });
        });
      }
    });
    _ignoreSnap = true;
    DOC.set({ projects: projects, standaloneTasks: standaloneTasks }, { merge: true }).catch(function(e) { console.warn(e); });
    renderLists();
  }
  function addNewTask(text) {
    var ds = _selDate;
    var existing = collectAllTasks().filter(function(t) { return t.deadline === ds || (t.priority && !t.deadline); });
    var maxOrder = existing.reduce(function(m, t) { return typeof t.sortOrder === 'number' && t.sortOrder > m ? t.sortOrder : m; }, -1);
    var task = { id: 'nd_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7), text: text, done: false, deadline: ds, priority: false, sortOrder: maxOrder + 1, colStatus: null, notes: '' };
    standaloneTasks = (standaloneTasks || []).concat([task]);
    _ignoreSnap = true;
    DOC.set({ standaloneTasks: standaloneTasks }, { merge: true }).catch(function(e) { console.warn(e); });
    renderLists();
  }

  var _ignoreSnap = false;
  DOC.onSnapshot(function(snap) {
    if (_ignoreSnap) { _ignoreSnap = false; return; }
    if (!snap.exists) return;
    var d = snap.data();
    if (d.projects) projects = d.projects;
    if (d.standaloneTasks) standaloneTasks = d.standaloneTasks;
    if (d.teamMembers) teamMembers = d.teamMembers;
    if (d.dailyNotes) dailyNotes = d.dailyNotes;
    renderLists();
  });

  // ── DATE NAV ──────────────────────────────────────────────
  var DAYS_LONG = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  var MNS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

  function renderDayHeader() {
    var d = parseDate(_selDate);
    document.getElementById('dayLabel').textContent = DAYS_LONG[d.getDay()] + ', ' + d.getDate() + ' de ' + MNS[d.getMonth()];
    document.getElementById('dayTodayBtn').disabled = (_selDate === todayStr());
    var isToday = _selDate === todayStr();
    document.getElementById('nbTitle').textContent = isToday ? 'Today' : (d.getDate() + ' ' + MNS[d.getMonth()].slice(0, 3));
    document.getElementById('nbSubtitle').textContent = DAYS_LONG[d.getDay()].toUpperCase();
  }

  function shiftDay(delta) {
    flushSave();
    var d = parseDate(_selDate);
    d.setDate(d.getDate() + delta);
    _selDate = fmt(d);
    onDateChanged();
  }

  document.getElementById('dayPrevBtn').onclick = function() { shiftDay(-1); };
  document.getElementById('dayNextBtn').onclick = function() { shiftDay(1); };
  document.getElementById('dayTodayBtn').onclick = function() { flushSave(); _selDate = todayStr(); onDateChanged(); };

  function onDateChanged() {
    renderDayHeader();
    renderLists();
    loadNote();
  }

  // ── PRIORITIES / TASKS LISTS ───────────────────────────────
  function buildTaskRow(t) {
    var row = document.createElement('div');
    row.className = 'nb-task-row' + (t.done ? ' done' : '') + (t.priority ? ' prio' : '');
    var chk = document.createElement('div'); chk.className = 'nb-chk' + (t.done ? ' on' : '');
    chk.onclick = function(e) { e.stopPropagation(); teamTaskUpdate(t, { done: !t.done }); };
    row.appendChild(chk);
    var txt = document.createElement('div'); txt.className = 'nb-task-txt'; txt.textContent = t.text;
    row.appendChild(txt);
    var star = document.createElement('button'); star.type = 'button'; star.className = 'nb-star-btn' + (t.priority ? ' on' : '');
    star.textContent = '★'; star.title = t.priority ? 'Quitar prioridad' : 'Marcar como prioridad';
    star.onclick = function(e) { e.stopPropagation(); teamTaskUpdate(t, { priority: !t.priority }); };
    row.appendChild(star);
    return row;
  }

  // Drag a row to reorder it among the others in the same list (persists
  // via sortOrder); tapping without moving toggles done, same as before.
  function initNbDrag(row, task, listEl, orderedTasks) {
    row.addEventListener('pointerdown', function(e) {
      if (e.target.closest('.nb-chk') || e.target.closest('.nb-star-btn')) return;
      var sx = e.clientX, sy = e.clientY, dragging = false, ghost = null, captured = false;
      var pid = e.pointerId;
      function onMove(ev) {
        var dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!dragging && Math.sqrt(dx * dx + dy * dy) > 8) {
          dragging = true;
          if (!captured) { try { row.setPointerCapture(pid); } catch (err) {} captured = true; }
          row.classList.add('dragging');
          ghost = document.createElement('div'); ghost.className = 'nb-drag-ghost'; ghost.textContent = task.text;
          document.body.appendChild(ghost);
        }
        if (dragging && ghost) {
          ghost.style.left = (ev.clientX + 14) + 'px';
          ghost.style.top = (ev.clientY - 14) + 'px';
        }
      }
      function onUp(ev) {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        if (ghost) { ghost.remove(); ghost = null; }
        row.classList.remove('dragging');
        if (!dragging) {
          teamTaskUpdate(task, { done: !task.done });
        } else {
          row.addEventListener('click', function stop(ce) { ce.stopPropagation(); ce.preventDefault(); }, { once: true, capture: true });
          reorderNbTask(task, row, orderedTasks, listEl, ev.clientY);
        }
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  }
  function reorderNbTask(task, row, orderedTasks, listEl, clientY) {
    var siblings = Array.from(listEl.querySelectorAll('.nb-task-row')).filter(function(el) { return el !== row; });
    var targetIdx = siblings.length;
    for (var i = 0; i < siblings.length; i++) {
      var r = siblings[i].getBoundingClientRect();
      if (clientY < r.top + r.height / 2) { targetIdx = i; break; }
    }
    var order = orderedTasks.slice();
    var curIdx = order.indexOf(task);
    if (curIdx === -1) return;
    order.splice(curIdx, 1);
    if (targetIdx > curIdx) targetIdx--;
    order.splice(targetIdx, 0, task);
    var changed = order.some(function(t, i) { return t !== orderedTasks[i]; });
    if (!changed) return;
    teamTaskUpdateBulk(order.map(function(t, i) { return { task: t, changes: { sortOrder: i } }; }));
  }

  function bySortOrder(a, b) {
    var ao = typeof a.sortOrder === 'number' ? a.sortOrder : Infinity;
    var bo = typeof b.sortOrder === 'number' ? b.sortOrder : Infinity;
    return ao - bo;
  }
  function renderOneList(listEl, cntEl, tasks, emptyText) {
    listEl.innerHTML = '';
    var done = tasks.filter(function(t) { return t.done; }).length;
    cntEl.textContent = tasks.length ? (done + '/' + tasks.length) : '';
    if (!tasks.length) {
      var e = document.createElement('div'); e.className = 'nb-empty'; e.textContent = emptyText; listEl.appendChild(e);
    } else {
      tasks.forEach(function(t) {
        var row = buildTaskRow(t);
        initNbDrag(row, t, listEl, tasks);
        listEl.appendChild(row);
      });
    }
  }
  function renderLists() {
    var all = collectAllTasks();
    var ds = _selDate;
    var dayTasks = all.filter(function(t) { return t.deadline === ds || (t.priority && !t.deadline); });
    var prio = dayTasks.filter(function(t) { return t.priority; }).sort(bySortOrder);
    var tasks = dayTasks.filter(function(t) { return !t.priority; }).sort(bySortOrder);

    renderOneList(document.getElementById('nbPrioList'), document.getElementById('nbPrioCnt'), prio, 'Sin prioridades para este día.');
    renderOneList(document.getElementById('nbTaskList'), document.getElementById('nbTaskCnt'), tasks, 'Sin tareas para este día.');
  }

  document.getElementById('nbAddInp').addEventListener('keydown', function(e) {
    if (e.key !== 'Enter') return;
    var v = this.value.trim(); if (!v) return;
    addNewTask(v);
    this.value = '';
  });

  // ── RING BINDING (decorative) ──────────────────────────────
  (function buildRings() {
    var wrap = document.getElementById('nbRings');
    for (var i = 0; i < 14; i++) { var r = document.createElement('div'); r.className = 'nb-ring'; wrap.appendChild(r); }
  })();

  // ── HANDWRITING CANVAS ──────────────────────────────────────
  var canvas = document.getElementById('noteCanvas');
  var ctx = canvas.getContext('2d');
  var wrap = document.getElementById('nbCanvasWrap');
  var _tool = 'pen', _color = '#2b2420';
  var _drawing = false, _lastX = 0, _lastY = 0;
  var _dirty = false, _saveTimer = null;
  var _dpr = window.devicePixelRatio || 1;

  function sizeCanvas() {
    var w = wrap.clientWidth, h = wrap.clientHeight;
    canvas.width = Math.max(1, Math.round(w * _dpr));
    canvas.height = Math.max(1, Math.round(h * _dpr));
    ctx.setTransform(_dpr, 0, 0, _dpr, 0, 0);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  }
  // Resizing a raster canvas clears it, so on resize (e.g. rotating the
  // tablet) flush any unsaved stroke FIRST (otherwise it's gone the
  // instant the canvas buffer is resized), then re-size and reload the
  // saved note scaled to fit.
  var _resizeTimer = null;
  new ResizeObserver(function() {
    flushSave();
    sizeCanvas();
    clearTimeout(_resizeTimer);
    _resizeTimer = setTimeout(function() { if (!_drawing) loadNote(); }, 150);
  }).observe(wrap);
  sizeCanvas();

  Array.from(document.querySelectorAll('.nb-tool-btn[data-tool]')).forEach(function(btn) {
    btn.onclick = function() {
      Array.from(document.querySelectorAll('.nb-tool-btn[data-tool]')).forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      _tool = btn.dataset.tool;
      if (btn.dataset.color) _color = btn.dataset.color;
    };
  });
  document.getElementById('nbClearBtn').onclick = function() {
    if (!confirm('¿Borrar todas las notas de este día?')) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    scheduleSave();
  };

  function pointerPos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function strokeWidth(e) {
    var base = _tool === 'eraser' ? 18 : 2.6;
    if (e.pointerType === 'pen' && e.pressure > 0) return base * (0.6 + e.pressure * 0.9);
    return base;
  }
  // Palm rejection: only an actual stylus ("pen") can draw. A finger or
  // mouse just does nothing on the canvas — resting your hand while
  // writing with a pen (e.g. an XP-Pen style tablet) doesn't leave marks.
  var PEN_ONLY = true;
  var _activePointerId = null;
  canvas.addEventListener('pointerdown', function(e) {
    if (PEN_ONLY && e.pointerType !== 'pen') return;
    e.preventDefault();
    _drawing = true;
    _activePointerId = e.pointerId;
    canvas.setPointerCapture(e.pointerId);
    var p = pointerPos(e); _lastX = p.x; _lastY = p.y;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 0.1, p.y + 0.1);
    // The eraser clears pixels instead of painting over them with a paper
    // color, so the ruled lines (a CSS background behind the canvas) show
    // through again instead of getting covered up.
    ctx.globalCompositeOperation = _tool === 'eraser' ? 'destination-out' : 'source-over';
    ctx.strokeStyle = _color;
    ctx.lineWidth = strokeWidth(e);
    ctx.stroke();
  });
  canvas.addEventListener('pointermove', function(e) {
    if (!_drawing || e.pointerId !== _activePointerId) return;
    var p = pointerPos(e);
    ctx.beginPath(); ctx.moveTo(_lastX, _lastY); ctx.lineTo(p.x, p.y);
    ctx.globalCompositeOperation = _tool === 'eraser' ? 'destination-out' : 'source-over';
    ctx.strokeStyle = _color;
    ctx.lineWidth = strokeWidth(e);
    ctx.stroke();
    _lastX = p.x; _lastY = p.y;
  });
  function endStroke(e) {
    if (!_drawing || e.pointerId !== _activePointerId) return;
    _drawing = false;
    _activePointerId = null;
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
    scheduleSave();
  }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);
  canvas.addEventListener('pointerleave', function(e) { if (_drawing && e.pointerId === _activePointerId) endStroke(e); });

  function scheduleSave() {
    _dirty = true;
    document.getElementById('nbSaveState').textContent = 'Guardando…';
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(saveNote, 1200);
  }
  function saveNote() {
    clearTimeout(_saveTimer);
    if (!_dirty) return;
    _dirty = false;
    var dateAtSave = _selDate;
    var png = canvas.toDataURL('image/png');
    var updated = Object.assign({}, dailyNotes);
    updated[dateAtSave] = { png: png, updatedAt: new Date().toISOString() };
    // Keep only the most recent N days so this field never approaches
    // Firestore's 1MB-per-document limit — dates sort fine as strings
    // since they're all YYYY-MM-DD.
    var keys = Object.keys(updated).sort();
    while (keys.length > DAILY_NOTES_KEEP) { delete updated[keys.shift()]; }
    dailyNotes = updated;
    _ignoreSnap = true;
    DOC.set({ dailyNotes: dailyNotes }, { merge: true })
      .then(function() { if (_selDate === dateAtSave) document.getElementById('nbSaveState').textContent = 'Guardado ✓'; })
      .catch(function(e) { console.warn(e); if (_selDate === dateAtSave) document.getElementById('nbSaveState').textContent = 'No se pudo guardar'; });
  }
  // Saves immediately instead of waiting out the debounce — called
  // before anything that would otherwise wipe or swap out the canvas
  // (changing day, resizing/rotating, backgrounding the app) so a
  // just-finished stroke is never silently discarded.
  function flushSave() {
    if (_dirty) saveNote();
  }
  window.addEventListener('beforeunload', flushSave);
  window.addEventListener('pagehide', flushSave);
  document.addEventListener('visibilitychange', function() { if (document.visibilityState === 'hidden') flushSave(); });

  function loadNote() {
    clearTimeout(_saveTimer); _dirty = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    document.getElementById('nbSaveState').textContent = '';
    var entry = dailyNotes[_selDate];
    if (!entry || !entry.png) return;
    var dateAtLoad = _selDate;
    var img = new Image();
    img.onload = function() {
      if (_selDate !== dateAtLoad) return; // user already flipped to another day
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      ctx.restore();
    };
    img.src = entry.png;
  }

  renderDayHeader();
  loadNote();
})();
</script>
</body>
</html>
