<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tareas — Dcoder Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#0c0c0c;color:#fff;font-family:'Inter',sans-serif;overflow:hidden;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:52px;border-bottom:0.5px solid rgba(255,255,255,0.06);flex-shrink:0;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-pill{background:#fff;color:#0c0c0c;font-size:11px;font-weight:800;padding:5px 10px;border-radius:8px;}
.logo-name{font-size:14px;font-weight:700;letter-spacing:.04em;}
.nav-btn{background:none;border:none;color:rgba(255,255,255,0.28);font-size:12px;font-weight:500;padding:6px 16px;border-radius:20px;cursor:pointer;font-family:'Inter',sans-serif;}
.nav-btn.active{background:rgba(255,255,255,0.1);color:#fff;}
.subbar{display:flex;align-items:center;gap:6px;padding:0 28px;height:48px;border-bottom:0.5px solid rgba(255,255,255,0.06);flex-shrink:0;}
.subbar-sep{width:0.5px;height:20px;background:rgba(255,255,255,0.08);margin:0 2px;flex-shrink:0;}
.person-pill{display:flex;align-items:center;gap:5px;padding:4px 10px 4px 6px;border-radius:20px;border:0.5px solid rgba(255,255,255,0.08);background:transparent;color:rgba(255,255,255,0.38);font-size:11px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;white-space:nowrap;}
.person-pill:hover{background:rgba(255,255,255,0.06);color:#fff;border-color:rgba(255,255,255,0.18);}
.person-pill.active{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.28);color:#fff;}
.person-pill-av{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;flex-shrink:0;}
.count-pill{font-size:11px;color:rgba(255,255,255,0.22);background:rgba(255,255,255,0.05);padding:4px 10px;border-radius:20px;white-space:nowrap;margin-left:auto;flex-shrink:0;}
/* KANBAN */
.board-wrap{display:flex;gap:14px;padding:20px 28px 24px;height:calc(100vh - 52px - 48px);overflow-x:auto;}
.board-wrap::-webkit-scrollbar{height:4px;}
.board-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}
.tk-col{flex:1;min-width:300px;max-width:420px;display:flex;flex-direction:column;gap:0;border-radius:18px;padding:14px 12px 12px;}
/* Column tints */
.tk-col-notstarted{background:rgba(71,130,255,0.07);border:0.5px solid rgba(71,130,255,0.14);}
.tk-col-inprogress{background:rgba(232,160,32,0.07);border:0.5px solid rgba(232,160,32,0.15);}
.tk-col-done{background:rgba(39,174,114,0.07);border:0.5px solid rgba(39,174,114,0.15);}
.tk-col-hdr{display:flex;align-items:center;gap:8px;padding:0 2px 14px;flex-shrink:0;}
.tk-col-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.tk-col-title{font-size:13px;font-weight:700;letter-spacing:.02em;}
.tk-col-count{font-size:11px;font-weight:700;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.4);padding:2px 9px;border-radius:10px;}
.tk-col-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:0 0 4px;}
.tk-col-body::-webkit-scrollbar{width:3px;}
.tk-col-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}
/* SUB HEADERS within In Progress */
.tk-sub-hdr{display:flex;align-items:center;gap:8px;padding:4px 2px 8px;flex-shrink:0;}
.tk-sub-hdr.urgent .tk-sub-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#E24B4A;}
.tk-sub-hdr.urgent .tk-sub-line{flex:1;height:0.5px;background:rgba(226,75,74,0.3);}
.tk-sub-hdr.urgent .tk-sub-dot{width:6px;height:6px;border-radius:50%;background:#E24B4A;flex-shrink:0;}
.tk-sub-hdr.normal{margin-top:4px;}
.tk-sub-hdr.normal .tk-sub-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,0.25);}
.tk-sub-hdr.normal .tk-sub-line{flex:1;height:0.5px;background:rgba(255,255,255,0.07);}
/* TASK CARD */
.tk-card{background:#181818;border:0.5px solid rgba(255,255,255,0.08);border-radius:13px;padding:14px 14px 12px 18px;position:relative;overflow:hidden;transition:transform .12s,box-shadow .12s,border-color .12s;flex-shrink:0;}
.tk-card:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.45);border-color:rgba(255,255,255,0.16);}
.tk-card.soon-card{border-color:rgba(232,160,32,0.35);background:#1b1a11;}
.tk-card.overdue-card{border-color:rgba(226,75,74,0.35);background:#1c1212;}
.tk-card.done-card{opacity:.38;}
.tk-card-bar{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;}
.tk-card-proj{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.tk-card-text{font-size:14px;font-weight:600;color:rgba(255,255,255,0.9);line-height:1.45;margin-bottom:6px;}
.tk-card.done-card .tk-card-text{text-decoration:line-through;color:rgba(255,255,255,0.38);}
.tk-card-stage{font-size:11px;color:rgba(255,255,255,0.28);margin-bottom:10px;line-height:1.3;}
.tk-card-footer{display:flex;align-items:center;justify-content:space-between;}
.tk-card-av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;}
.tk-card-dl{font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;white-space:nowrap;}
.tk-card-dl.overdue{background:rgba(226,75,74,0.18);color:#E24B4A;}
.tk-card-dl.today{background:rgba(232,160,32,0.18);color:#E8A020;}
.tk-card-dl.soon{background:rgba(232,160,32,0.12);color:#E8A020;}
.tk-card-dl.ok{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.4);}
.tk-check-sm{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s;}
.tk-check-sm:hover{border-color:rgba(255,255,255,0.5);}
.tk-check-sm.on{background:#27AE72;border-color:#27AE72;}
.tk-check-sm svg{opacity:0;}
.tk-check-sm.on svg{opacity:1;}
.tk-empty{padding:36px 14px;text-align:center;color:rgba(255,255,255,0.18);font-size:12px;border:1px dashed rgba(255,255,255,0.08);border-radius:12px;}
.done-toggle{background:none;border:0.5px solid rgba(255,255,255,0.1);border-radius:10px;color:rgba(255,255,255,0.3);font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;padding:9px 14px;transition:all .15s;text-align:left;width:100%;}
.done-toggle:hover{border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.55);}
/* DRAG & DROP */
.tk-card{cursor:grab;}
.tk-card.tk-dragging{opacity:0.12!important;}
.tk-ghost{position:fixed;pointer-events:none;z-index:9000;border-radius:12px;box-shadow:0 24px 64px rgba(0,0,0,0.75);transform:rotate(1.5deg) scale(1.03);transition:none;opacity:0.92;}
.tk-col-body.tk-drag-active{background:rgba(255,255,255,0.03);border-radius:10px;}
.tk-placeholder{min-height:72px;border-radius:12px;border:1.5px dashed rgba(255,255,255,0.22);background:rgba(255,255,255,0.02);flex-shrink:0;}
/* NEW TASK BUTTON */
.new-task-btn{background:#fff;color:#0c0c0c;border:none;font-size:11px;font-weight:700;padding:6px 14px;border-radius:20px;cursor:pointer;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:5px;margin-left:auto;flex-shrink:0;}
.new-task-btn:hover{background:#e0e0e0;}
/* MODAL */
.t-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);z-index:500;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.t-overlay.open{opacity:1;pointer-events:all;}
.t-modal{background:#161616;border:0.5px solid rgba(255,255,255,0.1);border-radius:20px;padding:26px;width:420px;max-width:92vw;display:flex;flex-direction:column;gap:14px;transform:translateY(8px);transition:transform .2s;}
.t-overlay.open .t-modal{transform:none;}
.t-modal-title{font-size:15px;font-weight:700;}
.t-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,0.3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px;}
.t-inp{background:#1e1e1e;border:0.5px solid rgba(255,255,255,0.1);border-radius:10px;padding:9px 13px;font-size:13px;color:#fff;font-family:'Inter',sans-serif;outline:none;width:100%;transition:border-color .15s;}
.t-inp:focus{border-color:rgba(255,255,255,0.3);}
.t-inp::placeholder{color:rgba(255,255,255,0.18);}
.t-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.t-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}
.t-btn-c{background:rgba(255,255,255,0.07);border:none;color:rgba(255,255,255,0.45);font-size:12px;font-weight:600;padding:8px 16px;border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;}
.t-btn-ok{background:#fff;border:none;color:#0c0c0c;font-size:12px;font-weight:700;padding:8px 16px;border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;}
/* PRIORITY FLAG */
.tk-flag-btn{position:absolute;top:9px;right:10px;background:none;border:none;cursor:pointer;font-size:13px;padding:2px;line-height:1;opacity:0;transition:opacity .15s;z-index:2;}
.tk-card:hover .tk-flag-btn{opacity:0.45;}
.tk-flag-btn.on{opacity:1!important;}
.tk-card.priority-card{border-color:rgba(255,255,255,0.42)!important;background:#1e1e22;box-shadow:0 0 0 0.5px rgba(255,255,255,0.07);}
/* COLUMN EDIT */
.col-edit-btn{background:none;border:none;color:rgba(255,255,255,0.18);font-size:16px;cursor:pointer;padding:0 3px;line-height:1;margin-left:auto;transition:color .15s;flex-shrink:0;font-family:'Inter',sans-serif;}
.col-edit-btn:hover{color:rgba(255,255,255,0.6);}
.tk-add-col-btn{flex-shrink:0;width:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-radius:18px;border:1.5px dashed rgba(255,255,255,0.1);background:transparent;cursor:pointer;transition:all .18s;color:rgba(255,255,255,0.2);font-family:'Inter',sans-serif;font-size:11px;font-weight:600;padding:0;}
.tk-add-col-btn:hover{border-color:rgba(255,255,255,0.28);color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.03);}
.tk-add-col-btn span{font-size:22px;font-weight:300;line-height:1;}
.col-ed-panel{position:fixed;z-index:9999;background:#161616;border:0.5px solid rgba(255,255,255,0.14);border-radius:18px;padding:16px;box-shadow:0 20px 70px rgba(0,0,0,.92);width:230px;font-family:'Inter',sans-serif;display:flex;flex-direction:column;gap:12px;}
.col-ed-inp{background:#1e1e1e;border:0.5px solid rgba(255,255,255,0.12);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;color:#fff;font-family:'Inter',sans-serif;outline:none;width:100%;transition:border-color .15s;}
.col-ed-inp:focus{border-color:rgba(255,255,255,0.32);}
.col-ed-swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.col-ed-sw{width:100%;aspect-ratio:1;border-radius:9px;border:2px solid transparent;cursor:pointer;transition:all .15s;}
.col-ed-sw:hover{transform:scale(1.08);}
.col-ed-sw.sel{border-color:#fff!important;box-shadow:0 0 0 1px rgba(255,255,255,0.4);}
.col-ed-foot{display:flex;gap:7px;align-items:center;}
.col-ed-save{flex:1;background:#fff;border:none;color:#0c0c0c;font-size:12px;font-weight:700;padding:8px;border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;}
.col-ed-del{background:rgba(226,75,74,0.1);border:0.5px solid rgba(226,75,74,0.25);color:#E24B4A;font-size:11px;font-weight:600;padding:8px 12px;border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
.col-ed-del:hover{background:rgba(226,75,74,0.2);}
/* TASK DETAIL MODAL */
.tk-det-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);z-index:700;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.tk-det-overlay.open{opacity:1;pointer-events:all;}
.tk-det-modal{background:#161616;border:0.5px solid rgba(255,255,255,0.1);border-radius:22px;width:460px;max-width:94vw;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;transform:translateY(10px);transition:transform .2s;}
.tk-det-overlay.open .tk-det-modal{transform:none;}
.tk-det-head{display:flex;align-items:center;gap:10px;padding:18px 20px 14px;border-bottom:0.5px solid rgba(255,255,255,0.07);}
.tk-det-bar{width:4px;height:38px;border-radius:3px;flex-shrink:0;}
.tk-det-meta{flex:1;min-width:0;}
.tk-det-projname{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;}
.tk-det-stagename{font-size:11px;color:rgba(255,255,255,0.3);}
.tk-det-close{background:none;border:none;color:rgba(255,255,255,0.28);font-size:20px;cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0;}
.tk-det-close:hover{color:#fff;}
.tk-det-body{display:flex;flex-direction:column;gap:14px;padding:18px 20px 22px;}
.tk-det-textarea{background:#1e1e1e;border:0.5px solid rgba(255,255,255,0.1);border-radius:10px;padding:11px 13px;font-size:14px;font-weight:600;color:#fff;font-family:'Inter',sans-serif;outline:none;width:100%;resize:none;min-height:68px;line-height:1.45;transition:border-color .15s;}
.tk-det-textarea:focus{border-color:rgba(255,255,255,0.3);}
.tk-det-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,0.3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px;}
.tk-det-inp{background:#1e1e1e;border:0.5px solid rgba(255,255,255,0.1);border-radius:10px;padding:9px 12px;font-size:12px;color:#fff;font-family:'Inter',sans-serif;outline:none;width:100%;transition:border-color .15s;}
.tk-det-inp:focus{border-color:rgba(255,255,255,0.3);}
.tk-det-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.tk-det-notes{background:#1e1e1e;border:0.5px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px 13px;font-size:12px;color:rgba(255,255,255,0.7);font-family:'Inter',sans-serif;outline:none;width:100%;resize:vertical;min-height:72px;line-height:1.5;transition:border-color .15s;}
.tk-det-notes:focus{border-color:rgba(255,255,255,0.3);}
.tk-det-notes::placeholder{color:rgba(255,255,255,0.18);}
.tk-det-foot{display:flex;gap:8px;justify-content:flex-end;}
.tk-notes-dot{width:6px;height:6px;border-radius:50%;background:rgba(232,160,32,0.6);flex-shrink:0;}
/* NUEVA TAREA — step selector */
.nt-type-btn{background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.1);border-radius:14px;padding:18px 10px;cursor:pointer;font-family:'Inter',sans-serif;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .18s;width:100%;}
.nt-type-btn:hover{background:rgba(255,255,255,0.09);border-color:rgba(255,255,255,0.28);}
.nt-type-icon{font-size:20px;line-height:1;}
.nt-type-title{font-size:12px;font-weight:700;color:#fff;}
.nt-type-sub{font-size:9px;color:rgba(255,255,255,0.35);line-height:1.3;}
.nt-back-btn{background:none;border:none;color:rgba(255,255,255,0.32);font-size:11px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;padding:0 0 4px;display:flex;align-items:center;gap:4px;transition:color .15s;}
.nt-back-btn:hover{color:rgba(255,255,255,0.7);}
/* GROUP SELECTOR */
.grp-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:0.5px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);cursor:pointer;transition:all .15s;margin-bottom:5px;}
.grp-item:hover{background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.2);}
.grp-item.sel{border-color:rgba(255,255,255,0.42);background:rgba(255,255,255,0.09);}
.grp-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.grp-iname{font-size:13px;font-weight:600;color:rgba(255,255,255,0.8);flex:1;}
.grp-check{font-size:11px;color:rgba(255,255,255,0.55);opacity:0;flex-shrink:0;}
.grp-item.sel .grp-check{opacity:1;}
.grp-new-btn{width:100%;background:none;border:1px dashed rgba(255,255,255,0.14);border-radius:10px;color:rgba(255,255,255,0.32);font-size:12px;font-weight:600;padding:9px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;margin-top:2px;}
.grp-new-btn:hover{border-color:rgba(255,255,255,0.3);color:rgba(255,255,255,0.65);}
.grp-new-form{background:rgba(255,255,255,0.03);border:0.5px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px;margin-top:6px;display:flex;flex-direction:column;gap:8px;}
.grp-color-row{display:flex;gap:5px;flex-wrap:wrap;}
.grp-color-sw{width:22px;height:22px;border-radius:6px;border:2.5px solid transparent;cursor:pointer;transition:border .12s;flex-shrink:0;}
.grp-color-sw.sel{border-color:#fff!important;}
/* TRIGGER BUTTONS para pickers en el modal */
.tk-det-trigger{background:#1e1e1e;border:0.5px solid rgba(255,255,255,0.1);border-radius:10px;padding:9px 12px;font-size:12px;color:rgba(255,255,255,0.35);font-family:'Inter',sans-serif;cursor:pointer;width:100%;text-align:left;transition:border-color .15s,color .15s;display:flex;align-items:center;gap:7px;}
.tk-det-trigger:hover{border-color:rgba(255,255,255,0.28);color:rgba(255,255,255,0.8);}
.tk-det-trigger.has-val{color:#fff;}
.tk-tav{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;flex-shrink:0;}
/* PERSON PICKER */
.tkpp-panel{position:fixed;z-index:9999;background:#161616;border:0.5px solid rgba(255,255,255,0.14);border-radius:14px;padding:6px;box-shadow:0 12px 50px rgba(0,0,0,.92);font-family:'Inter',sans-serif;min-width:190px;}
.tkpp-opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;transition:background .12s;font-size:13px;color:rgba(255,255,255,0.75);}
.tkpp-opt:hover,.tkpp-opt.sel{background:rgba(255,255,255,0.07);color:#fff;}
.tkpp-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;flex-shrink:0;}
.tkpp-none{padding:8px 10px;border-radius:9px;cursor:pointer;font-size:12px;color:rgba(255,255,255,0.35);transition:background .12s;}
.tkpp-none:hover,.tkpp-none.sel{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.7);}
/* DATE PICKER */
.tkdp-panel{position:fixed;z-index:9999;background:#161616;border:0.5px solid rgba(255,255,255,0.14);border-radius:18px;padding:16px;box-shadow:0 20px 70px rgba(0,0,0,.92);width:252px;font-family:'Inter',sans-serif;}
.tkdp-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.tkdp-lbl{font-size:13px;font-weight:700;color:#fff;}
.tkdp-nbtn{background:rgba(255,255,255,0.07);border:none;color:rgba(255,255,255,0.5);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:'Inter',sans-serif;}
.tkdp-nbtn:hover{background:rgba(255,255,255,0.14);color:#fff;}
.tkdp-wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;}

<script>
(function() {
  firebase.initializeApp({
    apiKey: "AIzaSyC3LG6e_7YAbYQhdPe6IC_Mq3SFop0XPsk",
    authDomain: "trazzo-c9eaf.firebaseapp.com",
    projectId: "trazzo-c9eaf",
    storageBucket: "trazzo-c9eaf.firebasestorage.app",
    messagingSenderId: "106264633340",
    appId: "1:106264633340:web:4b2560a57e75321c709c79"
  });
  var db = firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(function(){});
  var DOC = db.collection('workspace').doc('proyectos');

  var projects = [], categories = [], standaloneTasks = [];
  var nextId = 14, catIdCounter = 20;
  var DEFAULT_TEAM = [{id:'AR',name:'Ana Ramírez',color:'#1A6FD4'},{id:'LM',name:'Luis Mora',color:'#7B6FD0'},{id:'SV',name:'Sofía Vega',color:'#D4537E'},{id:'RG',name:'Rodrigo Gil',color:'#E8A020'}];
  var teamMembers = DEFAULT_TEAM.slice();
  var taskGroups = [];
  var TEAM_COLORS_PALETTE = ['#1A6FD4','#7B6FD0','#D4537E','#E8A020','#27AE72','#D85A30','#C0436E','#B8760F','#555450','#1D9E75'];
  var _tmSelColor = TEAM_COLORS_PALETTE[0];
  var _selectedGroupId = null;
  var _ntNewGroupColor = TEAM_COLORS_PALETTE[0];
  var COL_PALETTES = [
    {bg:'rgba(71,130,255,0.09)',br:'rgba(71,130,255,0.2)',tc:'#7ab3ff',dc:'#4782ff'},
    {bg:'rgba(232,160,32,0.09)',br:'rgba(232,160,32,0.22)',tc:'#f0c050',dc:'#E8A020'},
    {bg:'rgba(39,174,114,0.09)',br:'rgba(39,174,114,0.22)',tc:'#3dcf8a',dc:'#27AE72'},
    {bg:'rgba(226,75,74,0.09)',br:'rgba(226,75,74,0.22)',tc:'#f07070',dc:'#E24B4A'},
    {bg:'rgba(139,92,246,0.09)',br:'rgba(139,92,246,0.22)',tc:'#b09af7',dc:'#8b5cf6'},
    {bg:'rgba(212,83,126,0.09)',br:'rgba(212,83,126,0.22)',tc:'#f075a0',dc:'#D4537E'},
    {bg:'rgba(216,90,48,0.09)',br:'rgba(216,90,48,0.22)',tc:'#f09060',dc:'#D85A30'},
    {bg:'rgba(255,255,255,0.04)',br:'rgba(255,255,255,0.1)',tc:'rgba(255,255,255,0.55)',dc:'rgba(255,255,255,0.3)'}
  ];
  var DEFAULT_TASK_COLS = [
    {id:'notstarted',label:'Sin iniciar',bg:COL_PALETTES[0].bg,border:COL_PALETTES[0].br,titleColor:COL_PALETTES[0].tc,dotColor:COL_PALETTES[0].dc,isDone:false},
    {id:'inprogress',label:'En proceso',bg:COL_PALETTES[1].bg,border:COL_PALETTES[1].br,titleColor:COL_PALETTES[1].tc,dotColor:COL_PALETTES[1].dc,isDone:false},
    {id:'done',label:'Terminadas',bg:COL_PALETTES[2].bg,border:COL_PALETTES[2].br,titleColor:COL_PALETTES[2].tc,dotColor:COL_PALETTES[2].dc,isDone:true}
  ];
  var taskColumns = null;
  var AV_COLORS = {AR:'#1A6FD4',LM:'#7B6FD0',SV:'#D4537E',RG:'#E8A020'};
  var AV_NAMES  = {AR:'Ana Ramírez',LM:'Luis Mora',SV:'Sofía Vega',RG:'Rodrigo Gil'};
  var MNS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var filterPerson = '';
  var showDone = false;
  var dragPlaceholder = null;
  var _ignoreSnap = false;
  var _pendingSave = false;

  function saveData() {
    _ignoreSnap = true;
    DOC.set({projects:projects, categories:categories, nextId:nextId, catIdCounter:catIdCounter, standaloneTasks:standaloneTasks, taskColumns:taskColumns, teamMembers:teamMembers, taskGroups:taskGroups})
      .catch(function(e){ console.warn('Error al guardar:', e); });
  }

  function getCat(catId) {
    for (var i=0;i<categories.length;i++){if(categories[i].id===catId)return categories[i];}
    return null;
  }

  function getAllTasks() {
    var result = [];
    projects.forEach(function(proj) {
      if (proj.catId === 'cotizaciones') return;
      if (!proj.stageTasks) proj.stageTasks = {};
      var cat = getCat(proj.catId);
      var stage = proj.stage;
      var tasks = proj.stageTasks[stage];
      // Auto-siembra: si no hay tareas para esta fase pero hay templates, crearlas aquí
      if ((!tasks || !tasks.length) && cat && cat.templates && cat.templates[stage] && cat.templates[stage].length) {
        var base = Date.now();
        proj.stageTasks[stage] = cat.templates[stage].map(function(item, i) {
          var text = typeof item === 'string' ? item : (item.text || '');
          return {id: base + i, text: text, done: false, deadline: '', resp: ''};
        });
        tasks = proj.stageTasks[stage];
        _pendingSave = true;
      }
      if (!tasks || !tasks.length) return;
      tasks.forEach(function(task) {
        result.push({
          id: task.id, text: task.text, done: !!task.done,
          colStatus: task.colStatus || null,
          sortOrder: task.sortOrder != null ? task.sortOrder : task.id,
          deadline: task.deadline || '', resp: task.resp || '',
          priority: !!task.priority, notes: task.notes || '',
          projectId: proj.id, projectName: proj.name, stage: stage,
          catColor: cat ? cat.color : 'rgba(255,255,255,0.2)'
        });
      });
    });
    // Tareas sin proyecto / de grupo
    standaloneTasks.forEach(function(task) {
      var grp = null;
      if (task.groupId) { for (var gi=0;gi<taskGroups.length;gi++){if(taskGroups[gi].id===task.groupId){grp=taskGroups[gi];break;}} }
      result.push({
        id: task.id, text: task.text, done: !!task.done,
        colStatus: task.colStatus || null,
        sortOrder: task.sortOrder != null ? task.sortOrder : task.id,
        deadline: task.deadline || '', resp: task.resp || '',
        priority: !!task.priority, notes: task.notes || '',
        projectId: 'standalone',
        projectName: grp ? grp.name : '',
        stage: '',
        catColor: grp ? grp.color : 'rgba(255,255,255,0.18)'
      });
    });
    return result;
  }

  function getDlClass(deadline) {
    if (!deadline) return '';
    var today = new Date(); today.setHours(0,0,0,0);
    var diff = Math.ceil((new Date(deadline+'T00:00:00') - today) / 86400000);
    if (diff < 0) return 'overdue';
    if (diff === 0) return 'today';
    if (diff <= 3) return 'soon';
    return 'ok';
  }

  function isUrgent(deadline) {
    if (!deadline) return false;
    var today = new Date(); today.setHours(0,0,0,0);
    var diff = Math.ceil((new Date(deadline+'T00:00:00') - today) / 86400000);
    return diff <= 3;
  }

  function fmtDate(dl) {
    var d = new Date(dl+'T00:00:00');
    return d.getDate()+' '+MNS[d.getMonth()];
  }

  function buildCard(task) {
    var card = document.createElement('div');
    var dlState = (!task.done && task.deadline) ? getDlClass(task.deadline) : '';
    var dlCardClass = dlState === 'overdue' ? ' overdue-card' : (dlState === 'today' || dlState === 'soon') ? ' soon-card' : '';
    card.className = 'tk-card' + dlCardClass + (task.done ? ' done-card' : '') + (task.priority ? ' priority-card' : '');
    card.dataset.sortorder = String(task.sortOrder != null ? task.sortOrder : task.id);

    // Flag button (top-right)
    var flagBtn = document.createElement('button');
    flagBtn.className = 'tk-flag-btn' + (task.priority ? ' on' : '');
    flagBtn.textContent = '🚩';
    flagBtn.title = task.priority ? 'Quitar prioridad' : 'Marcar prioritaria';
    flagBtn.onclick = (function(pid,st,tid){ return function(e){ e.stopPropagation(); toggleFlag(pid,st,tid); }; })(task.projectId, task.stage, task.id);
    card.appendChild(flagBtn);

    card.addEventListener('pointerdown', function(e) {
      if (e.button !== 0) return;
      if (e.target.closest('.tk-flag-btn') || e.target.closest('.tk-check-sm')) return;
      startCardDrag(e, task, card);
    });
    card.addEventListener('click', function(e) {
      if (e.target.closest('.tk-flag-btn') || e.target.closest('.tk-check-sm')) return;
      if (_drag && _drag.started) return; // fue arrastre real
      openTaskDetail(task);
    });

    var bar = document.createElement('div');
    bar.className = 'tk-card-bar';
    bar.style.background = task.catColor;
    card.appendChild(bar);

    if (task.projectName) {
      var proj = document.createElement('div');
      proj.className = 'tk-card-proj';
      proj.style.color = task.catColor;

        projects.forEach(function(p){ if(p.stageTasks) Object.keys(p.stageTasks).forEach(function(s){ if(p.stageTasks[s]) count+=p.stageTasks[s].filter(function(t){return t.done||(t.colStatus===cid);}).length; }); });
        count+=standaloneTasks.filter(function(t){return t.done||(t.colStatus===cid);}).length;
        openConf('Vaciar '+'"'+(doneCol?doneCol.label:'terminadas')+'"','Se eliminarán '+count+' tarea'+(count!==1?'s':'')+' completadas de forma permanente.',function(){
          projects.forEach(function(p){ if(p.stageTasks) Object.keys(p.stageTasks).forEach(function(s){ if(p.stageTasks[s]) p.stageTasks[s]=p.stageTasks[s].filter(function(t){return !(t.done||(t.colStatus===cid));}); }); });
          standaloneTasks=standaloneTasks.filter(function(t){return !(t.done||(t.colStatus===cid));});

    } else if (col.isDone) {

      vis.forEach(function(t){ body.appendChild(buildCard(t)); });
      if (!showDone && tasks.length > 5) {
        var btn = document.createElement('button'); btn.className='done-toggle'; btn.textContent='▼ Ver '+(tasks.length-5)+' más';
        btn.onclick=function(){ showDone=true; renderBoard(); }; body.appendChild(btn);

  function renderBoard() {
    if (!taskColumns) taskColumns = JSON.parse(JSON.stringify(DEFAULT_TASK_COLS));
    var all = getAllTasks();
    var filtered = filterPerson ? all.filter(function(t){ return t.resp===filterPerson; }) : all;

    // Distribute tasks into columns
    var colMap = {};
    taskColumns.forEach(function(c){ colMap[c.id]=[]; });
    var knownIds = taskColumns.map(function(c){ return c.id; });
    // Legacy fallback columns for tasks without explicit colStatus
    var nonDoneCols = taskColumns.filter(function(c){ return !c.isDone; });
    var doneCols = taskColumns.filter(function(c){ return c.isDone; });
    var fallbackTodo = nonDoneCols.length ? nonDoneCols[0].id : 'notstarted';
    var fallbackDoing = nonDoneCols.length > 1 ? nonDoneCols[1].id : fallbackTodo;
    var fallbackDone = doneCols.length ? doneCols[0].id : 'done';

    filtered.forEach(function(t){
      var cid = t.colStatus;
      if (cid && colMap[cid] !== undefined) { colMap[cid].push(t); return; }
      // Legacy / no colStatus
      if (t.done) { if (colMap[fallbackDone]) colMap[fallbackDone].push(t); }
      else if (t.deadline) { if (colMap[fallbackDoing]) colMap[fallbackDoing].push(t); }
      else { if (colMap[fallbackTodo]) colMap[fallbackTodo].push(t); }
    });

    function bySortOrder(a,b){
      if (a.priority&&!b.priority) return -1;
      if (!a.priority&&b.priority) return 1;
      return a.sortOrder-b.sortOrder;
    }
    taskColumns.forEach(function(c){ colMap[c.id].sort(bySortOrder); });

    var board = document.getElementById('boardWrap');
    board.innerHTML = '';
    var pending=0, doneCount=0;
    taskColumns.forEach(function(col){
      board.appendChild(buildCol(col, colMap[col.id]));
      if (col.isDone) doneCount+=colMap[col.id].length; else pending+=colMap[col.id].length;
    });

    // Add column button
    var addBtn = document.createElement('div');
    addBtn.className = 'tk-add-col-btn';
    addBtn.innerHTML = '<span>+</span>Columna';
    addBtn.onclick = addTaskColumn;
    board.appendChild(addBtn);

    document.getElementById('countPill').textContent = pending+' pendiente'+(pending!==1?'s':'')+' · '+doneCount+' listas';
    if (_pendingSave) { _pendingSave=false; saveData(); }
  }

  // ── COLUMN DRAG REORDER ───────────────────────────────────
  var _colDrag = null;
  var _colInsertLine = null;

  function startColDrag(e, colId, colEl) {
    if (e.button!==0) return;
    _colDrag = {colId:colId, colEl:colEl, startX:e.clientX, startY:e.clientY, started:false, ghost:null, ox:0, oy:0, insertIdx:-1};
    document.addEventListener('pointermove', _onColDragMove, {passive:false});
    document.addEventListener('pointerup', _onColDragEnd);
    document.addEventListener('pointercancel', _onColDragEnd);
  }

  function _onColDragMove(e) {
    if (!_colDrag) return;
    var dx=e.clientX-_colDrag.startX, dy=e.clientY-_colDrag.startY;
    if (!_colDrag.started) {
      if (Math.abs(dx)<8&&Math.abs(dy)<8) return;
      e.preventDefault();
      _colDrag.started=true;
      var rect=_colDrag.colEl.getBoundingClientRect();
      var ghost=_colDrag.colEl.cloneNode(true);
      ghost.style.cssText+=';position:fixed;left:'+rect.left+'px;top:'+rect.top+'px;width:'+rect.width+'px;height:'+rect.height+'px;pointer-events:none;z-index:8000;opacity:0.88;transform:rotate(0.8deg) scale(1.02);box-shadow:0 28px 70px rgba(0,0,0,.85);transition:none;border-radius:18px;overflow:hidden;';
      document.body.appendChild(ghost);
      _colDrag.ghost=ghost; _colDrag.ox=e.clientX-rect.left; _colDrag.oy=e.clientY-rect.top;
      _colDrag.colEl.style.opacity='0.2';
      _colInsertLine=document.createElement('div');
      _colInsertLine.style.cssText='position:fixed;width:3px;background:rgba(255,255,255,0.75);border-radius:2px;pointer-events:none;z-index:7999;box-shadow:0 0 14px rgba(255,255,255,0.45);display:none;';
      document.body.appendChild(_colInsertLine);
    }
    e.preventDefault();
    _colDrag.ghost.style.left=(e.clientX-_colDrag.ox)+'px';
    _colDrag.ghost.style.top=(e.clientY-_colDrag.oy)+'px';
    // Find insertion gap
    var board=document.getElementById('boardWrap');
    var colEls=Array.from(board.querySelectorAll('.tk-col'));
    var insertIdx=colEls.length;
    for (var i=0;i<colEls.length;i++) {
      if (colEls[i]===_colDrag.colEl) continue;
      var r=colEls[i].getBoundingClientRect();
      if (e.clientX<r.left+r.width/2) { insertIdx=i; break; }
    }
    _colDrag.insertIdx=insertIdx;
    // Position insert line
    var refCol=colEls[insertIdx<colEls.length?insertIdx:colEls.length-1];
    if (refCol) {
      var lr=refCol.getBoundingClientRect();
      _colInsertLine.style.display='';
      _colInsertLine.style.top=lr.top+'px';
      _colInsertLine.style.height=lr.height+'px';
      _colInsertLine.style.left=(insertIdx<colEls.length?lr.left-5:lr.right+3)+'px';
    }
  }

  function _onColDragEnd(e) {
    if (!_colDrag) return;
    document.removeEventListener('pointermove',_onColDragMove);
    document.removeEventListener('pointerup',_onColDragEnd);
    document.removeEventListener('pointercancel',_onColDragEnd);
    if (!_colDrag.started) { _colDrag=null; return; }
    if (_colDrag.ghost&&_colDrag.ghost.parentNode) _colDrag.ghost.parentNode.removeChild(_colDrag.ghost);
    if (_colInsertLine&&_colInsertLine.parentNode) _colInsertLine.parentNode.removeChild(_colInsertLine);
    _colInsertLine=null; _colDrag.colEl.style.opacity='';
    // Reorder taskColumns
    var board=document.getElementById('boardWrap');
    var colEls=Array.from(board.querySelectorAll('.tk-col'));
    var fromIdx=-1;
    for (var i=0;i<colEls.length;i++){if(colEls[i]===_colDrag.colEl){fromIdx=i;break;}}
    var toIdx=_colDrag.insertIdx>fromIdx?_colDrag.insertIdx-1:_colDrag.insertIdx;
    if (fromIdx>=0&&toIdx!==fromIdx) {
      var moved=taskColumns.splice(fromIdx,1)[0];
      taskColumns.splice(toIdx,0,moved);
      saveData();
    }
    _colDrag=null; renderBoard();
  }

  function addTaskColumn() {
    taskColumns.push({
      id:'col_'+Date.now(), label:'Nueva columna',
      bg:COL_PALETTES[7].bg, border:COL_PALETTES[7].br,
      titleColor:COL_PALETTES[7].tc, dotColor:COL_PALETTES[7].dc,
      isDone:false
    });
    saveData(); renderBoard();
  }

  function _toggleInArray(arr, taskId) {
    for (var j=0;j<arr.length;j++){
      if (arr[j].id===taskId){
        arr[j].done=!arr[j].done;
        if (arr[j].done) {
          var dc=taskColumns.filter(function(c){return c.isDone;}); arr[j].colStatus=dc.length?dc[0].id:'done';
        } else {
          var nd=taskColumns.filter(function(c){return !c.isDone;});
          arr[j].colStatus=arr[j].deadline?(nd.length>1?nd[1].id:nd[0]?nd[0].id:'inprogress'):(nd[0]?nd[0].id:'notstarted');
        }
        saveData(); renderBoard(); return true;
      }
    }
    return false;
  }
  function toggleTask(projectId, stage, taskId) {
    if (projectId==='standalone') { _toggleInArray(standaloneTasks, taskId); return; }
    for (var i=0;i<projects.length;i++){
      if (projects[i].id===projectId){
        var tasks = projects[i].stageTasks && projects[i].stageTasks[stage];
        if (tasks && _toggleInArray(tasks, taskId)) return;
      }
    }
  }

  // ── POINTER DRAG (threshold 6px para no bloquear clicks) ──
  var _drag = null;
  var DRAG_THRESHOLD = 6;

  function startCardDrag(e, task, card) {
    if (e.button !== 0) return;
    // NO preventDefault aquí — permite que los clicks funcionen normalmente
    _drag = {
      task: task, card: card, ghost: null,
      startX: e.clientX, startY: e.clientY,
      ox: 0, oy: 0, lastCol: null,
      started: false, moved: false
    };
    document.addEventListener('pointermove', _onDragMove, {passive: false});
    document.addEventListener('pointerup',   _onDragEnd);
    document.addEventListener('pointercancel', _onDragEnd);
  }

  function _onDragMove(e) {
    if (!_drag) return;
    var dx = e.clientX - _drag.startX;
    var dy = e.clientY - _drag.startY;

    if (!_drag.started) {
      if (Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return;
      // Umbral superado — iniciar arrastre visual
      e.preventDefault();
      _drag.started = true;
      var rect = _drag.card.getBoundingClientRect();
      var ghost = _drag.card.cloneNode(true);
      ghost.className = ghost.className.replace('tk-dragging','') + ' tk-ghost';
      ghost.style.width = rect.width + 'px';
      ghost.style.left  = rect.left  + 'px';
      ghost.style.top   = rect.top   + 'px';
      document.body.appendChild(ghost);
      _drag.card.classList.add('tk-dragging');
      _drag.ghost = ghost;
      _drag.ox = e.clientX - rect.left;
      _drag.oy = e.clientY - rect.top;
      if (!dragPlaceholder) {
        dragPlaceholder = document.createElement('div');
        dragPlaceholder.className = 'tk-placeholder';
      }
    }

    e.preventDefault();
    _drag.moved = true;
    _drag.ghost.style.left = (e.clientX - _drag.ox) + 'px';
    _drag.ghost.style.top  = (e.clientY - _drag.oy) + 'px';

    var el = document.elementFromPoint(e.clientX, e.clientY);
    var colBody = el ? el.closest('[data-coltype]') : null;
    if (!colBody) {
      if (dragPlaceholder.parentNode) dragPlaceholder.parentNode.removeChild(dragPlaceholder);
      if (_drag.lastCol) { _drag.lastCol.classList.remove('tk-drag-active'); _drag.lastCol = null; }
      return;
    }
    if (_drag.lastCol && _drag.lastCol !== colBody) _drag.lastCol.classList.remove('tk-drag-active');
    colBody.classList.add('tk-drag-active');
    _drag.lastCol = colBody;
    var afterEl = _getAfterEl(colBody, e.clientY);
    if (!afterEl) colBody.appendChild(dragPlaceholder);
    else colBody.insertBefore(dragPlaceholder, afterEl);
  }

  function _onDragEnd(e) {
    if (!_drag) return;
    document.removeEventListener('pointermove', _onDragMove);
    document.removeEventListener('pointerup',   _onDragEnd);
    document.removeEventListener('pointercancel', _onDragEnd);

    if (!_drag.started) { _drag = null; return; } // fue un click, no arrastre

    if (_drag.ghost && _drag.ghost.parentNode) _drag.ghost.parentNode.removeChild(_drag.ghost);
    _drag.card.classList.remove('tk-dragging');
    document.querySelectorAll('.tk-col-body').forEach(function(b){ b.classList.remove('tk-drag-active'); });

    if (dragPlaceholder && dragPlaceholder.parentNode) {
      var colBody = dragPlaceholder.parentNode;
      var colType = colBody.dataset.coltype;
      var newSortOrder = _calcSortOrder(colBody, dragPlaceholder);
      dragPlaceholder.parentNode.removeChild(dragPlaceholder);
      if (colType && _drag.moved) {
        _commitDrop(_drag.task.projectId, _drag.task.stage, _drag.task.id, colType, newSortOrder);
        _drag = null;
        return;
      }
    }
    _drag = null;
    renderBoard();
  }

  function _calcSortOrder(colBody, placeholder) {
    var children = Array.from(colBody.children);
    var phIdx = children.indexOf(placeholder);
    var before = null, after = null;
    for (var i = phIdx - 1; i >= 0; i--) {
      if (children[i].classList && children[i].classList.contains('tk-card') && children[i].dataset.sortorder) {
        before = parseFloat(children[i].dataset.sortorder); break;
      }
    }
    for (var i = phIdx + 1; i < children.length; i++) {
      if (children[i].classList && children[i].classList.contains('tk-card') && children[i].dataset.sortorder) {
        after = parseFloat(children[i].dataset.sortorder); break;
      }
    }
    if (before === null && after === null) return Date.now();
    if (before === null) return after - 100000;
    if (after === null) return before + 100000;
    return (before + after) / 2;
  }

  function _getAfterEl(container, y) {
    var els = Array.from(container.querySelectorAll('.tk-card'));
    return els.reduce(function(closest, child) {
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) { return {offset: offset, element: child}; }
      return closest;
    }, {offset: Number.NEGATIVE_INFINITY}).element;
  }

  function _commitDrop(projectId, stage, taskId, newColType, newSortOrder) {
    if (projectId==='standalone') {
      for (var si=0;si<standaloneTasks.length;si++){
        if (standaloneTasks[si].id===taskId){
          standaloneTasks[si].colStatus=newColType; var _sc=getColById(newColType); standaloneTasks[si].done=_sc?!!_sc.isDone:(newColType==='done'); standaloneTasks[si].sortOrder=newSortOrder;
          saveData(); renderBoard(); return;
        }
      }
      return;
    }
    for (var i=0;i<projects.length;i++){
      if (projects[i].id===projectId){
        var tasks = projects[i].stageTasks && projects[i].stageTasks[stage];
        if (tasks){
          for (var j=0;j<tasks.length;j++){
            if (tasks[j].id===taskId){
              tasks[j].colStatus = newColType;
              var _tc=getColById(newColType); tasks[j].done=_tc?!!_tc.isDone:(newColType==='done');
              tasks[j].sortOrder = newSortOrder;
              saveData();
              renderBoard();
              return;
            }
          }
        }
      }
    }
  }

    document.getElementById('ntDlBtn').onclick=function(e){e.stopPropagation();tkOpenDatePicker(this,document.getElementById('ntDeadline').value,function(v){document.getElementById('ntDeadline').value=v;_updDlBtn(document.getElementById('ntDlBtn'),v);});};
    // group
    document.getElementById('ntGRespBtn').onclick=function(e){e.stopPropagation();tkOpenPersonPicker(this,document.getElementById('ntGResp').value,function(v){document.getElementById('ntGResp').value=v;_updRespBtn(document.getElementById('ntGRespBtn'),v);});};
    document.getElementById('ntGDlBtn').onclick=function(e){e.stopPropagation();tkOpenDatePicker(this,document.getElementById('ntGDeadline').value,function(v){document.getElementById('ntGDeadline').value=v;_updDlBtn(document.getElementById('ntGDlBtn'),v);});};
  })();

  // Init — onSnapshot para sincronización en tiempo real con proyectos.html
  DOC.onSnapshot(function(snap){
    if (_ignoreSnap) { _ignoreSnap = false; return; }
    if (snap.exists){
      var d = snap.data();
      if (d.projects && d.projects.length) projects = d.projects;
      if (d.categories && d.categories.length) categories = d.categories;
      if (d.nextId) nextId = d.nextId;
      if (d.catIdCounter) catIdCounter = d.catIdCounter;
      if (d.standaloneTasks) standaloneTasks = d.standaloneTasks;
      if (d.taskColumns && d.taskColumns.length) taskColumns = d.taskColumns;
      if (d.teamMembers && d.teamMembers.length) teamMembers = d.teamMembers;
      if (d.taskGroups) taskGroups = d.taskGroups;
    }
    if (!taskColumns) taskColumns = JSON.parse(JSON.stringify(DEFAULT_TASK_COLS));
    // Sync AV_COLORS/AV_NAMES from teamMembers
    teamMembers.forEach(function(m){ AV_COLORS[m.id]=m.color; AV_NAMES[m.id]=m.name; });
    renderPersonPills();
    renderBoard();
  }, function(e){ console.warn('Error:', e); renderBoard(); });

})();
</script>
</body>
</html>
