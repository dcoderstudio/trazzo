<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tareas — Dcoder Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#0c0c0c;color:#fff;font-family:'Inter',sans-serif;overflow:hidden;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:52px;border-bottom:0.5px solid rgba(255,255,255,0.06);flex-shrink:0;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-pill{background:#fff;color:#0c0c0c;font-size:11px;font-weight:800;padding:5px 10px;border-radius:8px;}
.logo-name{font-size:14px;font-weight:700;letter-spacing:.04em;}
.nav-btn{background:none;border:none;color:rgba(255,255,255,0.28);font-size:12px;font-weight:500;padding:6px 16px;border-radius:20px;cursor:pointer;font-family:'Inter',sans-serif;}
.nav-btn.active{background:rgba(255,255,255,0.1);color:#fff;}
.subbar{display:flex;align-items:center;gap:6px;padding:0 28px;height:48px;border-bottom:0.5px solid rgba(255,255,255,0.06);flex-shrink:0;}
.subbar-sep{width:0.5px;height:20px;background:rgba(255,255,255,0.08);margin:0 2px;flex-shrink:0;}
.person-pill{display:flex;align-items:center;gap:5px;padding:4px 10px 4px 6px;border-radius:20px;border:0.5px solid rgba(255,255,255,0.08);background:transparent;color:rgba(255,255,255,0.38);font-size:11px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;white-space:nowrap;}
.person-pill:hover{background:rgba(255,255,255,0.06);color:#fff;border-color:rgba(255,255,255,0.18);}
.person-pill.active{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.28);color:#fff;}
.person-pill-av{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;flex-shrink:0;}
.count-pill{font-size:11px;color:rgba(255,255,255,0.22);background:rgba(255,255,255,0.05);padding:4px 10px;border-radius:20px;white-space:nowrap;margin-left:auto;flex-shrink:0;}
/* KANBAN */
.board-wrap{display:flex;gap:14px;padding:20px 28px 24px;height:calc(100vh - 52px - 48px);overflow-x:auto;}
.board-wrap::-webkit-scrollbar{height:4px;}
.board-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}
.tk-col{flex:1;min-width:300px;max-width:420px;display:flex;flex-direction:column;gap:0;border-radius:18px;padding:14px 12px 12px;}
/* Column tints */
.tk-col-notstarted{background:rgba(71,130,255,0.07);border:0.5px solid rgba(71,130,255,0.14);}
.tk-col-inprogress{background:rgba(232,160,32,0.07);border:0.5px solid rgba(232,160,32,0.15);}
.tk-col-done{background:rgba(39,174,114,0.07);border:0.5px solid rgba(39,174,114,0.15);}
.tk-col-hdr{display:flex;align-items:center;gap:8px;padding:0 2px 14px;flex-shrink:0;}
.tk-col-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.tk-col-title{font-size:13px;font-weight:700;letter-spacing:.02em;}
.tk-col-count{font-size:11px;font-weight:700;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.4);padding:2px 9px;border-radius:10px;}
.tk-col-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:0 0 4px;}
.tk-col-body::-webkit-scrollbar{width:3px;}
.tk-col-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}
/* SUB HEADERS within In Progress */
.tk-sub-hdr{display:flex;align-items:center;gap:8px;padding:4px 2px 8px;flex-shrink:0;}
.tk-sub-hdr.urgent .tk-sub-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#E24B4A;}
.tk-sub-hdr.urgent .tk-sub-line{flex:1;height:0.5px;background:rgba(226,75,74,0.3);}
.tk-sub-hdr.urgent .tk-sub-dot{width:6px;height:6px;border-radius:50%;background:#E24B4A;flex-shrink:0;}
.tk-sub-hdr.normal{margin-top:4px;}
.tk-sub-hdr.normal .tk-sub-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,0.25);}
.tk-sub-hdr.normal .tk-sub-line{flex:1;height:0.5px;background:rgba(255,255,255,0.07);}
/* TASK CARD */
.tk-card{background:#181818;border:0.5px solid rgba(255,255,255,0.08);border-radius:13px;padding:14px 14px 12px 18px;position:relative;overflow:hidden;transition:transform .12s,box-shadow .12s,border-color .12s;flex-shrink:0;}
.tk-card:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.45);border-color:rgba(255,255,255,0.16);}
.tk-card.urgent-card{border-color:rgba(226,75,74,0.25);background:#1c1414;}
.tk-card.done-card{opacity:.38;}
.tk-card-bar{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;}
.tk-card-proj{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.tk-card-text{font-size:14px;font-weight:600;color:rgba(255,255,255,0.9);line-height:1.45;margin-bottom:6px;}
.tk-card.done-card .tk-card-text{text-decoration:line-through;color:rgba(255,255,255,0.38);}
.tk-card-stage{font-size:11px;color:rgba(255,255,255,0.28);margin-bottom:10px;line-height:1.3;}
.tk-card-footer{display:flex;align-items:center;justify-content:space-between;}
.tk-card-av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;}
.tk-card-dl{font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;white-space:nowrap;}
.tk-card-dl.overdue{background:rgba(226,75,74,0.18);color:#E24B4A;}
.tk-card-dl.today{background:rgba(232,160,32,0.18);color:#E8A020;}
.tk-card-dl.soon{background:rgba(232,160,32,0.12);color:#E8A020;}
.tk-card-dl.ok{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.4);}
.tk-check-sm{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s;}
.tk-check-sm:hover{border-color:rgba(255,255,255,0.5);}
.tk-check-sm.on{background:#27AE72;border-color:#27AE72;}
.tk-check-sm svg{opacity:0;}
.tk-check-sm.on svg{opacity:1;}
.tk-empty{padding:36px 14px;text-align:center;color:rgba(255,255,255,0.18);font-size:12px;border:1px dashed rgba(255,255,255,0.08);border-radius:12px;}
.done-toggle{background:none;border:0.5px solid rgba(255,255,255,0.1);border-radius:10px;color:rgba(255,255,255,0.3);font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;padding:9px 14px;transition:all .15s;text-align:left;width:100%;}
.done-toggle:hover{border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.55);}
/* DRAG & DROP */
.tk-card{cursor:grab;}
.tk-card.tk-dragging{opacity:0.12!important;}
.tk-ghost{position:fixed;pointer-events:none;z-index:9000;border-radius:12px;box-shadow:0 24px 64px rgba(0,0,0,0.75);transform:rotate(1.5deg) scale(1.03);transition:none;opacity:0.92;}
.tk-col-body.tk-drag-active{background:rgba(255,255,255,0.03);border-radius:10px;}
.tk-placeholder{min-height:72px;border-radius:12px;border:1.5px dashed rgba(255,255,255,0.22);background:rgba(255,255,255,0.02);flex-shrink:0;}
/* NEW TASK BUTTON */
.new-task-btn{background:#fff;color:#0c0c0c;border:none;font-size:11px;font-weight:700;padding:6px 14px;border-radius:20px;cursor:pointer;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:5px;margin-left:auto;flex-shrink:0;}
.new-task-btn:hover{background:#e0e0e0;}
/* MODAL */
.t-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);z-index:500;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.t-overlay.open{opacity:1;pointer-events:all;}
.t-modal{background:#161616;border:0.5px solid rgba(255,255,255,0.1);border-radius:20px;padding:26px;width:420px;max-width:92vw;display:flex;flex-direction:column;gap:14px;transform:translateY(8px);transition:transform .2s;}
.t-overlay.open .t-modal{transform:none;}
.t-modal-title{font-size:15px;font-weight:700;}
.t-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,0.3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px;}
.t-inp{background:#1e1e1e;border:0.5px solid rgba(255,255,255,0.1);border-radius:10px;padding:9px 13px;font-size:13px;color:#fff;font-family:'Inter',sans-serif;outline:none;width:100%;transition:border-color .15s;}
.t-inp:focus{border-color:rgba(255,255,255,0.3);}
.t-inp::placeholder{color:rgba(255,255,255,0.18);}
.t-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.t-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}
.t-btn-c{background:rgba(255,255,255,0.07);border:none;color:rgba(255,255,255,0.45);font-size:12px;font-weight:600;padding:8px 16px;border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;}
.t-btn-ok{background:#fff;border:none;color:#0c0c0c;font-size:12px;font-weight:700;padding:8px 16px;border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;}
/* PRIORITY FLAG */
.tk-flag-btn{position:absolute;top:9px;right:10px;background:none;border:none;cursor:pointer;font-size:13px;padding:2px;line-height:1;opacity:0;transition:opacity .15s;z-index:2;}
.tk-card:hover .tk-flag-btn{opacity:0.45;}
.tk-flag-btn.on{opacity:1!important;filter:saturate(1.5);}
.tk-card.priority-card{border-color:rgba(232,160,32,0.35)!important;background:#1b1a14;}
.tk-card.priority-card .tk-card-text{color:#fff;}
/* TASK DETAIL MODAL */
.tk-det-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);z-index:700;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.tk-det-overlay.open{opacity:1;pointer-events:all;}
.tk-det-modal{background:#161616;border:0.5px solid rgba(255,255,255,0.1);border-radius:22px;width:460px;max-width:94vw;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;transform:translateY(10px);transition:transform .2s;}
.tk-det-overlay.open .tk-det-modal{transform:none;}
.tk-det-head{display:flex;align-items:center;gap:10px;padding:18px 20px 14px;border-bottom:0.5px solid rgba(255,255,255,0.07);}
.tk-det-bar{width:4px;height:38px;border-radius:3px;flex-shrink:0;}
.tk-det-meta{flex:1;min-width:0;}
.tk-det-projname{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;}
.tk-det-stagename{font-size:11px;color:rgba(255,255,255,0.3);}
.tk-det-close{background:none;border:none;color:rgba(255,255,255,0.28);font-size:20px;cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0;}
.tk-det-close:hover{color:#fff;}
.tk-det-body{display:flex;flex-direction:column;gap:14px;padding:18px 20px 22px;}
.tk-det-textarea{background:#1e1e1e;border:0.5px solid rgba(255,255,255,0.1);border-radius:10px;padding:11px 13px;font-size:14px;font-weight:600;color:#fff;font-family:'Inter',sans-serif;outline:none;width:100%;resize:none;min-height:68px;line-height:1.45;transition:border-color .15s;}
.tk-det-textarea:focus{border-color:rgba(255,255,255,0.3);}
.tk-det-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,0.3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px;}
.tk-det-inp{background:#1e1e1e;border:0.5px solid rgba(255,255,255,0.1);border-radius:10px;padding:9px 12px;font-size:12px;color:#fff;font-family:'Inter',sans-serif;outline:none;width:100%;transition:border-color .15s;}
.tk-det-inp:focus{border-color:rgba(255,255,255,0.3);}
.tk-det-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.tk-det-notes{background:#1e1e1e;border:0.5px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px 13px;font-size:12px;color:rgba(255,255,255,0.7);font-family:'Inter',sans-serif;outline:none;width:100%;resize:vertical;min-height:72px;line-height:1.5;transition:border-color .15s;}
.tk-det-notes:focus{border-color:rgba(255,255,255,0.3);}
.tk-det-notes::placeholder{color:rgba(255,255,255,0.18);}
.tk-det-foot{display:flex;gap:8px;justify-content:flex-end;}
.tk-notes-dot{width:6px;height:6px;border-radius:50%;background:rgba(232,160,32,0.6);flex-shrink:0;}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><div class="logo-pill">D/</div><span class="logo-name">Dcoder Studio</span></div>
  <div style="display:flex;gap:2px;">
    <button class="nav-btn" onclick="location.href='index.html'">Inicio</button>
    <button class="nav-btn" onclick="location.href='proyectos.html'">Proyectos</button>
    <button class="nav-btn active">Tareas</button>
    <button class="nav-btn">Equipo</button>
    <button class="nav-btn">Finanzas</button>
    <button class="nav-btn">Clientes</button>
    <button class="nav-btn" onclick="location.href='cotizacion.html'">Cotizaciones</button>
  </div>
  <div style="width:120px;"></div>
</div>

<div style="display:flex;flex-direction:column;height:calc(100vh - 52px);">
  <div class="subbar">
    <button class="person-pill active" id="ppAll"><span style="font-size:11px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;">👥</span>Todos</button>
    <button class="person-pill" id="ppAR"><span class="person-pill-av" style="background:#1A6FD4;">AR</span>Ana R.</button>
    <button class="person-pill" id="ppLM"><span class="person-pill-av" style="background:#7B6FD0;">LM</span>Luis M.</button>
    <button class="person-pill" id="ppSV"><span class="person-pill-av" style="background:#D4537E;">SV</span>Sofía V.</button>
    <button class="person-pill" id="ppRG"><span class="person-pill-av" style="background:#E8A020;">RG</span>Rodrigo G.</button>
    <span class="count-pill" id="countPill">— tareas</span>
    <button class="new-task-btn" onclick="openNewTaskModal()">+ Nueva tarea</button>
  </div>

  <!-- New task modal -->
  <div class="t-overlay" id="newTaskOverlay" onclick="if(event.target===this)closeNewTaskModal()">
    <div class="t-modal">
      <div class="t-modal-title">Nueva tarea</div>
      <div>
        <div class="t-lbl">Proyecto</div>
        <select class="t-inp" id="ntProject" onchange="ntUpdateStages()"></select>
      </div>
      <div>
        <div class="t-lbl">Fase</div>
        <select class="t-inp" id="ntStage"></select>
      </div>
      <div>
        <div class="t-lbl">Tarea</div>
        <input class="t-inp" id="ntText" type="text" placeholder="Descripción de la tarea…">
      </div>
      <div class="t-grid2">
        <div>
          <div class="t-lbl">Responsable</div>
          <select class="t-inp" id="ntResp">
            <option value="">Sin asignar</option>
            <option value="AR">Ana Ramírez</option>
            <option value="LM">Luis Mora</option>
            <option value="SV">Sofía Vega</option>
            <option value="RG">Rodrigo Gil</option>
          </select>
        </div>
        <div>
          <div class="t-lbl">Fecha límite</div>
          <input class="t-inp" id="ntDeadline" type="date">
        </div>
      </div>
      <div class="t-foot">
        <button class="t-btn-c" onclick="closeNewTaskModal()">Cancelar</button>
        <button class="t-btn-ok" onclick="saveNewTask()">Agregar tarea</button>
      </div>
    </div>
  </div>

  <!-- Task detail modal -->
  <div class="tk-det-overlay" id="tkDetOverlay" onclick="if(event.target===this)closeTaskDetail()">
    <div class="tk-det-modal">
      <div class="tk-det-head">
        <div class="tk-det-bar" id="tkDetBar"></div>
        <div class="tk-det-meta">
          <div class="tk-det-projname" id="tkDetProj"></div>
          <div class="tk-det-stagename" id="tkDetStage"></div>
        </div>
        <button class="tk-det-close" onclick="closeTaskDetail()">×</button>
      </div>
      <div class="tk-det-body">
        <div>
          <div class="tk-det-lbl">Tarea</div>
          <textarea class="tk-det-textarea" id="tkDetText" rows="2"></textarea>
        </div>
        <div class="tk-det-grid">
          <div>
            <div class="tk-det-lbl">Responsable</div>
            <select class="tk-det-inp" id="tkDetResp">
              <option value="">Sin asignar</option>
              <option value="AR">Ana Ramírez</option>
              <option value="LM">Luis Mora</option>
              <option value="SV">Sofía Vega</option>
              <option value="RG">Rodrigo Gil</option>
            </select>
          </div>
          <div>
            <div class="tk-det-lbl">Fecha límite</div>
            <input type="date" class="tk-det-inp" id="tkDetDeadline">
          </div>
          <div>
            <div class="tk-det-lbl">Estado</div>
            <select class="tk-det-inp" id="tkDetStatus">
              <option value="notstarted">Sin iniciar</option>
              <option value="inprogress">En proceso</option>
              <option value="done">Terminada</option>
            </select>
          </div>
        </div>
        <div>
          <div class="tk-det-lbl">Observaciones</div>
          <textarea class="tk-det-notes" id="tkDetNotes" placeholder="Agrega una nota o comentario…"></textarea>
        </div>
        <div class="tk-det-foot">
          <button class="t-btn-c" onclick="closeTaskDetail()">Cancelar</button>
          <button class="t-btn-ok" onclick="saveTaskDetail()">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="board-wrap" id="boardWrap">
    <!-- rendered by JS -->
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(function() {
  firebase.initializeApp({
    apiKey: "AIzaSyC3LG6e_7YAbYQhdPe6IC_Mq3SFop0XPsk",
    authDomain: "trazzo-c9eaf.firebaseapp.com",
    projectId: "trazzo-c9eaf",
    storageBucket: "trazzo-c9eaf.firebasestorage.app",
    messagingSenderId: "106264633340",
    appId: "1:106264633340:web:4b2560a57e75321c709c79"
  });
  var db = firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(function(){});
  var DOC = db.collection('workspace').doc('proyectos');

  var projects = [], categories = [];
  var nextId = 14, catIdCounter = 20;
  var AV_COLORS = {AR:'#1A6FD4',LM:'#7B6FD0',SV:'#D4537E',RG:'#E8A020'};
  var AV_NAMES  = {AR:'Ana Ramírez',LM:'Luis Mora',SV:'Sofía Vega',RG:'Rodrigo Gil'};
  var MNS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var filterPerson = '';
  var showDone = false;
  var dragPlaceholder = null;
  var _ignoreSnap = false;
  var _pendingSave = false;

  function saveData() {
    _ignoreSnap = true;
    DOC.set({projects:projects, categories:categories, nextId:nextId, catIdCounter:catIdCounter})
      .catch(function(e){ console.warn('Error al guardar:', e); });
  }

  function getCat(catId) {
    for (var i=0;i<categories.length;i++){if(categories[i].id===catId)return categories[i];}
    return null;
  }

  function getAllTasks() {
    var result = [];
    projects.forEach(function(proj) {
      if (proj.catId === 'cotizaciones') return;
      if (!proj.stageTasks) proj.stageTasks = {};
      var cat = getCat(proj.catId);
      var stage = proj.stage;
      var tasks = proj.stageTasks[stage];
      // Auto-siembra: si no hay tareas para esta fase pero hay templates, crearlas aquí
      if ((!tasks || !tasks.length) && cat && cat.templates && cat.templates[stage] && cat.templates[stage].length) {
        var base = Date.now();
        proj.stageTasks[stage] = cat.templates[stage].map(function(item, i) {
          var text = typeof item === 'string' ? item : (item.text || '');
          return {id: base + i, text: text, done: false, deadline: '', resp: ''};
        });
        tasks = proj.stageTasks[stage];
        _pendingSave = true;
      }
      if (!tasks || !tasks.length) return;
      tasks.forEach(function(task) {
        result.push({
          id: task.id,
          text: task.text,
          done: !!task.done,
          colStatus: task.colStatus || null,
          sortOrder: task.sortOrder != null ? task.sortOrder : task.id,
          deadline: task.deadline || '',
          resp: task.resp || '',
          priority: !!task.priority,
          notes: task.notes || '',
          projectId: proj.id,
          projectName: proj.name,
          stage: stage,
          catColor: cat ? cat.color : 'rgba(255,255,255,0.2)'
        });
      });
    });
    return result;
  }

  function getDlClass(deadline) {
    if (!deadline) return '';
    var today = new Date(); today.setHours(0,0,0,0);
    var diff = Math.ceil((new Date(deadline+'T00:00:00') - today) / 86400000);
    if (diff < 0) return 'overdue';
    if (diff === 0) return 'today';
    if (diff <= 3) return 'soon';
    return 'ok';
  }

  function isUrgent(deadline) {
    if (!deadline) return false;
    var today = new Date(); today.setHours(0,0,0,0);
    var diff = Math.ceil((new Date(deadline+'T00:00:00') - today) / 86400000);
    return diff <= 3;
  }

  function fmtDate(dl) {
    var d = new Date(dl+'T00:00:00');
    return d.getDate()+' '+MNS[d.getMonth()];
  }

  function buildCard(task) {
    var card = document.createElement('div');
    var urgent = !task.done && task.deadline && isUrgent(task.deadline);
    card.className = 'tk-card' + (urgent ? ' urgent-card' : '') + (task.done ? ' done-card' : '') + (task.priority ? ' priority-card' : '');
    card.dataset.sortorder = String(task.sortOrder != null ? task.sortOrder : task.id);

    // Flag button (top-right)
    var flagBtn = document.createElement('button');
    flagBtn.className = 'tk-flag-btn' + (task.priority ? ' on' : '');
    flagBtn.textContent = '🚩';
    flagBtn.title = task.priority ? 'Quitar prioridad' : 'Marcar prioritaria';
    flagBtn.onclick = (function(pid,st,tid){ return function(e){ e.stopPropagation(); toggleFlag(pid,st,tid); }; })(task.projectId, task.stage, task.id);
    card.appendChild(flagBtn);

    card.addEventListener('pointerdown', function(e) {
      if (e.button !== 0) return;
      if (e.target.closest('.tk-flag-btn') || e.target.closest('.tk-check-sm')) return;
      startCardDrag(e, task, card);
    });
    card.addEventListener('click', function(e) {
      if (e.target.closest('.tk-flag-btn') || e.target.closest('.tk-check-sm')) return;
      if (_drag && _drag.started) return; // fue arrastre real
      openTaskDetail(task);
    });

    var bar = document.createElement('div');
    bar.className = 'tk-card-bar';
    bar.style.background = task.catColor;
    card.appendChild(bar);

    var proj = document.createElement('div');
    proj.className = 'tk-card-proj';
    proj.style.color = task.catColor;
    proj.textContent = task.projectName;
    card.appendChild(proj);

    var txt = document.createElement('div');
    txt.className = 'tk-card-text';
    txt.textContent = task.text;
    card.appendChild(txt);

    var stageEl = document.createElement('div');
    stageEl.className = 'tk-card-stage';
    stageEl.textContent = task.stage;
    card.appendChild(stageEl);

    var footer = document.createElement('div');
    footer.className = 'tk-card-footer';

    var leftFt = document.createElement('div');
    leftFt.style.cssText = 'display:flex;align-items:center;gap:6px;';

    var chk = document.createElement('div');
    chk.className = 'tk-check-sm' + (task.done ? ' on' : '');
    chk.innerHTML = '<svg viewBox="0 0 12 12" width="8" height="8"><polyline points="2,6 5,9 10,3" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    chk.title = task.done ? 'Marcar pendiente' : 'Marcar completada';
    chk.onclick = (function(pid,st,tid){ return function(e){ e.stopPropagation(); toggleTask(pid,st,tid); }; })(task.projectId, task.stage, task.id);
    leftFt.appendChild(chk);

    if (task.resp && AV_COLORS[task.resp]) {
      var av = document.createElement('div');
      av.className = 'tk-card-av';
      av.style.background = AV_COLORS[task.resp];
      av.title = AV_NAMES[task.resp] || task.resp;
      av.textContent = task.resp;
      leftFt.appendChild(av);
    }
    if (task.notes) {
      var nd = document.createElement('div');
      nd.className = 'tk-notes-dot';
      nd.title = 'Tiene observaciones';
      leftFt.appendChild(nd);
    }
    footer.appendChild(leftFt);

    // Deadline — siempre visible (sin fecha muestra guión)
    var dlCls = task.deadline ? getDlClass(task.deadline) : '';
    var dl = document.createElement('span');
    dl.className = 'tk-card-dl' + (dlCls ? ' ' + dlCls : '');
    dl.style.cssText = !task.deadline ? 'color:rgba(255,255,255,0.15);font-size:10px;' : '';
    dl.textContent = task.deadline ? fmtDate(task.deadline) : '—';
    footer.appendChild(dl);

    card.appendChild(footer);
    return card;
  }

  function mkSubHdr(type, label) {
    var h = document.createElement('div');
    h.className = 'tk-sub-hdr ' + type;
    if (type === 'urgent') {
      var dot = document.createElement('div'); dot.className = 'tk-sub-dot';
      var lbl = document.createElement('span'); lbl.className = 'tk-sub-lbl'; lbl.textContent = label;
      var line = document.createElement('div'); line.className = 'tk-sub-line';
      h.appendChild(dot); h.appendChild(lbl); h.appendChild(line);
    } else {
      var lbl2 = document.createElement('span'); lbl2.className = 'tk-sub-lbl'; lbl2.textContent = label;
      var line2 = document.createElement('div'); line2.className = 'tk-sub-line';
      h.appendChild(lbl2); h.appendChild(line2);
    }
    return h;
  }

  function buildCol(title, dotColor, titleColor, tasks, colType) {
    var col = document.createElement('div');
    col.className = 'tk-col tk-col-' + colType;

    var hdr = document.createElement('div');
    hdr.className = 'tk-col-hdr';
    var dot = document.createElement('div'); dot.className = 'tk-col-dot'; dot.style.background = dotColor;
    var ttl = document.createElement('span'); ttl.className = 'tk-col-title'; ttl.style.color = titleColor; ttl.textContent = title;
    var cnt = document.createElement('span'); cnt.className = 'tk-col-count'; cnt.textContent = tasks.length;
    hdr.appendChild(dot); hdr.appendChild(ttl); hdr.appendChild(cnt);
    col.appendChild(hdr);

    var body = document.createElement('div');
    body.className = 'tk-col-body';
    body.dataset.coltype = colType;

    if (!tasks.length) {
      var empty = document.createElement('div');
      empty.className = 'tk-empty';
      empty.textContent = colType === 'done' ? 'Sin tareas completadas' : 'Sin tareas aquí';
      body.appendChild(empty);
    } else if (colType === 'inprogress') {
      // Split into urgent + normal
      var urgent = tasks.filter(function(t){ return isUrgent(t.deadline); });
      var normal  = tasks.filter(function(t){ return !isUrgent(t.deadline); });
      if (urgent.length) {
        body.appendChild(mkSubHdr('urgent', '⚡ Urgentes'));
        urgent.forEach(function(t){ body.appendChild(buildCard(t)); });
      }
      if (normal.length) {
        if (urgent.length) body.appendChild(mkSubHdr('normal', 'En proceso'));
        normal.forEach(function(t){ body.appendChild(buildCard(t)); });
      }
    } else if (colType === 'done') {
      var visible = showDone ? tasks : tasks.slice(0, 5);
      visible.forEach(function(t){ body.appendChild(buildCard(t)); });
      if (!showDone && tasks.length > 5) {
        var btn = document.createElement('button');
        btn.className = 'done-toggle';
        btn.textContent = '▼ Ver ' + (tasks.length - 5) + ' más';
        btn.onclick = function() { showDone = true; renderBoard(); };
        body.appendChild(btn);
      }
    } else {
      tasks.forEach(function(t){ body.appendChild(buildCard(t)); });
    }

    col.appendChild(body);
    return col;
  }

  function renderBoard() {
    var all = getAllTasks();
    var filtered = filterPerson ? all.filter(function(t){ return t.resp === filterPerson; }) : all;

    var notStarted = filtered.filter(function(t){
      if (t.colStatus === 'inprogress' || t.colStatus === 'done') return false;
      if (t.colStatus === 'notstarted') return true;
      return !t.done && !t.deadline;
    });
    var inProgress = filtered.filter(function(t){
      if (t.colStatus === 'notstarted' || t.colStatus === 'done') return false;
      if (t.colStatus === 'inprogress') return true;
      return !t.done && !!t.deadline;
    });
    var done = filtered.filter(function(t){
      if (t.colStatus === 'notstarted' || t.colStatus === 'inprogress') return false;
      if (t.colStatus === 'done') return true;
      return !!t.done;
    });

    function bySortOrder(a,b){
      if (a.priority && !b.priority) return -1;
      if (!a.priority && b.priority) return 1;
      return a.sortOrder - b.sortOrder;
    }
    notStarted.sort(bySortOrder);
    inProgress.sort(bySortOrder);
    done.sort(bySortOrder);

    var board = document.getElementById('boardWrap');
    board.innerHTML = '';
    board.appendChild(buildCol('Sin iniciar', 'rgba(255,255,255,0.3)', 'rgba(255,255,255,0.55)', notStarted, 'notstarted'));
    board.appendChild(buildCol('En proceso', '#1A6FD4', '#5B9FFF', inProgress, 'inprogress'));
    board.appendChild(buildCol('Terminadas', '#27AE72', '#27AE72', done, 'done'));

    var pending = notStarted.length + inProgress.length;
    document.getElementById('countPill').textContent = pending + ' pendiente' + (pending !== 1 ? 's' : '') + ' · ' + done.length + ' listas';

    // Si se sembraron tareas nuevas, persiste sin causar bucle
    if (_pendingSave) { _pendingSave = false; saveData(); }
  }

  function toggleTask(projectId, stage, taskId) {
    for (var i=0;i<projects.length;i++){
      if (projects[i].id===projectId){
        var tasks = projects[i].stageTasks && projects[i].stageTasks[stage];
        if (tasks){
          for (var j=0;j<tasks.length;j++){
            if (tasks[j].id===taskId){
              tasks[j].done = !tasks[j].done;
              tasks[j].colStatus = tasks[j].done ? 'done' : (tasks[j].deadline ? 'inprogress' : 'notstarted');
              saveData();
              renderBoard();
              return;
            }
          }
        }
      }
    }
  }

  // ── FLAG & DETAIL ────────────────────────────────────────
  function toggleFlag(projectId, stage, taskId) {
    for (var i=0;i<projects.length;i++){
      if (projects[i].id===projectId){
        var tasks = projects[i].stageTasks && projects[i].stageTasks[stage];
        if (tasks){ for (var j=0;j<tasks.length;j++){ if (tasks[j].id===taskId){ tasks[j].priority=!tasks[j].priority; saveData(); renderBoard(); return; } } }
      }
    }
  }

  var _detRef = null;
  window.openTaskDetail = function(task) {
    _detRef = {projectId: task.projectId, stage: task.stage, taskId: task.id};
    document.getElementById('tkDetBar').style.background = task.catColor;
    document.getElementById('tkDetProj').style.color = task.catColor;
    document.getElementById('tkDetProj').textContent = task.projectName;
    document.getElementById('tkDetStage').textContent = task.stage;
    document.getElementById('tkDetText').value = task.text;
    document.getElementById('tkDetResp').value = task.resp || '';
    document.getElementById('tkDetDeadline').value = task.deadline || '';
    var st = task.colStatus || (task.done ? 'done' : (task.deadline ? 'inprogress' : 'notstarted'));
    document.getElementById('tkDetStatus').value = st;
    document.getElementById('tkDetNotes').value = task.notes || '';
    document.getElementById('tkDetOverlay').classList.add('open');
    setTimeout(function(){ document.getElementById('tkDetText').focus(); document.getElementById('tkDetText').select(); }, 120);
  };
  window.closeTaskDetail = function() {
    document.getElementById('tkDetOverlay').classList.remove('open');
    _detRef = null;
  };
  window.saveTaskDetail = function() {
    if (!_detRef) return;
    for (var i=0;i<projects.length;i++){
      if (projects[i].id===_detRef.projectId){
        var tasks = projects[i].stageTasks && projects[i].stageTasks[_detRef.stage];
        if (tasks){ for (var j=0;j<tasks.length;j++){ if (tasks[j].id===_detRef.taskId){
          var newText = document.getElementById('tkDetText').value.trim();
          if (newText) tasks[j].text = newText;
          tasks[j].resp = document.getElementById('tkDetResp').value;
          tasks[j].deadline = document.getElementById('tkDetDeadline').value;
          var newSt = document.getElementById('tkDetStatus').value;
          tasks[j].colStatus = newSt;
          tasks[j].done = (newSt === 'done');
          tasks[j].notes = document.getElementById('tkDetNotes').value.trim();
          saveData(); closeTaskDetail(); renderBoard(); return;
        } } }
      }
    }
  };
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeTaskDetail(); });

  // ── POINTER DRAG (threshold 6px para no bloquear clicks) ──
  var _drag = null;
  var DRAG_THRESHOLD = 6;

  function startCardDrag(e, task, card) {
    if (e.button !== 0) return;
    // NO preventDefault aquí — permite que los clicks funcionen normalmente
    _drag = {
      task: task, card: card, ghost: null,
      startX: e.clientX, startY: e.clientY,
      ox: 0, oy: 0, lastCol: null,
      started: false, moved: false
    };
    document.addEventListener('pointermove', _onDragMove, {passive: false});
    document.addEventListener('pointerup',   _onDragEnd);
    document.addEventListener('pointercancel', _onDragEnd);
  }

  function _onDragMove(e) {
    if (!_drag) return;
    var dx = e.clientX - _drag.startX;
    var dy = e.clientY - _drag.startY;

    if (!_drag.started) {
      if (Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return;
      // Umbral superado — iniciar arrastre visual
      e.preventDefault();
      _drag.started = true;
      var rect = _drag.card.getBoundingClientRect();
      var ghost = _drag.card.cloneNode(true);
      ghost.className = ghost.className.replace('tk-dragging','') + ' tk-ghost';
      ghost.style.width = rect.width + 'px';
      ghost.style.left  = rect.left  + 'px';
      ghost.style.top   = rect.top   + 'px';
      document.body.appendChild(ghost);
      _drag.card.classList.add('tk-dragging');
      _drag.ghost = ghost;
      _drag.ox = e.clientX - rect.left;
      _drag.oy = e.clientY - rect.top;
      if (!dragPlaceholder) {
        dragPlaceholder = document.createElement('div');
        dragPlaceholder.className = 'tk-placeholder';
      }
    }

    e.preventDefault();
    _drag.moved = true;
    _drag.ghost.style.left = (e.clientX - _drag.ox) + 'px';
    _drag.ghost.style.top  = (e.clientY - _drag.oy) + 'px';

    var el = document.elementFromPoint(e.clientX, e.clientY);
    var colBody = el ? el.closest('[data-coltype]') : null;
    if (!colBody) {
      if (dragPlaceholder.parentNode) dragPlaceholder.parentNode.removeChild(dragPlaceholder);
      if (_drag.lastCol) { _drag.lastCol.classList.remove('tk-drag-active'); _drag.lastCol = null; }
      return;
    }
    if (_drag.lastCol && _drag.lastCol !== colBody) _drag.lastCol.classList.remove('tk-drag-active');
    colBody.classList.add('tk-drag-active');
    _drag.lastCol = colBody;
    var afterEl = _getAfterEl(colBody, e.clientY);
    if (!afterEl) colBody.appendChild(dragPlaceholder);
    else colBody.insertBefore(dragPlaceholder, afterEl);
  }

  function _onDragEnd(e) {
    if (!_drag) return;
    document.removeEventListener('pointermove', _onDragMove);
    document.removeEventListener('pointerup',   _onDragEnd);
    document.removeEventListener('pointercancel', _onDragEnd);

    if (!_drag.started) { _drag = null; return; } // fue un click, no arrastre

    if (_drag.ghost && _drag.ghost.parentNode) _drag.ghost.parentNode.removeChild(_drag.ghost);
    _drag.card.classList.remove('tk-dragging');
    document.querySelectorAll('.tk-col-body').forEach(function(b){ b.classList.remove('tk-drag-active'); });

    if (dragPlaceholder && dragPlaceholder.parentNode) {
      var colBody = dragPlaceholder.parentNode;
      var colType = colBody.dataset.coltype;
      var newSortOrder = _calcSortOrder(colBody, dragPlaceholder);
      dragPlaceholder.parentNode.removeChild(dragPlaceholder);
      if (colType && _drag.moved) {
        _commitDrop(_drag.task.projectId, _drag.task.stage, _drag.task.id, colType, newSortOrder);
        _drag = null;
        return;
      }
    }
    _drag = null;
    renderBoard();
  }

  function _calcSortOrder(colBody, placeholder) {
    var children = Array.from(colBody.children);
    var phIdx = children.indexOf(placeholder);
    var before = null, after = null;
    for (var i = phIdx - 1; i >= 0; i--) {
      if (children[i].classList && children[i].classList.contains('tk-card') && children[i].dataset.sortorder) {
        before = parseFloat(children[i].dataset.sortorder); break;
      }
    }
    for (var i = phIdx + 1; i < children.length; i++) {
      if (children[i].classList && children[i].classList.contains('tk-card') && children[i].dataset.sortorder) {
        after = parseFloat(children[i].dataset.sortorder); break;
      }
    }
    if (before === null && after === null) return Date.now();
    if (before === null) return after - 100000;
    if (after === null) return before + 100000;
    return (before + after) / 2;
  }

  function _getAfterEl(container, y) {
    var els = Array.from(container.querySelectorAll('.tk-card'));
    return els.reduce(function(closest, child) {
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) { return {offset: offset, element: child}; }
      return closest;
    }, {offset: Number.NEGATIVE_INFINITY}).element;
  }

  function _commitDrop(projectId, stage, taskId, newColType, newSortOrder) {
    for (var i=0;i<projects.length;i++){
      if (projects[i].id===projectId){
        var tasks = projects[i].stageTasks && projects[i].stageTasks[stage];
        if (tasks){
          for (var j=0;j<tasks.length;j++){
            if (tasks[j].id===taskId){
              tasks[j].colStatus = newColType;
              tasks[j].done = (newColType === 'done');
              tasks[j].sortOrder = newSortOrder;
              saveData();
              renderBoard();
              return;
            }
          }
        }
      }
    }
  }

  // Person filter
  var personBtns = {'':document.getElementById('ppAll'),'AR':document.getElementById('ppAR'),'LM':document.getElementById('ppLM'),'SV':document.getElementById('ppSV'),'RG':document.getElementById('ppRG')};
  Object.keys(personBtns).forEach(function(id){
    personBtns[id].onclick = function(){
      filterPerson = id;
      Object.keys(personBtns).forEach(function(k){ personBtns[k].classList.remove('active'); });
      personBtns[id].classList.add('active');
      renderBoard();
    };
  });

  // ── NEW TASK MODAL ──────────────────────────────────────
  window.openNewTaskModal = function() {
    var sel = document.getElementById('ntProject');
    sel.innerHTML = '';
    var nonCot = projects.filter(function(p){ return p.catId !== 'cotizaciones'; });
    if (!nonCot.length) {
      var opt = document.createElement('option');
      opt.value = ''; opt.textContent = 'Sin proyectos disponibles';
      sel.appendChild(opt);
    } else {
      nonCot.forEach(function(p) {
        var opt = document.createElement('option');
        opt.value = p.id; opt.textContent = p.name;
        sel.appendChild(opt);
      });
    }
    ntUpdateStages();
    document.getElementById('ntText').value = '';
    document.getElementById('ntResp').value = '';
    document.getElementById('ntDeadline').value = '';
    document.getElementById('newTaskOverlay').classList.add('open');
    setTimeout(function(){ document.getElementById('ntText').focus(); }, 120);
  };

  window.closeNewTaskModal = function() {
    document.getElementById('newTaskOverlay').classList.remove('open');
  };

  window.ntUpdateStages = function() {
    var pid = parseInt(document.getElementById('ntProject').value, 10);
    var proj = null;
    for (var i=0;i<projects.length;i++){if(projects[i].id===pid){proj=projects[i];break;}}
    var stageSel = document.getElementById('ntStage');
    stageSel.innerHTML = '';
    if (!proj) return;
    var cat = getCat(proj.catId);
    var stages = cat ? cat.stages : [proj.stage];
    stages.forEach(function(s) {
      var opt = document.createElement('option');
      opt.value = s; opt.textContent = s;
      if (s === proj.stage) opt.selected = true;
      stageSel.appendChild(opt);
    });
  };

  window.saveNewTask = function() {
    var text = document.getElementById('ntText').value.trim();
    if (!text) { document.getElementById('ntText').focus(); return; }
    var pid = parseInt(document.getElementById('ntProject').value, 10);
    var stage = document.getElementById('ntStage').value;
    var resp = document.getElementById('ntResp').value;
    var dl = document.getElementById('ntDeadline').value;
    var proj = null;
    for (var i=0;i<projects.length;i++){if(projects[i].id===pid){proj=projects[i];break;}}
    if (!proj) return;
    if (!proj.stageTasks) proj.stageTasks = {};
    if (!proj.stageTasks[stage]) proj.stageTasks[stage] = [];
    proj.stageTasks[stage].push({id: Date.now(), text: text, done: false, deadline: dl, resp: resp});
    saveData();
    closeNewTaskModal();
    renderBoard();
  };

  // Init — onSnapshot para sincronización en tiempo real con proyectos.html
  DOC.onSnapshot(function(snap){
    if (_ignoreSnap) { _ignoreSnap = false; return; }
    if (snap.exists){
      var d = snap.data();
      if (d.projects && d.projects.length) projects = d.projects;
      if (d.categories && d.categories.length) categories = d.categories;
      if (d.nextId) nextId = d.nextId;
      if (d.catIdCounter) catIdCounter = d.catIdCounter;
    }
    renderBoard();
  }, function(e){ console.warn('Error:', e); renderBoard(); });

})();
</script>
