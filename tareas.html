<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tareas — Dcoder Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#0c0c0c;color:#fff;font-family:'Inter',sans-serif;overflow:hidden;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:52px;border-bottom:0.5px solid rgba(255,255,255,0.06);flex-shrink:0;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-pill{background:#fff;color:#0c0c0c;font-size:11px;font-weight:800;padding:5px 10px;border-radius:8px;}
.logo-name{font-size:14px;font-weight:700;letter-spacing:.04em;}
.nav-btn{background:none;border:none;color:rgba(255,255,255,0.28);font-size:12px;font-weight:500;padding:6px 16px;border-radius:20px;cursor:pointer;font-family:'Inter',sans-serif;}
.nav-btn.active{background:rgba(255,255,255,0.1);color:#fff;}
.subbar{display:flex;align-items:center;gap:6px;padding:0 28px;height:48px;border-bottom:0.5px solid rgba(255,255,255,0.06);flex-shrink:0;}
.subbar-sep{width:0.5px;height:20px;background:rgba(255,255,255,0.08);margin:0 2px;flex-shrink:0;}
.person-pill{display:flex;align-items:center;gap:5px;padding:4px 10px 4px 6px;border-radius:20px;border:0.5px solid rgba(255,255,255,0.08);background:transparent;color:rgba(255,255,255,0.38);font-size:11px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;white-space:nowrap;}
.person-pill:hover{background:rgba(255,255,255,0.06);color:#fff;border-color:rgba(255,255,255,0.18);}
.person-pill.active{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.28);color:#fff;}
.person-pill-av{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;flex-shrink:0;}
.count-pill{font-size:11px;color:rgba(255,255,255,0.22);background:rgba(255,255,255,0.05);padding:4px 10px;border-radius:20px;white-space:nowrap;margin-left:auto;flex-shrink:0;}
/* KANBAN */
.board-wrap{display:flex;gap:12px;padding:20px 28px 24px;height:calc(100vh - 52px - 48px);overflow-x:auto;}
.board-wrap::-webkit-scrollbar{height:4px;}
.board-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}
.tk-col{flex:1;min-width:270px;max-width:400px;display:flex;flex-direction:column;gap:0;}
.tk-col-hdr{display:flex;align-items:center;gap:8px;padding:0 4px 12px;flex-shrink:0;}
.tk-col-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.tk-col-title{font-size:12px;font-weight:700;letter-spacing:.03em;}
.tk-col-count{font-size:10px;font-weight:700;background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.35);padding:2px 8px;border-radius:10px;}
.tk-col-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding:2px 2px 4px;}
.tk-col-body::-webkit-scrollbar{width:3px;}
.tk-col-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px;}
/* SUB HEADERS within In Progress */
.tk-sub-hdr{display:flex;align-items:center;gap:8px;padding:2px 2px 6px;flex-shrink:0;}
.tk-sub-hdr.urgent .tk-sub-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#E24B4A;}
.tk-sub-hdr.urgent .tk-sub-line{flex:1;height:0.5px;background:rgba(226,75,74,0.25);}
.tk-sub-hdr.urgent .tk-sub-dot{width:6px;height:6px;border-radius:50%;background:#E24B4A;flex-shrink:0;}
.tk-sub-hdr.normal{margin-top:6px;}
.tk-sub-hdr.normal .tk-sub-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,0.22);}
.tk-sub-hdr.normal .tk-sub-line{flex:1;height:0.5px;background:rgba(255,255,255,0.05);}
/* TASK CARD */
.tk-card{background:#181818;border:0.5px solid rgba(255,255,255,0.07);border-radius:12px;padding:11px 12px 11px 15px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s,border-color .15s;cursor:default;}
.tk-card:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.4);border-color:rgba(255,255,255,0.12);}
.tk-card.urgent-card{border-color:rgba(226,75,74,0.2);background:#1a1515;}
.tk-card.done-card{opacity:.4;}
.tk-card-bar{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;}
.tk-card-proj{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;}
.tk-card-text{font-size:12px;font-weight:600;color:rgba(255,255,255,0.88);line-height:1.4;margin-bottom:5px;}
.tk-card.done-card .tk-card-text{text-decoration:line-through;color:rgba(255,255,255,0.4);}
.tk-card-stage{font-size:9px;color:rgba(255,255,255,0.22);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tk-card-footer{display:flex;align-items:center;justify-content:space-between;}
.tk-card-av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;}
.tk-card-dl{font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px;white-space:nowrap;}
.tk-card-dl.overdue{background:rgba(226,75,74,0.15);color:#E24B4A;}
.tk-card-dl.today{background:rgba(232,160,32,0.15);color:#E8A020;}
.tk-card-dl.soon{background:rgba(232,160,32,0.1);color:#E8A020;}
.tk-card-dl.ok{background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.35);}
.tk-check-sm{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s;}
.tk-check-sm:hover{border-color:rgba(255,255,255,0.4);}
.tk-check-sm.on{background:#27AE72;border-color:#27AE72;}
.tk-check-sm svg{opacity:0;}
.tk-check-sm.on svg{opacity:1;}
.tk-empty{padding:32px 12px;text-align:center;color:rgba(255,255,255,0.15);font-size:11px;border:1px dashed rgba(255,255,255,0.07);border-radius:12px;}
.done-toggle{background:none;border:0.5px solid rgba(255,255,255,0.08);border-radius:10px;color:rgba(255,255,255,0.25);font-size:11px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;padding:8px 14px;transition:all .15s;text-align:left;width:100%;}
.done-toggle:hover{border-color:rgba(255,255,255,0.18);color:rgba(255,255,255,0.5);}
/* NEW TASK BUTTON */
.new-task-btn{background:#fff;color:#0c0c0c;border:none;font-size:11px;font-weight:700;padding:6px 14px;border-radius:20px;cursor:pointer;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:5px;margin-left:auto;flex-shrink:0;}
.new-task-btn:hover{background:#e0e0e0;}
/* MODAL */
.t-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);z-index:500;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.t-overlay.open{opacity:1;pointer-events:all;}
.t-modal{background:#161616;border:0.5px solid rgba(255,255,255,0.1);border-radius:20px;padding:26px;width:420px;max-width:92vw;display:flex;flex-direction:column;gap:14px;transform:translateY(8px);transition:transform .2s;}
.t-overlay.open .t-modal{transform:none;}
.t-modal-title{font-size:15px;font-weight:700;}
.t-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,0.3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px;}
.t-inp{background:#1e1e1e;border:0.5px solid rgba(255,255,255,0.1);border-radius:10px;padding:9px 13px;font-size:13px;color:#fff;font-family:'Inter',sans-serif;outline:none;width:100%;transition:border-color .15s;}
.t-inp:focus{border-color:rgba(255,255,255,0.3);}
.t-inp::placeholder{color:rgba(255,255,255,0.18);}
.t-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.t-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}
.t-btn-c{background:rgba(255,255,255,0.07);border:none;color:rgba(255,255,255,0.45);font-size:12px;font-weight:600;padding:8px 16px;border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;}
.t-btn-ok{background:#fff;border:none;color:#0c0c0c;font-size:12px;font-weight:700;padding:8px 16px;border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><div class="logo-pill">D/</div><span class="logo-name">Dcoder Studio</span></div>
  <div style="display:flex;gap:2px;">
    <button class="nav-btn" onclick="location.href='index.html'">Inicio</button>
    <button class="nav-btn" onclick="location.href='proyectos.html'">Proyectos</button>
    <button class="nav-btn active">Tareas</button>
    <button class="nav-btn">Equipo</button>
    <button class="nav-btn">Finanzas</button>
    <button class="nav-btn">Clientes</button>
    <button class="nav-btn" onclick="location.href='cotizacion.html'">Cotizaciones</button>
  </div>
  <div style="width:120px;"></div>
</div>

<div style="display:flex;flex-direction:column;height:calc(100vh - 52px);">
  <div class="subbar">
    <button class="person-pill active" id="ppAll"><span style="font-size:11px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;">👥</span>Todos</button>
    <button class="person-pill" id="ppAR"><span class="person-pill-av" style="background:#1A6FD4;">AR</span>Ana R.</button>
    <button class="person-pill" id="ppLM"><span class="person-pill-av" style="background:#7B6FD0;">LM</span>Luis M.</button>
    <button class="person-pill" id="ppSV"><span class="person-pill-av" style="background:#D4537E;">SV</span>Sofía V.</button>
    <button class="person-pill" id="ppRG"><span class="person-pill-av" style="background:#E8A020;">RG</span>Rodrigo G.</button>
    <span class="count-pill" id="countPill">— tareas</span>
    <button class="new-task-btn" onclick="openNewTaskModal()">+ Nueva tarea</button>
  </div>

  <!-- New task modal -->
  <div class="t-overlay" id="newTaskOverlay" onclick="if(event.target===this)closeNewTaskModal()">
    <div class="t-modal">
      <div class="t-modal-title">Nueva tarea</div>
      <div>
        <div class="t-lbl">Proyecto</div>
        <select class="t-inp" id="ntProject" onchange="ntUpdateStages()"></select>
      </div>
      <div>
        <div class="t-lbl">Fase</div>
        <select class="t-inp" id="ntStage"></select>
      </div>
      <div>
        <div class="t-lbl">Tarea</div>
        <input class="t-inp" id="ntText" type="text" placeholder="Descripción de la tarea…">
      </div>
      <div class="t-grid2">
        <div>
          <div class="t-lbl">Responsable</div>
          <select class="t-inp" id="ntResp">
            <option value="">Sin asignar</option>
            <option value="AR">Ana Ramírez</option>
            <option value="LM">Luis Mora</option>
            <option value="SV">Sofía Vega</option>
            <option value="RG">Rodrigo Gil</option>
          </select>
        </div>
        <div>
          <div class="t-lbl">Fecha límite</div>
          <input class="t-inp" id="ntDeadline" type="date">
        </div>
      </div>
      <div class="t-foot">
        <button class="t-btn-c" onclick="closeNewTaskModal()">Cancelar</button>
        <button class="t-btn-ok" onclick="saveNewTask()">Agregar tarea</button>
      </div>
    </div>
  </div>

  <div class="board-wrap" id="boardWrap">
    <!-- rendered by JS -->
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(function() {
  firebase.initializeApp({
    apiKey: "AIzaSyC3LG6e_7YAbYQhdPe6IC_Mq3SFop0XPsk",
    authDomain: "trazzo-c9eaf.firebaseapp.com",
    projectId: "trazzo-c9eaf",
    storageBucket: "trazzo-c9eaf.firebasestorage.app",
    messagingSenderId: "106264633340",
    appId: "1:106264633340:web:4b2560a57e75321c709c79"
  });
  var db = firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(function(){});
  var DOC = db.collection('workspace').doc('proyectos');

  var projects = [], categories = [];
  var nextId = 14, catIdCounter = 20;
  var AV_COLORS = {AR:'#1A6FD4',LM:'#7B6FD0',SV:'#D4537E',RG:'#E8A020'};
  var AV_NAMES  = {AR:'Ana Ramírez',LM:'Luis Mora',SV:'Sofía Vega',RG:'Rodrigo Gil'};
  var MNS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var filterPerson = '';
  var showDone = false;

  function saveData() {
    DOC.set({projects:projects, categories:categories, nextId:nextId, catIdCounter:catIdCounter})
      .catch(function(e){ console.warn('Error al guardar:', e); });
  }

  function getCat(catId) {
    for (var i=0;i<categories.length;i++){if(categories[i].id===catId)return categories[i];}
    return null;
  }

  function getAllTasks() {
    var result = [];
    projects.forEach(function(proj) {
      if (!proj.stageTasks) return;
      var cat = getCat(proj.catId);
      Object.keys(proj.stageTasks).forEach(function(stage) {
        var tasks = proj.stageTasks[stage];
        if (!tasks || !tasks.length) return;
        tasks.forEach(function(task) {
          result.push({
            id: task.id,
            text: task.text,
            done: !!task.done,
            deadline: task.deadline || '',
            resp: task.resp || '',
            projectId: proj.id,
            projectName: proj.name,
            stage: stage,
            catColor: cat ? cat.color : 'rgba(255,255,255,0.2)',
            isCurrentStage: proj.stage === stage
          });
        });
      });
    });
    return result;
  }

  function getDlClass(deadline) {
    if (!deadline) return '';
    var today = new Date(); today.setHours(0,0,0,0);
    var diff = Math.ceil((new Date(deadline+'T00:00:00') - today) / 86400000);
    if (diff < 0) return 'overdue';
    if (diff === 0) return 'today';
    if (diff <= 3) return 'soon';
    return 'ok';
  }

  function isUrgent(deadline) {
    if (!deadline) return false;
    var today = new Date(); today.setHours(0,0,0,0);
    var diff = Math.ceil((new Date(deadline+'T00:00:00') - today) / 86400000);
    return diff <= 3;
  }

  function fmtDate(dl) {
    var d = new Date(dl+'T00:00:00');
    return d.getDate()+' '+MNS[d.getMonth()];
  }

  function buildCard(task) {
    var card = document.createElement('div');
    var urgent = !task.done && task.deadline && isUrgent(task.deadline);
    card.className = 'tk-card' + (urgent ? ' urgent-card' : '') + (task.done ? ' done-card' : '');

    var bar = document.createElement('div');
    bar.className = 'tk-card-bar';
    bar.style.background = task.catColor;
    card.appendChild(bar);

    var proj = document.createElement('div');
    proj.className = 'tk-card-proj';
    proj.style.color = task.catColor;
    proj.textContent = task.projectName;
    card.appendChild(proj);

    var txt = document.createElement('div');
    txt.className = 'tk-card-text';
    txt.textContent = task.text;
    card.appendChild(txt);

    var stage = document.createElement('div');
    stage.className = 'tk-card-stage';
    stage.textContent = task.stage;
    card.appendChild(stage);

    var footer = document.createElement('div');
    footer.className = 'tk-card-footer';

    var leftFt = document.createElement('div');
    leftFt.style.cssText = 'display:flex;align-items:center;gap:6px;';

    var chk = document.createElement('div');
    chk.className = 'tk-check-sm' + (task.done ? ' on' : '');
    chk.innerHTML = '<svg viewBox="0 0 12 12" width="8" height="8"><polyline points="2,6 5,9 10,3" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    chk.title = task.done ? 'Marcar pendiente' : 'Marcar completada';
    chk.onclick = (function(pid,st,tid){ return function(e){ e.stopPropagation(); toggleTask(pid,st,tid); }; })(task.projectId, task.stage, task.id);
    leftFt.appendChild(chk);

    if (task.resp && AV_COLORS[task.resp]) {
      var av = document.createElement('div');
      av.className = 'tk-card-av';
      av.style.background = AV_COLORS[task.resp];
      av.title = AV_NAMES[task.resp] || task.resp;
      av.textContent = task.resp;
      leftFt.appendChild(av);
    }
    footer.appendChild(leftFt);

    if (task.deadline) {
      var dlCls = getDlClass(task.deadline);
      var dl = document.createElement('span');
      dl.className = 'tk-card-dl ' + dlCls;
      dl.textContent = fmtDate(task.deadline);
      footer.appendChild(dl);
    }
    card.appendChild(footer);
    return card;
  }

  function mkSubHdr(type, label) {
    var h = document.createElement('div');
    h.className = 'tk-sub-hdr ' + type;
    if (type === 'urgent') {
      var dot = document.createElement('div'); dot.className = 'tk-sub-dot';
      var lbl = document.createElement('span'); lbl.className = 'tk-sub-lbl'; lbl.textContent = label;
      var line = document.createElement('div'); line.className = 'tk-sub-line';
      h.appendChild(dot); h.appendChild(lbl); h.appendChild(line);
    } else {
      var lbl2 = document.createElement('span'); lbl2.className = 'tk-sub-lbl'; lbl2.textContent = label;
      var line2 = document.createElement('div'); line2.className = 'tk-sub-line';
      h.appendChild(lbl2); h.appendChild(line2);
    }
    return h;
  }

  function buildCol(title, dotColor, titleColor, tasks, colType) {
    var col = document.createElement('div');
    col.className = 'tk-col';

    var hdr = document.createElement('div');
    hdr.className = 'tk-col-hdr';
    var dot = document.createElement('div'); dot.className = 'tk-col-dot'; dot.style.background = dotColor;
    var ttl = document.createElement('span'); ttl.className = 'tk-col-title'; ttl.style.color = titleColor; ttl.textContent = title;
    var cnt = document.createElement('span'); cnt.className = 'tk-col-count'; cnt.textContent = tasks.length;
    hdr.appendChild(dot); hdr.appendChild(ttl); hdr.appendChild(cnt);
    col.appendChild(hdr);

    var body = document.createElement('div');
    body.className = 'tk-col-body';

    if (!tasks.length) {
      var empty = document.createElement('div');
      empty.className = 'tk-empty';
      empty.textContent = colType === 'done' ? 'Sin tareas completadas' : 'Sin tareas aquí';
      body.appendChild(empty);
    } else if (colType === 'inprogress') {
      // Split into urgent + normal
      var urgent = tasks.filter(function(t){ return isUrgent(t.deadline); });
      var normal  = tasks.filter(function(t){ return !isUrgent(t.deadline); });
      if (urgent.length) {
        body.appendChild(mkSubHdr('urgent', '⚡ Urgentes'));
        urgent.forEach(function(t){ body.appendChild(buildCard(t)); });
      }
      if (normal.length) {
        if (urgent.length) body.appendChild(mkSubHdr('normal', 'En proceso'));
        normal.forEach(function(t){ body.appendChild(buildCard(t)); });
      }
    } else if (colType === 'done') {
      var visible = showDone ? tasks : tasks.slice(0, 5);
      visible.forEach(function(t){ body.appendChild(buildCard(t)); });
      if (!showDone && tasks.length > 5) {
        var btn = document.createElement('button');
        btn.className = 'done-toggle';
        btn.textContent = '▼ Ver ' + (tasks.length - 5) + ' más';
        btn.onclick = function() { showDone = true; renderBoard(); };
        body.appendChild(btn);
      }
    } else {
      tasks.forEach(function(t){ body.appendChild(buildCard(t)); });
    }

    col.appendChild(body);
    return col;
  }

  function renderBoard() {
    var all = getAllTasks();
    var filtered = filterPerson ? all.filter(function(t){ return t.resp === filterPerson; }) : all;

    // Columns:
    // Not Started: no deadline, not done
    // In Progress: has deadline, not done
    // Done: done
    var notStarted = filtered.filter(function(t){ return !t.done && !t.deadline; });
    var inProgress = filtered.filter(function(t){ return !t.done && !!t.deadline; });
    var done = filtered.filter(function(t){ return t.done; });

    // Sort in-progress by deadline ascending
    inProgress.sort(function(a,b){ return a.deadline < b.deadline ? -1 : 1; });
    // Sort not-started: current stage first
    notStarted.sort(function(a,b){ return (b.isCurrentStage?1:0) - (a.isCurrentStage?1:0); });

    var board = document.getElementById('boardWrap');
    board.innerHTML = '';
    board.appendChild(buildCol('Sin iniciar', 'rgba(255,255,255,0.3)', 'rgba(255,255,255,0.55)', notStarted, 'notstarted'));
    board.appendChild(buildCol('En proceso', '#1A6FD4', '#5B9FFF', inProgress, 'inprogress'));
    board.appendChild(buildCol('Terminadas', '#27AE72', '#27AE72', done, 'done'));

    var pending = notStarted.length + inProgress.length;
    document.getElementById('countPill').textContent = pending + ' pendiente' + (pending !== 1 ? 's' : '') + ' · ' + done.length + ' listas';
  }

  function toggleTask(projectId, stage, taskId) {
    for (var i=0;i<projects.length;i++){
      if (projects[i].id===projectId){
        var tasks = projects[i].stageTasks && projects[i].stageTasks[stage];
        if (tasks){
          for (var j=0;j<tasks.length;j++){
            if (tasks[j].id===taskId){
              tasks[j].done = !tasks[j].done;
              saveData();
              renderBoard();
              return;
            }
          }
        }
      }
    }
  }

  // Person filter
  var personBtns = {'':document.getElementById('ppAll'),'AR':document.getElementById('ppAR'),'LM':document.getElementById('ppLM'),'SV':document.getElementById('ppSV'),'RG':document.getElementById('ppRG')};
  Object.keys(personBtns).forEach(function(id){
    personBtns[id].onclick = function(){
      filterPerson = id;
      Object.keys(personBtns).forEach(function(k){ personBtns[k].classList.remove('active'); });
      personBtns[id].classList.add('active');
      renderBoard();
    };
  });

  // ── NEW TASK MODAL ──────────────────────────────────────
  window.openNewTaskModal = function() {
    var sel = document.getElementById('ntProject');
    sel.innerHTML = '';
    var nonCot = projects.filter(function(p){ return p.catId !== 'cotizaciones'; });
    if (!nonCot.length) {
      var opt = document.createElement('option');
      opt.value = ''; opt.textContent = 'Sin proyectos disponibles';
      sel.appendChild(opt);
    } else {
      nonCot.forEach(function(p) {
        var opt = document.createElement('option');
        opt.value = p.id; opt.textContent = p.name;
        sel.appendChild(opt);
      });
    }
    ntUpdateStages();
    document.getElementById('ntText').value = '';
    document.getElementById('ntResp').value = '';
    document.getElementById('ntDeadline').value = '';
    document.getElementById('newTaskOverlay').classList.add('open');
    setTimeout(function(){ document.getElementById('ntText').focus(); }, 120);
  };

  window.closeNewTaskModal = function() {
    document.getElementById('newTaskOverlay').classList.remove('open');
  };

  window.ntUpdateStages = function() {
    var pid = parseInt(document.getElementById('ntProject').value, 10);
    var proj = null;
    for (var i=0;i<projects.length;i++){if(projects[i].id===pid){proj=projects[i];break;}}
    var stageSel = document.getElementById('ntStage');
    stageSel.innerHTML = '';
    if (!proj) return;
    var cat = getCat(proj.catId);
    var stages = cat ? cat.stages : [proj.stage];
    stages.forEach(function(s) {
      var opt = document.createElement('option');
      opt.value = s; opt.textContent = s;
      if (s === proj.stage) opt.selected = true;
      stageSel.appendChild(opt);
    });
  };

  window.saveNewTask = function() {
    var text = document.getElementById('ntText').value.trim();
    if (!text) { document.getElementById('ntText').focus(); return; }
    var pid = parseInt(document.getElementById('ntProject').value, 10);
    var stage = document.getElementById('ntStage').value;
    var resp = document.getElementById('ntResp').value;
    var dl = document.getElementById('ntDeadline').value;
    var proj = null;
    for (var i=0;i<projects.length;i++){if(projects[i].id===pid){proj=projects[i];break;}}
    if (!proj) return;
    if (!proj.stageTasks) proj.stageTasks = {};
    if (!proj.stageTasks[stage]) proj.stageTasks[stage] = [];
    proj.stageTasks[stage].push({id: Date.now(), text: text, done: false, deadline: dl, resp: resp});
    saveData();
    closeNewTaskModal();
    renderBoard();
  };

  // Init
  DOC.get().then(function(snap){
    if (snap.exists){
      var d = snap.data();
      if (d.projects && d.projects.length) projects = d.projects;
      if (d.categories && d.categories.length) categories = d.categories;
      if (d.nextId) nextId = d.nextId;
      if (d.catIdCounter) catIdCounter = d.catIdCounter;
    }
    renderBoard();
  }).catch(function(e){ console.warn('Error:', e); renderBoard(); });

})();
</script>
</body>
</html>
