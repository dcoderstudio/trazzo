<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hora de trabajar — Dcoder Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#0c0c0c;color:#fff;font-family:'Inter',sans-serif;overflow:hidden;}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:52px;border-bottom:0.5px solid rgba(255,255,255,0.06);}
.logo{display:flex;align-items:center;gap:10px;}
.logo-pill{background:#fff;color:#0c0c0c;font-size:11px;font-weight:800;padding:5px 10px;border-radius:8px;}
.logo-name{font-size:14px;font-weight:700;letter-spacing:.04em;}
.nav-btn{background:none;border:none;color:rgba(255,255,255,0.28);font-size:12px;font-weight:500;padding:6px 16px;border-radius:20px;cursor:pointer;font-family:'Inter',sans-serif;transition:background .15s,color .15s;}
.nav-btn:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.7);}
.mode-pill{font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;background:rgba(232,160,32,0.15);color:#E8A020;border:0.5px solid rgba(232,160,32,0.3);white-space:nowrap;}

.layout{display:flex;height:calc(100vh - 52px);}

/* LEFT PANEL */
.task-panel{width:340px;flex-shrink:0;border-right:0.5px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;padding:24px 20px 16px;gap:14px;overflow:hidden;}
.panel-title{font-size:13px;font-weight:700;color:rgba(255,255,255,0.5);letter-spacing:.06em;text-transform:uppercase;flex-shrink:0;}

/* Person filter */
.focus-person-row{display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0;}
.focus-person-pill{display:flex;align-items:center;gap:5px;padding:4px 10px 4px 6px;border-radius:20px;border:0.5px solid rgba(255,255,255,0.08);background:transparent;color:rgba(255,255,255,0.38);font-size:11px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
.focus-person-pill:hover{background:rgba(255,255,255,0.06);color:#fff;border-color:rgba(255,255,255,0.18);}
.focus-person-pill.active{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.28);color:#fff;}
.focus-av{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;flex-shrink:0;}

.tasks-list{display:flex;flex-direction:column;gap:0;flex:1;overflow-y:auto;padding-right:2px;}
.tasks-list::-webkit-scrollbar{width:3px;}
.tasks-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}
.tasks-empty{font-size:13px;color:rgba(255,255,255,0.2);text-align:center;padding:28px 0;font-style:italic;}

.task-item{display:flex;align-items:center;gap:9px;padding:11px 12px 11px 14px;border-radius:12px;background:#161616;border:0.5px solid rgba(255,255,255,0.06);cursor:pointer;transition:background .15s,border-color .15s;position:relative;margin-bottom:6px;flex-shrink:0;overflow:hidden;}
.task-item:hover{background:#1c1c1c;border-color:rgba(255,255,255,0.12);}
.task-item.active-task{border-color:#E8A020;background:rgba(232,160,32,0.08);}
.task-bar{width:3px;height:100%;position:absolute;left:0;top:0;bottom:0;border-radius:4px 0 0 4px;}
.task-name{flex:1;font-size:13px;font-weight:500;color:rgba(255,255,255,0.82);line-height:1.35;padding-left:4px;}
.task-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.38);white-space:nowrap;flex-shrink:0;}
.task-badge.prio{background:rgba(232,160,32,0.15);color:#E8A020;}
.task-av{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;flex-shrink:0;}

.tasks-footer{border-top:0.5px solid rgba(255,255,255,0.06);padding-top:10px;flex-shrink:0;}
.task-counter{font-size:11px;color:rgba(255,255,255,0.25);}
/* DRAG */
.task-item{cursor:grab;}
.task-item.fdragging{opacity:0.1!important;cursor:grabbing;}
.focus-ghost{position:fixed;pointer-events:none;z-index:9000;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.8);transform:rotate(1.2deg) scale(1.03);opacity:0.93;background:#1e1e1e;border:0.5px solid rgba(255,255,255,0.15);}
.focus-placeholder{min-height:52px;border-radius:12px;border:1.5px dashed rgba(255,255,255,0.25);background:rgba(255,255,255,0.02);flex-shrink:0;margin-bottom:6px;}

/* RIGHT PANEL */
.focus-panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;gap:28px;position:relative;}
.focus-label{font-size:11px;font-weight:700;color:rgba(255,255,255,0.25);letter-spacing:.1em;text-transform:uppercase;text-align:center;}
.focus-task-name{font-size:22px;font-weight:700;color:#fff;text-align:center;max-width:400px;line-height:1.3;margin-top:6px;font-style:italic;}
.focus-task-name.placeholder{color:rgba(255,255,255,0.2);font-weight:400;font-size:15px;font-style:normal;}

.timer-wrap{position:relative;width:260px;height:260px;}
.timer-svg{width:260px;height:260px;transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:rgba(255,255,255,0.05);stroke-width:6;}
.ring-progress{fill:none;stroke:#E8A020;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .9s linear,stroke .4s;}
.timer-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.timer-display{font-size:52px;font-weight:800;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;line-height:1;}
.timer-status{font-size:11px;font-weight:600;color:rgba(255,255,255,0.3);margin-top:6px;letter-spacing:.08em;text-transform:uppercase;}

.timer-controls{display:flex;gap:12px;align-items:center;}
.ctrl-btn{width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .1s;}
.ctrl-btn:active{transform:scale(.94);}
.ctrl-btn svg{width:20px;height:20px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.btn-play{background:#E8A020;width:64px;height:64px;}
.btn-play svg{stroke:#0c0c0c;width:22px;height:22px;}
.btn-play:hover{background:#d4911c;}
.btn-sec{background:#1e1e1e;}
.btn-sec svg{stroke:rgba(255,255,255,0.5);}
.btn-sec:hover{background:#2a2a2a;}

.dur-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;}
.dur-label{font-size:11px;color:rgba(255,255,255,0.25);font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
.dur-chips{display:flex;gap:6px;align-items:center;}
.dur-chip{padding:7px 16px;border-radius:20px;border:0.5px solid rgba(255,255,255,0.1);background:transparent;color:rgba(255,255,255,0.4);font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
.dur-chip:hover,.dur-chip.active{background:rgba(255,255,255,0.1);color:#fff;border-color:rgba(255,255,255,0.3);}
.dur-custom{width:52px;background:#1a1a1a;border:0.5px solid rgba(255,255,255,0.1);border-radius:8px;padding:6px 8px;font-size:12px;color:#fff;font-family:'Inter',sans-serif;outline:none;text-align:center;}
.dur-custom-lbl{font-size:11px;color:rgba(255,255,255,0.3);}

.session-log{position:absolute;bottom:24px;right:28px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;}
.log-title{font-size:10px;color:rgba(255,255,255,0.2);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px;}
.log-item{font-size:11px;color:rgba(255,255,255,0.35);display:flex;align-items:center;gap:6px;}
.log-dot{width:5px;height:5px;border-radius:50%;background:#27AE72;flex-shrink:0;}
.total-focus{font-size:12px;font-weight:700;color:rgba(255,255,255,0.4);margin-top:4px;}

@keyframes pulse{0%,100%{opacity:.1}50%{opacity:.25}}
.focus-panel.running::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(232,160,32,0.1) 0%,transparent 70%);animation:pulse 3s ease-in-out infinite;pointer-events:none;}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><div class="logo-pill">D/</div><span class="logo-name">Dcoder Studio</span></div>
  <div style="display:flex;gap:2px;">
    <button class="nav-btn" onclick="location.href='index.html'">Inicio</button>
    <button class="nav-btn" onclick="location.href='proyectos.html'">Proyectos</button>
    <button class="nav-btn" onclick="location.href='tareas.html'">Tareas</button>
    <button class="nav-btn" onclick="location.href='calendario.html'">Calendario</button>
    <button class="nav-btn" onclick="location.href='daily-hub.html'">Daily Hub</button><button class="nav-btn">Equipo</button>
    <button class="nav-btn">Finanzas</button>
    <button class="nav-btn">Clientes</button>
    <button class="nav-btn" onclick="location.href='cotizacion.html'">Cotizaciones</button>
  </div>
  <span class="mode-pill">⚡ Hora de trabajar</span>
</div>

<div class="layout">

  <!-- LEFT PANEL -->
  <div class="task-panel">
    <div class="panel-title">Mis tareas</div>
    <div class="focus-person-row" id="focusPersonRow">
      <button class="focus-person-pill active">Todos</button>
    </div>
    <div class="tasks-list" id="tasksList">
      <div class="tasks-empty" id="emptyMsg">Cargando tareas…</div>
    </div>
    <div class="tasks-footer">
      <span class="task-counter" id="taskCounter">0 pendientes</span>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="focus-panel" id="focusPanel">
    <div style="text-align:center">
      <div class="focus-label">Trabajando en</div>
      <div class="focus-task-name placeholder" id="focusTaskName">Selecciona una tarea para empezar</div>
    </div>

    <div class="timer-wrap">
      <svg class="timer-svg" viewBox="0 0 260 260">
        <circle class="ring-bg" cx="130" cy="130" r="118"/>
        <circle class="ring-progress" id="ringProgress" cx="130" cy="130" r="118" stroke-dasharray="741.4" stroke-dashoffset="741.4"/>
      </svg>
      <div class="timer-center">
        <div class="timer-display" id="timerDisplay">25:00</div>
        <div class="timer-status" id="timerStatus">listo</div>
      </div>
    </div>

    <div class="timer-controls">
      <button class="ctrl-btn btn-sec" onclick="resetTimer()" title="Reiniciar">
        <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/></svg>
      </button>
      <button class="ctrl-btn btn-play" id="playBtn" onclick="toggleTimer()">
        <svg id="playIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="#0c0c0c" stroke="none"/></svg>
      </button>
      <button class="ctrl-btn btn-sec" onclick="skipTask()" title="Siguiente tarea">
        <svg viewBox="0 0 24 24"><polyline points="5 17 12 12 5 7"/><polyline points="13 17 20 12 13 7"/></svg>
      </button>
    </div>

    <div class="dur-wrap">
      <div class="dur-label">Duración del bloque</div>
      <div class="dur-chips">
        <button class="dur-chip" onclick="setDuration(15,this)">15m</button>
        <button class="dur-chip active" onclick="setDuration(25,this)">25m</button>
        <button class="dur-chip" onclick="setDuration(45,this)">45m</button>
        <button class="dur-chip" onclick="setDuration(60,this)">1h</button>
        <input class="dur-custom" type="number" min="1" max="180" placeholder="—" oninput="setDuration(+this.value,null)">
        <span class="dur-custom-lbl">min</span>
      </div>
    </div>

    <div class="session-log" id="sessionLog" style="display:none">
      <div class="log-title">Sesión de hoy</div>
      <div id="logItems"></div>
      <div class="total-focus" id="totalFocus"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(function() {

// ── FIREBASE ──────────────────────────────────────────────────────────────────
firebase.initializeApp({
  apiKey: "AIzaSyC3LG6e_7YAbYQhdPe6IC_Mq3SFop0XPsk",
  authDomain: "trazzo-c9eaf.firebaseapp.com",
  projectId: "trazzo-c9eaf",
  storageBucket: "trazzo-c9eaf.firebasestorage.app",
  messagingSenderId: "106264633340",
  appId: "1:106264633340:web:4b2560a57e75321c709c79"
});
var db = firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(function(){});
var DOC = db.collection('workspace').doc('proyectos');

// ── STATE ─────────────────────────────────────────────────────────────────────
var projects = [], categories = [], standaloneTasks = [], teamMembers = [], taskGroups = [];
var filterPerson = '';
var allFbTasks = [];
var displayTasks = []; // ordered view (drag reorders this)
var activeTask = null;
var sessionLog = [];
var SESS_KEY = 'trazzo_focus_session';
var _firstLoad = true;

// ── TIMER STATE ───────────────────────────────────────────────────────────────
var CIRC = 2 * Math.PI * 118;
var duration = 25 * 60;
var remaining = duration;
var running = false;
var interval = null;

// ── DRAG STATE ────────────────────────────────────────────────────────────────
var _fdrag = null;

// ── HELPERS ───────────────────────────────────────────────────────────────────
function getCat(catId) {
  for (var i=0;i<categories.length;i++){if(categories[i].id===catId)return categories[i];}
  return null;
}

function getAllTasks() {
  var result = [];
  projects.forEach(function(proj) {
    if (proj.catId === 'cotizaciones') return;
    if (!proj.stageTasks) return;
    var stage = proj.stage;
    var tasks = proj.stageTasks[stage];
    if (!tasks || !tasks.length) return;
    var cat = getCat(proj.catId);
    tasks.forEach(function(task) {
      if (task.done) return;
      result.push({
        id: task.id, text: task.text,
        deadline: task.deadline || '', resp: task.resp || '',
        priority: !!task.priority,
        projectId: proj.id, projectName: proj.name, stage: stage,
        catColor: cat ? cat.color : 'rgba(255,255,255,0.2)'
      });
    });
  });
  standaloneTasks.forEach(function(task) {
    if (task.done) return;
    var grp = null;
    if (task.groupId) {
      for (var gi=0;gi<taskGroups.length;gi++){if(taskGroups[gi].id===task.groupId){grp=taskGroups[gi];break;}}
    }
    result.push({
      id: task.id, text: task.text,
      deadline: task.deadline || '', resp: task.resp || '',
      priority: !!task.priority,
      projectId: 'standalone', projectName: grp ? grp.name : '', stage: '',
      catColor: grp ? grp.color : 'rgba(255,255,255,0.18)'
    });
  });
  return result;
}

function rebuildDisplayTasks() {
  var filtered = allFbTasks.filter(function(t) {
    return !filterPerson || t.resp === filterPerson;
  });
  // Preserve manual order if we already have one
  if (displayTasks.length > 0) {
    var orderMap = {};
    displayTasks.forEach(function(t, i){ orderMap[String(t.id)] = i; });
    filtered.sort(function(a, b) {
      var ai = orderMap[String(a.id)];
      var bi = orderMap[String(b.id)];
      if (ai === undefined) return 1;
      if (bi === undefined) return -1;
      return ai - bi;
    });
  }
  displayTasks = filtered;
}

// ── PERSON FILTER ─────────────────────────────────────────────────────────────
function renderPersonFilter() {
  var row = document.getElementById('focusPersonRow');
  if (!row) return;
  row.innerHTML = '';
  var all = document.createElement('button');
  all.className = 'focus-person-pill' + (filterPerson === '' ? ' active' : '');
  all.textContent = 'Todos';
  all.onclick = function() { filterPerson = ''; displayTasks = []; rebuildDisplayTasks(); renderPersonFilter(); renderTaskList(); };
  row.appendChild(all);
  teamMembers.forEach(function(m) {
    var np = m.name.trim().split(/\s+/);
    var abbr = np[0][0].toUpperCase() + (np.length > 1 ? np[1][0].toUpperCase() : '');
    var btn = document.createElement('button');
    btn.className = 'focus-person-pill' + (filterPerson === m.id ? ' active' : '');
    btn.innerHTML = '<span class="focus-av" style="background:' + m.color + '">' + abbr + '</span> ' + np[0];
    btn.onclick = (function(mid){ return function() { filterPerson = mid; displayTasks = []; rebuildDisplayTasks(); renderPersonFilter(); renderTaskList(); }; })(m.id);
    row.appendChild(btn);
  });
}

// ── TASK LIST ─────────────────────────────────────────────────────────────────
function buildTaskRow(t) {
  var isActive = activeTask && String(activeTask.id) === String(t.id);
  var row = document.createElement('div');
  row.className = 'task-item' + (isActive ? ' active-task' : '');
  row.dataset.taskid = String(t.id);

  var bar = document.createElement('div');
  bar.className = 'task-bar';
  bar.style.background = t.catColor;
  row.appendChild(bar);

  var nameEl = document.createElement('span');
  nameEl.className = 'task-name';
  nameEl.textContent = t.text;
  row.appendChild(nameEl);

  if (t.priority) {
    var pb = document.createElement('span');
    pb.className = 'task-badge prio';
    pb.textContent = '⚑';
    row.appendChild(pb);
  } else if (t.projectName) {
    var nb = document.createElement('span');
    nb.className = 'task-badge';
    nb.textContent = t.projectName;
    row.appendChild(nb);
  }

  if (t.resp) {
    var respM = null;
    for (var i=0;i<teamMembers.length;i++){if(teamMembers[i].id===t.resp){respM=teamMembers[i];break;}}
    if (respM) {
      var np2 = respM.name.trim().split(/\s+/);
      var abbr2 = np2[0][0].toUpperCase() + (np2.length > 1 ? np2[1][0].toUpperCase() : '');
      var av = document.createElement('span');
      av.className = 'task-av';
      av.style.background = respM.color;
      av.textContent = abbr2;
      row.appendChild(av);
    }
  }

  row.addEventListener('pointerdown', (function(task){ return function(e){ startFocusDrag(e, task); }; })(t));
  row.addEventListener('click', (function(task){ return function(){ if(_fdrag && _fdrag.started) return; selectTask(task); }; })(t));
  return row;
}

function renderTaskList() {
  var list = document.getElementById('tasksList');
  var empty = document.getElementById('emptyMsg');
  list.querySelectorAll('.task-item, .focus-placeholder').forEach(function(e){ e.remove(); });

  if (displayTasks.length === 0) {
    empty.style.display = 'block';
    empty.textContent = allFbTasks.length === 0 ? 'Sin tareas pendientes' : 'Ninguna tarea para este filtro';
    document.getElementById('taskCounter').textContent = '0 pendientes';
    return;
  }
  empty.style.display = 'none';

  displayTasks.forEach(function(t) {
    list.appendChild(buildTaskRow(t));
  });

  document.getElementById('taskCounter').textContent =
    displayTasks.length + ' pendiente' + (displayTasks.length !== 1 ? 's' : '');
}

// ── DRAG & DROP ───────────────────────────────────────────────────────────────
function startFocusDrag(e, task) {
  if (e.button && e.button !== 0) return;
  _fdrag = { task: task, startX: e.clientX, startY: e.clientY, started: false, ghost: null, placeholder: null };
  document.addEventListener('pointermove', _onFDragMove);
  document.addEventListener('pointerup',   _onFDragEnd);
  document.body.style.userSelect = 'none';
}

function _onFDragMove(e) {
  if (!_fdrag) return;
  var dx = e.clientX - _fdrag.startX, dy = e.clientY - _fdrag.startY;

  if (!_fdrag.started) {
    if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
    _fdrag.started = true;

    // Create ghost clone
    var srcEl = document.querySelector('.task-item[data-taskid="' + String(_fdrag.task.id) + '"]');
    if (srcEl) {
      var rect = srcEl.getBoundingClientRect();
      var ghost = srcEl.cloneNode(true);
      ghost.className = 'focus-ghost';
      ghost.style.width  = rect.width  + 'px';
      ghost.style.height = rect.height + 'px';
      ghost.style.left   = rect.left   + 'px';
      ghost.style.top    = rect.top    + 'px';
      document.body.appendChild(ghost);
      _fdrag.ghost = ghost;
      _fdrag.offsetX = e.clientX - rect.left;
      _fdrag.offsetY = e.clientY - rect.top;
      srcEl.classList.add('fdragging');
    }

    // Create placeholder
    var ph = document.createElement('div');
    ph.className = 'focus-placeholder';
    _fdrag.placeholder = ph;
  }

  // Move ghost
  if (_fdrag.ghost) {
    _fdrag.ghost.style.left = (e.clientX - _fdrag.offsetX) + 'px';
    _fdrag.ghost.style.top  = (e.clientY - _fdrag.offsetY) + 'px';
  }

  // Find insertion point
  var list = document.getElementById('tasksList');
  var items = list.querySelectorAll('.task-item:not(.fdragging)');
  var insertBefore = null;
  items.forEach(function(item) {
    var r = item.getBoundingClientRect();
    if (e.clientY < r.top + r.height / 2) {
      if (!insertBefore) insertBefore = item;
    }
  });

  if (insertBefore) {
    list.insertBefore(_fdrag.placeholder, insertBefore);
  } else {
    list.appendChild(_fdrag.placeholder);
  }
}

function _onFDragEnd(e) {
  document.removeEventListener('pointermove', _onFDragMove);
  document.removeEventListener('pointerup',   _onFDragEnd);
  document.body.style.userSelect = '';

  if (!_fdrag) return;
  var drag = _fdrag; _fdrag = null;

  if (!drag.started) return;

  // Remove ghost and placeholder, restore opacity
  if (drag.ghost) drag.ghost.remove();
  var srcEl = document.querySelector('.task-item[data-taskid="' + String(drag.task.id) + '"]');
  if (srcEl) srcEl.classList.remove('fdragging');

  // Compute new index from placeholder position
  if (drag.placeholder && drag.placeholder.parentNode) {
    var list = document.getElementById('tasksList');
    var children = Array.from(list.children);
    var phIdx = children.indexOf(drag.placeholder);
    drag.placeholder.remove();

    // Count real task items before placeholder (excluding dragged)
    var newIdx = 0;
    for (var i = 0; i < phIdx; i++) {
      if (children[i].classList && children[i].classList.contains('task-item') && children[i].dataset.taskid !== String(drag.task.id)) {
        newIdx++;
      }
    }

    // Reorder displayTasks
    var oldIdx = -1;
    for (var j=0;j<displayTasks.length;j++){ if(String(displayTasks[j].id)===String(drag.task.id)){oldIdx=j;break;} }
    if (oldIdx !== -1) {
      displayTasks.splice(oldIdx, 1);
      var insertAt = Math.min(newIdx, displayTasks.length);
      displayTasks.splice(insertAt, 0, drag.task);
    }
  } else if (drag.placeholder) {
    drag.placeholder.remove();
  }

  renderTaskList();
}

// ── TASK SELECTION ────────────────────────────────────────────────────────────
function selectTask(task) {
  activeTask = task;
  if (!running) { remaining = duration; updateDisplay(); }
  updateFocusLabel();
  renderTaskList();
  saveSess();
}

function skipTask() {
  if (displayTasks.length === 0) { activeTask = null; updateFocusLabel(); return; }
  var idx = -1;
  if (activeTask) {
    for (var i=0;i<displayTasks.length;i++){if(String(displayTasks[i].id)===String(activeTask.id)){idx=i;break;}}
  }
  selectTask(displayTasks[(idx + 1) % displayTasks.length]);
}

function updateFocusLabel() {
  var el = document.getElementById('focusTaskName');
  if (activeTask) { el.textContent = activeTask.text; el.classList.remove('placeholder'); }
  else { el.textContent = 'Selecciona una tarea para empezar'; el.classList.add('placeholder'); }
}

// ── SESSION PERSISTENCE ───────────────────────────────────────────────────────
function saveSess() {
  if (!activeTask && !running) { localStorage.removeItem(SESS_KEY); return; }
  localStorage.setItem(SESS_KEY, JSON.stringify({
    taskText:  activeTask ? activeTask.text      : '',
    taskId:    activeTask ? activeTask.id        : null,
    projectId: activeTask ? activeTask.projectId : null,
    remaining: remaining, duration: duration, running: running, ts: Date.now()
  }));
}

function restoreSess() {
  var raw = localStorage.getItem(SESS_KEY);
  if (!raw) { renderTaskList(); return; }
  var sess; try { sess = JSON.parse(raw); } catch(e) { renderTaskList(); return; }
  if (!sess || sess.remaining <= 0) { renderTaskList(); return; }

  var matchTask = null;
  if (sess.taskId != null) {
    for (var i=0;i<allFbTasks.length;i++){
      if (String(allFbTasks[i].id) === String(sess.taskId)){ matchTask = allFbTasks[i]; break; }
    }
  }
  if (!matchTask && sess.taskText) {
    matchTask = { id: sess.taskId, text: sess.taskText, projectId: sess.projectId || 'standalone',
                  projectName: '', catColor: 'rgba(255,255,255,0.2)', resp: '', priority: false, deadline: '' };
  }

  duration  = sess.duration || 25 * 60;
  var elapsed = sess.ts ? Math.floor((Date.now() - sess.ts) / 1000) : 0;
  remaining = Math.max(0, sess.remaining - (sess.running ? elapsed : 0));

  activeTask = matchTask;
  updateFocusLabel();
  updateDisplay();
  renderTaskList();

  if (sess.running && remaining > 0) {
    running = true;
    interval = setInterval(tick, 1000);
    document.getElementById('focusPanel').classList.add('running');
    document.getElementById('timerStatus').textContent = 'concentración';
    setPlayIcon(true);
    saveSess();
  }
}

window.addEventListener('beforeunload', function() { saveSess(); });

// ── FIREBASE LOAD ─────────────────────────────────────────────────────────────
DOC.onSnapshot(function(snap) {
  var d = snap.data();
  if (!d) { document.getElementById('emptyMsg').textContent = 'No hay datos disponibles'; return; }
  projects        = d.projects        || [];
  categories      = d.categories      || [];
  standaloneTasks = d.standaloneTasks || [];
  teamMembers     = d.teamMembers     || [];
  taskGroups      = d.taskGroups      || [];
  allFbTasks      = getAllTasks();
  rebuildDisplayTasks();
  renderPersonFilter();
  if (_firstLoad) { _firstLoad = false; restoreSess(); }
  else { renderTaskList(); }
});

// ── ALARM ─────────────────────────────────────────────────────────────────────
function playAlarm() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.35, 0.7].forEach(function(offset) {
      var osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime + offset);
      gain.gain.setValueAtTime(0, ctx.currentTime + offset);
      gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + offset + 0.05);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + offset + 0.28);
      osc.start(ctx.currentTime + offset);
      osc.stop(ctx.currentTime + offset + 0.3);
    });
  } catch(e) {}
}

// ── TIMER ─────────────────────────────────────────────────────────────────────
function setDuration(min, btn) {
  if (!min || min < 1) return;
  duration = min * 60;
  if (!running) { remaining = duration; updateDisplay(); }
  document.querySelectorAll('.dur-chip').forEach(function(b){ b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
}

function resetTimer(min) {
  clearInterval(interval); running = false;
  if (min) duration = min * 60;
  remaining = duration;
  updateDisplay();
  setPlayIcon(false);
  document.getElementById('focusPanel').classList.remove('running');
  document.getElementById('timerStatus').textContent = 'listo';
  document.getElementById('ringProgress').style.stroke = '#E8A020';
  saveSess();
}

function toggleTimer() {
  if (!activeTask) {
    if (displayTasks.length) selectTask(displayTasks[0]);
    else return;
  }
  running = !running;
  if (running) {
    interval = setInterval(tick, 1000);
    document.getElementById('focusPanel').classList.add('running');
    document.getElementById('timerStatus').textContent = 'concentración';
  } else {
    clearInterval(interval);
    document.getElementById('focusPanel').classList.remove('running');
    document.getElementById('timerStatus').textContent = 'pausa';
  }
  setPlayIcon(running);
  saveSess();
}

function tick() {
  remaining--;
  updateDisplay();
  saveSess();
  if (remaining <= 0) {
    clearInterval(interval); running = false;
    setPlayIcon(false);
    document.getElementById('focusPanel').classList.remove('running');
    document.getElementById('timerStatus').textContent = '¡completado!';
    document.getElementById('ringProgress').style.stroke = '#27AE72';
    playAlarm();
    if (activeTask) {
      var mins = Math.round(duration / 60);
      var time = new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
      sessionLog.push({taskId: activeTask.id, taskName: activeTask.text, mins: mins, time: time});
      renderSessionLog();
    }
    saveSess();
    setTimeout(function() { document.getElementById('ringProgress').style.stroke = '#E8A020'; skipTask(); }, 2500);
  }
}

function updateDisplay() {
  var m = Math.floor(remaining / 60), s = remaining % 60;
  document.getElementById('timerDisplay').textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  var pct = duration > 0 ? (1 - remaining / duration) : 0;
  document.getElementById('ringProgress').style.strokeDashoffset = CIRC * (1 - pct);
}

function setPlayIcon(isRunning) {
  document.getElementById('playIcon').innerHTML = isRunning
    ? '<rect x="6" y="4" width="4" height="16" fill="#0c0c0c" stroke="none"/><rect x="14" y="4" width="4" height="16" fill="#0c0c0c" stroke="none"/>'
    : '<polygon points="5 3 19 12 5 21 5 3" fill="#0c0c0c" stroke="none"/>';
}

function renderSessionLog() {
  var wrap = document.getElementById('sessionLog');
  var items = document.getElementById('logItems');
  var total = document.getElementById('totalFocus');
  if (sessionLog.length === 0) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';
  items.innerHTML = sessionLog.slice(-4).map(function(l) {
    return '<div class="log-item"><div class="log-dot"></div>' + l.taskName +
           ' · ' + l.mins + 'm <span style="color:rgba(255,255,255,0.2);margin-left:4px">' + l.time + '</span></div>';
  }).join('');
  var tot = sessionLog.reduce(function(s,l){ return s + l.mins; }, 0);
  total.textContent = 'Total: ' + (tot >= 60 ? Math.floor(tot/60)+'h '+tot%60+'m' : tot+'m') + ' enfocado';
}

// ── EXPOSE TO HTML ONCLICKS ───────────────────────────────────────────────────
window.toggleTimer  = toggleTimer;
window.resetTimer   = resetTimer;
window.skipTask     = skipTask;
window.setDuration  = setDuration;

updateDisplay();

})();
</script>
