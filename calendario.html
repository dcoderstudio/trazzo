<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>document.documentElement.style.setProperty("--vh",window.innerHeight+"px");</script>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1A6FD4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trazzo">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="theme.css">
<title>Calendario — Dcoder Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html{height:-webkit-fill-available;}
body{height:100%;min-height:-webkit-fill-available;background:#0c0c0c;color:#fff;font-family:'Inter',sans-serif;overflow:hidden;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:52px;border-bottom:0.5px solid rgba(255,255,255,0.06);flex-shrink:0;position:relative;z-index:1000;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-pill{background:#fff;color:#0c0c0c;font-size:11px;font-weight:800;padding:5px 10px;border-radius:8px;}
.logo-name{font-size:14px;font-weight:700;letter-spacing:.04em;}
.nav-btn{background:none;border:none;color:rgba(255,255,255,0.32);font-size:12px;font-weight:500;padding:6px 14px;border-radius:20px;cursor:pointer;font-family:'Inter',sans-serif;transition:background .15s,color .15s;}
.nav-btn:hover{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.78);}
.nav-btn.active{background:rgba(255,255,255,0.11);color:#fff;font-weight:600;}
.cal-wrap{display:flex;height:calc(100dvh - 52px);height:calc(var(--vh,100vh) - 52px);overflow:hidden;}
/* SIDEBAR */
.cal-sidebar{width:220px;flex-shrink:0;border-right:0.5px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;gap:0;overflow-y:auto;padding:20px 16px 16px;}
.cal-sidebar::-webkit-scrollbar{width:3px;}
.cal-sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);}
.cal-new-btn{background:#fff;color:#0c0c0c;border:none;font-size:12px;font-weight:700;padding:9px 16px;border-radius:12px;cursor:pointer;font-family:'Inter',sans-serif;width:100%;text-align:left;margin-bottom:20px;display:flex;align-items:center;gap:6px;}
.cal-new-btn:hover{background:#e8e8e8;}
/* MINI CALENDAR */
.mini-cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.mini-cal-lbl{font-size:11px;font-weight:700;color:rgba(255,255,255,0.55);}
.mini-nav-btn{background:none;border:none;color:rgba(255,255,255,0.3);cursor:pointer;font-size:15px;line-height:1;padding:2px 5px;border-radius:4px;}
.mini-nav-btn:hover{color:#fff;}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
.mini-wday{text-align:center;font-size:8px;font-weight:700;color:rgba(255,255,255,0.22);padding:3px 0;text-transform:uppercase;}
.mini-day{text-align:center;font-size:10px;color:rgba(255,255,255,0.45);padding:4px 2px;border-radius:5px;cursor:pointer;transition:all .12s;position:relative;}
.mini-day:hover{background:rgba(255,255,255,0.08);color:#fff;}
.mini-day.today{color:#fff;font-weight:700;}
.mini-day.today::after{content:'';position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#1A6FD4;}
.mini-day.selected{background:rgba(255,255,255,0.14);color:#fff;font-weight:700;}
.mini-day.other-month{color:rgba(255,255,255,0.15);}
.mini-day.has-events::before{content:'';position:absolute;top:1px;right:2px;width:3px;height:3px;border-radius:50%;background:#E8A020;}
/* CATEGORIES SIDEBAR */
.cat-section{margin-top:18px;}
.cat-section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.cat-section-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,0.2);}
.cat-add-btn{background:none;border:none;color:rgba(255,255,255,0.2);font-size:16px;cursor:pointer;padding:0;line-height:1;transition:color .15s;}
.cat-add-btn:hover{color:rgba(255,255,255,0.6);}
.cat-item{display:flex;align-items:center;gap:7px;font-size:11px;color:rgba(255,255,255,0.45);padding:4px 6px;border-radius:7px;cursor:pointer;transition:background .12s;}
.cat-item:hover{background:rgba(255,255,255,0.05);color:#fff;}
.cat-item.active{background:rgba(255,255,255,0.07);color:#fff;}
.cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.cat-count{margin-left:auto;font-size:9px;color:rgba(255,255,255,0.2);}
/* DAILY PRIORITIES SIDEBAR */
.prio-section{margin-top:16px;padding-top:14px;border-top:0.5px solid rgba(255,255,255,0.06);}
.prio-section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.prio-section-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,0.2);}
.prio-date-lbl{font-size:9px;color:rgba(255,255,255,0.18);margin-bottom:6px;}
.prio-add-btn{background:none;border:none;color:rgba(255,255,255,0.2);font-size:16px;cursor:pointer;padding:0;line-height:1;transition:color .15s;}
.prio-add-btn:hover{color:rgba(255,255,255,0.55);}
.prio-item{display:flex;align-items:flex-start;gap:6px;padding:4px 0;border-bottom:0.5px solid rgba(255,255,255,0.04);}
.prio-item:last-of-type{border-bottom:none;}
.prio-check{width:15px;height:15px;border-radius:4px;border:1.5px solid rgba(255,255,255,0.2);background:transparent;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:1px;}
.prio-check.done{border-color:#27AE72;background:#27AE72;}
.prio-text{font-size:11px;color:rgba(255,255,255,0.7);flex:1;line-height:1.4;word-break:break-word;}
.prio-text.done{color:rgba(255,255,255,0.22);text-decoration:line-through;}
.prio-del{background:none;border:none;color:rgba(255,255,255,0.1);font-size:13px;cursor:pointer;padding:0 2px;line-height:1;flex-shrink:0;transition:color .15s;}
.prio-del:hover{color:rgba(226,75,74,0.7);}
.prio-input-wrap{display:flex;gap:5px;margin-top:7px;}
.prio-input{flex:1;background:#1e1e1e;border:0.5px solid rgba(255,255,255,0.1);border-radius:7px;padding:5px 8px;font-size:11px;color:#fff;font-family:Inter,sans-serif;outline:none;}
.prio-input:focus{border-color:rgba(255,255,255,0.3);}
.prio-input::placeholder{color:rgba(255,255,255,0.18);}
/* Month goals & reminders (sidebar) */
.cal-month-sec{margin-top:16px;padding-top:14px;border-top:0.5px solid rgba(255,255,255,0.06);position:relative;}
.cal-month-sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.cal-month-sec-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,0.2);}
.cal-month-add-btn{background:none;border:none;color:rgba(255,255,255,0.2);font-size:16px;cursor:pointer;padding:0;line-height:1;transition:color .15s;}
.cal-month-add-btn:hover{color:rgba(255,255,255,0.6);}
.cal-month-item{display:flex;align-items:flex-start;gap:6px;padding:4px 0;border-bottom:0.5px solid rgba(255,255,255,0.04);}
.cal-month-item:last-of-type{border-bottom:none;}
.cal-month-chk{width:15px;height:15px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.2);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:1px;}
.cal-month-chk:hover{border-color:rgba(255,255,255,0.5);}
.cal-month-goals .cal-month-chk{border-color:rgba(232,160,32,0.35);}
.cal-month-goals .cal-month-chk.done{background:#E8A020;border-color:#E8A020;}
.cal-month-rems .cal-month-chk{border-color:rgba(44,197,210,0.35);}
.cal-month-rems .cal-month-chk.done{background:#2CC5D2;border-color:#2CC5D2;}
.cal-month-text{font-size:11px;color:rgba(255,255,255,0.7);flex:1;line-height:1.4;word-break:break-word;}
.cal-month-text.done{color:rgba(255,255,255,0.22);text-decoration:line-through;}
.cal-month-del{background:none;border:none;color:rgba(255,255,255,0.1);font-size:13px;cursor:pointer;padding:0 2px;line-height:1;flex-shrink:0;transition:color .15s;}
.cal-month-del:hover{color:rgba(226,75,74,0.7);}
.cal-month-inp-wrap{display:flex;gap:5px;margin-top:6px;}
.cal-month-inp{flex:1;background:#1e1e1e;border:0.5px solid rgba(255,255,255,0.1);border-radius:7px;padding:5px 8px;font-size:11px;color:#fff;font-family:Inter,sans-serif;outline:none;}
.cal-month-inp:focus{border-color:rgba(255,255,255,0.3);}
.cal-month-inp::placeholder{color:rgba(255,255,255,0.15);}
.cal-month-inp-ok{background:rgba(255,255,255,0.07);border:none;color:rgba(255,255,255,0.6);font-size:14px;border-radius:7px;width:28px;flex-shrink:0;cursor:pointer;line-height:28px;font-family:Inter,sans-serif;transition:background .15s;}
.cal-month-inp-ok:hover{background:rgba(255,255,255,0.14);}
.cal-month-all-done{font-size:9px;font-weight:700;color:#E8A020;text-align:center;padding:6px 2px 2px;letter-spacing:.03em;}
@keyframes cal-month-burst{0%{transform:scale(0) translateY(0);opacity:1;}100%{transform:scale(1.6) translateY(-32px);opacity:0;}}
.cal-month-dot{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;animation:cal-month-burst .6s ease-out forwards;}
.prio-input-ok{background:rgba(255,255,255,0.08);border:none;color:#fff;font-size:12px;border-radius:7px;padding:0 9px;cursor:pointer;font-family:Inter,sans-serif;line-height:28px;}
.prio-input-ok:hover{background:rgba(255,255,255,0.15);}
/* MAIN AREA */
.cal-main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.cal-nav-bar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;border-bottom:0.5px solid rgba(255,255,255,0.06);flex-shrink:0;}
.view-toggle{display:flex;background:rgba(255,255,255,0.05);border-radius:8px;padding:2px;gap:2px;}
.view-btn{background:none;border:none;color:rgba(255,255,255,0.35);font-size:11px;font-weight:600;padding:5px 12px;border-radius:6px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
.view-btn.active{background:#fff;color:#0c0c0c;}
.cal-nav-center{display:flex;align-items:center;gap:10px;}
.cal-period{font-size:15px;font-weight:700;letter-spacing:-.01em;min-width:200px;text-align:center;}
.cal-arrow{background:none;border:0.5px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.5);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.cal-arrow:hover{border-color:rgba(255,255,255,0.3);color:#fff;}
.cal-today-btn{background:none;border:0.5px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.55);font-size:11px;font-weight:600;padding:5px 12px;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
.cal-today-btn:hover{border-color:rgba(255,255,255,0.3);color:#fff;}
/* MEMBER FILTER BAR */
.member-bar{display:flex;align-items:center;gap:6px;padding:7px 20px;border-bottom:0.5px solid rgba(255,255,255,0.06);flex-shrink:0;overflow-x:auto;}
.member-bar::-webkit-scrollbar{display:none;}
.member-bar-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,0.18);margin-right:2px;white-space:nowrap;flex-shrink:0;}
.member-chip{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.08);border-radius:20px;padding:3px 10px 3px 4px;cursor:pointer;font-size:11px;font-weight:600;color:rgba(255,255,255,0.38);transition:all .15s;white-space:nowrap;flex-shrink:0;}
.member-chip.active{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);color:#fff;}
.member-chip .av{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;flex-shrink:0;}
/* MONTH GRID */
.cal-grid-wrap{flex:1;overflow-y:auto;padding:0;}
.cal-grid-wrap::-webkit-scrollbar{width:4px;}
.cal-grid-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px;}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);height:100%;}
.month-hdr{text-align:center;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,0.25);padding:8px 0;border-bottom:0.5px solid rgba(255,255,255,0.06);background:#0c0c0c;position:sticky;top:0;z-index:10;}
.month-day{border-right:0.5px solid rgba(255,255,255,0.05);border-bottom:0.5px solid rgba(255,255,255,0.05);padding:8px 7px 6px;cursor:pointer;min-height:100px;transition:background .1s;display:flex;flex-direction:column;gap:3px;}
.month-day:hover{background:rgba(255,255,255,0.025);}
.month-day.today{background:rgba(26,111,212,0.07);}
.month-day.today .month-day-num{color:#5B9FFF;font-weight:700;}
.month-day.selected{background:rgba(255,255,255,0.05);}
.month-day.other-month{opacity:.35;}
.month-day-num{font-size:12px;font-weight:500;color:rgba(255,255,255,0.6);line-height:1;margin-bottom:3px;}
.month-day.today .month-day-num{width:20px;height:20px;background:#1A6FD4;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
/* EVENT CHIPS */
.ev-chip{font-size:9px;font-weight:600;padding:2px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:opacity .12s;line-height:1.4;border-left:2.5px solid transparent;}
.ev-chip:hover{opacity:.8;}
.ev-more{font-size:9px;color:rgba(255,255,255,0.3);padding:1px 6px;cursor:pointer;}
.ev-more:hover{color:rgba(255,255,255,0.6);}
.ev-chip-delivery{background:rgba(26,111,212,.15)!important;border-left-color:#1A6FD4!important;color:#5AB4E8!important;}
.ev-chip-task{background:rgba(232,160,32,.15)!important;border-left-color:#E8A020!important;color:#E8A020!important;}
.ev-chip-reminder{background:rgba(39,174,114,.15)!important;border-left-color:#27AE72!important;color:#27AE72!important;}
.ev-chip-event{background:rgba(139,92,246,.15)!important;border-left-color:#8B5CF6!important;color:#8B5CF6!important;}
/* WEEK GRID */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);height:100%;}
.week-col{border-right:0.5px solid rgba(255,255,255,0.05);display:flex;flex-direction:column;overflow:hidden;}
.week-col-hdr{padding:10px 10px 8px;border-bottom:0.5px solid rgba(255,255,255,0.06);flex-shrink:0;cursor:pointer;transition:background .12s;}
.week-col-hdr:hover{background:rgba(255,255,255,0.03);}
.week-day-name{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,0.25);}
.week-day-num{font-size:22px;font-weight:800;letter-spacing:-.02em;color:rgba(255,255,255,0.7);line-height:1.1;margin-top:2px;}
.week-col.today .week-day-num{color:#5B9FFF;}
.week-col.selected .week-col-hdr{background:rgba(255,255,255,0.04);}
.week-events{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:5px;}
.week-events::-webkit-scrollbar{width:2px;}
.week-ev-card{border-radius:7px;padding:6px 8px;cursor:pointer;border-left:3px solid transparent;transition:opacity .12s;font-size:11px;}
.week-ev-card:hover{opacity:.8;}
.week-ev-title{font-weight:600;color:rgba(255,255,255,0.88);margin-bottom:1px;}
.week-ev-sub{font-size:9px;color:rgba(255,255,255,0.38);}
/* DAY VIEW */
.day-view-outer{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.day-allday-strip{border-bottom:0.5px solid rgba(255,255,255,0.06);padding:6px 10px 6px 64px;display:flex;gap:5px;flex-wrap:wrap;min-height:34px;align-items:center;flex-shrink:0;}
.day-allday-lbl{font-size:9px;color:rgba(255,255,255,0.18);white-space:nowrap;margin-right:2px;}
.day-allday-ev{font-size:10px;font-weight:600;padding:2px 9px;border-radius:20px;cursor:pointer;transition:opacity .12s;}
.day-allday-ev:hover{opacity:.8;}
.day-hour-scroll{flex:1;overflow-y:auto;position:relative;}
.day-hour-scroll::-webkit-scrollbar{width:4px;}
.day-hour-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px;}
.day-hour-grid{position:relative;}
.hour-row{display:flex;align-items:flex-start;height:64px;border-bottom:0.5px solid rgba(255,255,255,0.04);}
.hour-label{width:58px;flex-shrink:0;font-size:10px;color:rgba(255,255,255,0.2);font-weight:500;padding:0 10px 0 0;text-align:right;margin-top:-7px;user-select:none;}
.hour-slot{flex:1;position:relative;height:100%;cursor:pointer;}
.hour-slot:hover{background:rgba(255,255,255,0.015);}
.hour-half{position:absolute;top:50%;left:0;right:0;border-top:0.5px solid rgba(255,255,255,0.03);pointer-events:none;}
.now-dot{position:absolute;left:50px;width:10px;height:10px;border-radius:50%;background:#E24B4A;z-index:12;pointer-events:none;transform:translateY(-4px);}
.now-line{position:absolute;left:60px;right:0;height:1.5px;background:#E24B4A;z-index:12;pointer-events:none;}
.day-ev-block{position:absolute;left:62px;right:10px;border-radius:9px;padding:5px 9px;cursor:pointer;overflow:hidden;border-left:3px solid transparent;transition:opacity .12s;z-index:5;}
.day-ev-block:hover{opacity:.82;}
.day-ev-time-lbl{font-size:9px;font-weight:600;opacity:.7;margin-bottom:1px;}
.day-ev-title{font-size:11px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.day-ev-sub{font-size:9px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
/* DAY PANEL */
.cal-day-panel{width:0;border-left:0.5px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;overflow:hidden;transition:width .25s;flex-shrink:0;}
.cal-day-panel.open{width:280px;}
.cdp-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;border-bottom:0.5px solid rgba(255,255,255,0.06);flex-shrink:0;}
.cdp-date{font-size:14px;font-weight:700;}
.cdp-close{background:none;border:none;color:rgba(255,255,255,0.3);font-size:18px;cursor:pointer;padding:0 4px;line-height:1;}
.cdp-close:hover{color:#fff;}
.cdp-events-wrap{flex:1;overflow-y:auto;padding:12px;}
.cdp-events-wrap::-webkit-scrollbar{width:3px;}
.cdp-events-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);}
.cdp-section-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,0.22);margin-bottom:8px;margin-top:14px;}
.cdp-section-lbl:first-child{margin-top:0;}
.cdp-event-row{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,0.04);margin-bottom:5px;cursor:pointer;transition:background .12s;}
.cdp-event-row:hover{background:rgba(255,255,255,0.07);}
.cdp-ev-info{flex:1;min-width:0;}
.cdp-ev-title{font-size:12px;font-weight:600;color:rgba(255,255,255,0.85);margin-bottom:2px;line-height:1.3;}
.cdp-ev-sub{font-size:10px;color:rgba(255,255,255,0.35);}
.cdp-empty{text-align:center;color:rgba(255,255,255,0.18);font-size:11px;padding:28px 0;}
.cdp-actions{padding:12px;border-top:0.5px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;gap:7px;flex-shrink:0;}
.cdp-btn{background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.6);font-size:11px;font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer;font-family:'Inter',sans-serif;text-align:left;transition:all .15s;width:100%;}
.cdp-btn:hover{background:rgba(255,255,255,0.1);color:#fff;}
/* EVENT MODAL */

  // ── HELPERS ──────────────────────────────────────────────────
  function getCat(id){for(var i=0;i<categories.length;i++){if(categories[i].id===id)return categories[i];}return null;}
  function getWeekStart(d){var r=new Date(d);r.setHours(0,0,0,0);var dow=r.getDay();var diff=(dow===0?-6:1-dow);r.setDate(r.getDate()+diff);return r;}
  function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function parse(s){return new Date(s+'T00:00:00');}

  // ── EVENT COLLECTION ──────────────────────────────────────────
  // Fetch Google Calendar events for a date range and cache in _calGcEvs
  function _calFetchGc(rangeKey, tMin, tMax){
    if(_calGcFetched[rangeKey])return;
    if(!_wkoGcTok||!_wkoGapiRdy)return;
    _calGcFetched[rangeKey]=true;
    gapi.client.calendar.calendarList.list({minAccessRole:'reader'}).then(function(cl){
      var cals=(cl.result.items||[]).map(function(c){return{id:c.id,color:c.backgroundColor};});
      if(!cals.length)cals=[{id:'primary',color:null}];
      var all=[],done=0;
      cals.forEach(function(cal){
        gapi.client.calendar.events.list({calendarId:cal.id,timeMin:tMin,timeMax:tMax,singleEvents:true,orderBy:'startTime',maxResults:100}).then(function(r){
          (r.result.items||[]).forEach(function(ev){
            if(!ev.start)return;
            var isAllDay=!!ev.start.date;
            var startDt=new Date(isAllDay?ev.start.date+'T00:00:00':ev.start.dateTime);
            var endDt=new Date(isAllDay?ev.end.date+'T00:00:00':ev.end.dateTime||ev.start.dateTime||ev.start.date+'T01:00:00');
            var cur=new Date(startDt);cur.setHours(0,0,0,0);
            var endDay=new Date(endDt);endDay.setHours(0,0,0,0);
            // Add entry for each day the event spans
            while(cur<=endDay){
              var ds=fmt(cur);
              if(!_calGcEvs[ds])_calGcEvs[ds]=[];
              var exists=_calGcEvs[ds].some(function(x){return x.id==='gc_'+ev.id;});
              if(!exists){
                var t='';if(!isAllDay&&ev.start.dateTime){var d2=new Date(ev.start.dateTime);t=String(d2.getHours()).padStart(2,'0')+':'+String(d2.getMinutes()).padStart(2,'0');}
                _calGcEvs[ds].push({id:'gc_'+ev.id,date:ds,title:ev.summary||'(sin título)',sub:'Google Cal',
                  color:cal.color||'#4285F4',type:'event',icon:'📅',time:t,isGC:true});
              }
              cur.setDate(cur.getDate()+1);
            }
          });
          if(++done===cals.length)render();
        }).catch(function(){++done;});
      });
    }).catch(function(e){if(e.status===401){_wkoGcTok=null;_wkoRenderGcBtn();}});
  }

  // Trigger GC fetch for current view range
  function _calFetchGcForView(){
    if(!_wkoGcTok||!_wkoGapiRdy)return;
    if(curView==='month'){
      var key=curYear+'-'+curMonth;
      var first=new Date(curYear,curMonth,1);
      var last=new Date(curYear,curMonth+1,0);
      _calFetchGc(key,addDays(first,-7).toISOString(),addDays(last,7).toISOString());
    }else if(curView==='week'){
      var key2='w_'+fmt(curWeekStart);
      _calFetchGc(key2,curWeekStart.toISOString(),addDays(curWeekStart,7).toISOString());
    }else{
      var key3='d_'+fmt(curDayDate);
      var d2=new Date(curDayDate);
      _calFetchGc(key3,d2.toISOString(),addDays(d2,1).toISOString());
    }
  }

  function getAllEvents(){
    var evs=[];
    projects.forEach(function(p){
      if(!p.deadline) return;
      if(p.catId==='cotizaciones') return;
      var cat=getCat(p.catId);
      evs.push({id:'proj_'+p.id,date:p.deadline,title:p.name,sub:p.client||'',color:cat?cat.color:'#1A6FD4',type:'delivery',icon:'📦'});
    });
    projects.forEach(function(p){
      if(!p.stageTasks) return;
      if(p.catId==='cotizaciones') return;
      var cat=getCat(p.catId);
      var stage=p.stage;
      var tasks=p.stageTasks[stage]||[];
      tasks.forEach(function(t){
        if(t.deadline&&!t.done) evs.push({id:'task_'+t.id,date:t.deadline,title:t.text,sub:p.name+' · '+stage,color:cat?cat.color:'#E8A020',type:'task',icon:'✓',projId:p.id,stage:stage,taskId:t.id});
      });
    });
    standaloneTasks.forEach(function(t){
      if(t.deadline&&!t.done){
        var isDel=!!t.isDelivery;
        evs.push({id:'st_'+t.id,date:t.deadline,title:t.text,
          sub:isDel?'Entrega':'Tarea libre',
          color:isDel?'#1A6FD4':'#E8A020',
          type:isDel?'delivery':'task',
          icon:isDel?'📦':'✓',
          taskId:t.id,isStandalone:true,resp:t.resp||''});
      }
    });
    return evs;
  }

  function getCustomEventsFor(dateStr){
    var result=[];
    calendarEvents.forEach(function(ev){
      if(ev.date===dateStr){result.push(ev);return;}
      if(!ev.repeat||ev.repeat==='none') return;
      var base=parse(ev.date),target=parse(dateStr);
      if(base>target) return;
      var match=false;
      switch(ev.repeat){
        case 'daily':match=true;break;
        case 'weekly':match=(Math.round((target-base)/86400000)%7===0);break;
        case 'monthly':match=(target.getDate()===base.getDate());break;
        case 'yearly':match=(target.getDate()===base.getDate()&&target.getMonth()===base.getMonth());break;
      }
      if(match) result.push(Object.assign({},ev,{date:dateStr,isRepeat:true}));
    });
    return result;
  }

  function getEventsForDate(dateStr){
    var base=getAllEvents().filter(function(e){return e.date===dateStr;});
    var calEvs=[];
    getCustomEventsFor(dateStr).forEach(function(ev){
      calEvs.push({id:'cal_'+ev.id+(ev.isRepeat?'_r':''),date:ev.date,title:ev.title,sub:ev.notes||'',color:ev.color||'#27AE72',type:ev.type||'reminder',icon:'🔔',calId:ev.id,isRepeat:ev.isRepeat,time:ev.time||'',catId:ev.catId||'',resp:ev.resp||''});
    });
    var calTaskKeys={};
    calEvs.forEach(function(e){if(e.type==='task') calTaskKeys[e.title+'|'+e.date]=true;});
    base=base.filter(function(e){
      if(e.id&&e.id.indexOf('st_')===0&&calTaskKeys[e.title+'|'+e.date]) return false;
      return true;
    });
    var gcEvs=(_calGcEvs[dateStr]||[]);
    var evs=base.concat(calEvs).concat(gcEvs);
    evs.sort(function(a,b){return(a.time||'99:99')<(b.time||'99:99')?-1:1;});
    return evs;
  }

  function applyFilters(evs){
    if(selectedMember){
      evs=evs.filter(function(ev){
        return (ev.resp&&ev.resp===selectedMember)||(ev.sub&&ev.sub.indexOf(selectedMember)>=0);
      });
    }
    if(selectedCatFilter){
      evs=evs.filter(function(ev){return ev.catId===selectedCatFilter;});
    }
    return evs;
  }

  // ── MONTH VIEW ────────────────────────────────────────────────
  function renderMonth(){
    document.getElementById('calPeriod').textContent=MNS_LONG[curMonth]+' '+curYear;
    var grid=document.getElementById('calGrid'); grid.innerHTML='';
    var mg=document.createElement('div'); mg.className='month-grid';
    DAYS_S.forEach(function(d){var h=document.createElement('div');h.className='month-hdr';h.textContent=d;mg.appendChild(h);});
    var firstDay=new Date(curYear,curMonth,1);
    var lastDay=new Date(curYear,curMonth+1,0);
    var startDow=firstDay.getDay(); var off=startDow===0?6:startDow-1;
    var evByDate={};
    var rangeStart=addDays(firstDay,-off); var rangeEnd=addDays(lastDay,7);
    var d2=new Date(rangeStart);
    while(d2<=rangeEnd){var ds=fmt(d2);evByDate[ds]=applyFilters(getEventsForDate(ds));d2=addDays(d2,1);}
    var cur=new Date(firstDay); cur.setDate(1-off);
    var totalCells=Math.ceil((off+lastDay.getDate())/7)*7;
    for(var i=0;i<totalCells;i++){
      var ds=fmt(cur);
      var cell=document.createElement('div'); cell.className='month-day';
      if(sameDay(cur,today)) cell.classList.add('today');
      if(selectedDate&&ds===selectedDate) cell.classList.add('selected');
      if(cur.getMonth()!==curMonth) cell.classList.add('other-month');
      var numEl=document.createElement('div'); numEl.className='month-day-num';
      if(sameDay(cur,today)){var inner=document.createElement('div');inner.className='month-day-num';inner.textContent=cur.getDate();numEl.appendChild(inner);}
      else{numEl.textContent=cur.getDate();}
      cell.appendChild(numEl);
      var dayEvs=evByDate[ds]||[];
      dayEvs.slice(0,3).forEach(function(ev){
        var typeClass={delivery:'ev-chip-delivery',task:'ev-chip-task',reminder:'ev-chip-reminder',event:'ev-chip-event'}[ev.type]||'ev-chip-reminder';
        var typeIcon={delivery:'📦',task:'✓',reminder:'🔔',event:'📅'}[ev.type]||'🔔';
        var chip=document.createElement('div'); chip.className='ev-chip '+typeClass;
        chip.textContent=typeIcon+' '+ev.title;
        chip.onclick=(function(d2){return function(e){e.stopPropagation();openDayPanel(d2);};})(ds);
        cell.appendChild(chip);
      });
      if(dayEvs.length>3){var more=document.createElement('div');more.className='ev-more';more.textContent='+'+(dayEvs.length-3)+' más';more.onclick=(function(d2){return function(e){e.stopPropagation();openDayPanel(d2);};})(ds);cell.appendChild(more);}
      cell.onclick=(function(d2){return function(){openDayPanel(d2);};})(ds);
      cell.ondblclick=(function(d2){return function(e){e.stopPropagation();location.href='daily-hub.html?date='+d2;};})(ds);
      mg.appendChild(cell);
      cur=addDays(cur,1);
    }
    grid.appendChild(mg);
    renderMiniCal();
    renderMemberBar();
  }

  // ── WEEK VIEW ─────────────────────────────────────────────────
  function renderWeek(){
    var weekEnd=addDays(curWeekStart,6);
    var y1=curWeekStart.getFullYear(),m1=curWeekStart.getMonth(),d1=curWeekStart.getDate();
    var y2=weekEnd.getFullYear(),m2=weekEnd.getMonth(),d2=weekEnd.getDate();

    var wg=document.createElement('div'); wg.className='week-grid';
    for(var i=0;i<7;i++){
      var d=addDays(curWeekStart,i); var ds=fmt(d);
      var col=document.createElement('div'); col.className='week-col';

      dayEvs.forEach(function(ev){
        var typeBg={delivery:'rgba(26,111,212,.12)',task:'rgba(232,160,32,.12)',reminder:'rgba(39,174,114,.12)',event:'rgba(139,92,246,.12)'}[ev.type]||'rgba(39,174,114,.12)';
        var typeBorder={delivery:'#1A6FD4',task:'#E8A020',reminder:'#27AE72',event:'#8B5CF6'}[ev.type]||'#27AE72';

        card.onclick=(function(ds2){return function(e){e.stopPropagation();openDayPanel(ds2);};})(ds);
        evWrap.appendChild(card);

  // ── DAY VIEW ──────────────────────────────────────────────────
  function renderDay(){
    var d=curDayDate; var ds=fmt(d);
    document.getElementById('calPeriod').textContent=DAYS_FULL[d.getDay()]+', '+d.getDate()+' de '+MNS_LONG[d.getMonth()]+' '+d.getFullYear();
    // Close right panel in day view
    document.getElementById('calDayPanel').classList.remove('open');

    var grid=document.getElementById('calGrid'); grid.innerHTML='';
    grid.style.cssText='flex:1;display:flex;flex-direction:column;overflow:hidden;';

    // All-day strip
    var allDayStrip=document.createElement('div'); allDayStrip.className='day-allday-strip';
    var allDayLbl=document.createElement('span'); allDayLbl.className='day-allday-lbl'; allDayLbl.textContent='Todo el día';
    allDayStrip.appendChild(allDayLbl);
    grid.appendChild(allDayStrip);

    // Hour scroll
    var scroll=document.createElement('div'); scroll.className='day-hour-scroll'; scroll.id='dayHourScroll';
    var hourGrid=document.createElement('div'); hourGrid.className='day-hour-grid';
    hourGrid.style.minHeight=((HOUR_END-HOUR_START)*HOUR_PX)+'px';
    hourGrid.style.position='relative';

    for(var h=HOUR_START;h<HOUR_END;h++){
      var row=document.createElement('div'); row.className='hour-row';
      var lbl=document.createElement('div'); lbl.className='hour-label';
      lbl.textContent=String(h).padStart(2,'0')+':00';
      var slot=document.createElement('div'); slot.className='hour-slot';
      var half=document.createElement('div'); half.className='hour-half';
      slot.appendChild(half);
      (function(hour){
        slot.onclick=function(e){
          if(e.target!==slot&&e.target!==half) return;
          openEventModal(ds,null,null,String(hour).padStart(2,'0')+':00');
        };
      })(h);
      row.appendChild(lbl); row.appendChild(slot); hourGrid.appendChild(row);
    }

    // Now indicator
    var now=new Date();
    if(sameDay(d,today)){
      var nowH=now.getHours(),nowM=now.getMinutes();
      if(nowH>=HOUR_START&&nowH<HOUR_END){
        var nowTop=(nowH-HOUR_START)*HOUR_PX+(nowM/60)*HOUR_PX;
        var dot=document.createElement('div'); dot.className='now-dot'; dot.style.top=(nowTop-4)+'px';
        var line=document.createElement('div'); line.className='now-line'; line.style.top=nowTop+'px';
        hourGrid.appendChild(dot); hourGrid.appendChild(line);
      }
    }

    // Events
    var evs=applyFilters(getEventsForDate(ds));
    var allDayEvs=[],timedEvs=[];
    evs.forEach(function(ev){if(ev.time)timedEvs.push(ev);else allDayEvs.push(ev);});

    allDayEvs.forEach(function(ev){
      var typeClass={delivery:'ev-chip-delivery',task:'ev-chip-task',reminder:'ev-chip-reminder',event:'ev-chip-event'}[ev.type]||'ev-chip-reminder';
      var typeIcon={delivery:'📦',task:'✓',reminder:'🔔',event:'📅'}[ev.type]||'🔔';
      var chip=document.createElement('div'); chip.className='day-allday-ev '+typeClass;
      chip.textContent=typeIcon+' '+ev.title;
      chip.onclick=function(){if(ev.calId)openEventModal(ds,null,ev.calId);else if(ev.taskId)openCalTaskEdit(ev);};
      allDayStrip.appendChild(chip);
    });

    // Overlap grouping for timed events
    timedEvs.sort(function(a,b){return(a.time||'')<(b.time||'')?-1:1;});
    var groups=[];
    timedEvs.forEach(function(ev){
      var parts=(ev.time||'00:00').split(':');
      var h2=parseInt(parts[0]),m2=parseInt(parts[1]||0);
      var top=(h2-HOUR_START)*HOUR_PX+(m2/60)*HOUR_PX;
      var bottom=top+HOUR_PX;
      var placed=false;
      for(var g=0;g<groups.length;g++){
        var grp=groups[g];
        var overlap=false;

  function renderMiniCalFor(my,mm,container){

  function _wkoCalcCols(items){
    for(var i=0;i<items.length;i++)items[i].col=0;
    for(var i=1;i<items.length;i++){
      var used=[];
      for(var j=0;j<i;j++){if(items[i].top<items[j].bot&&items[i].bot>items[j].top)used.push(items[j].col);}
      var c=0;while(used.indexOf(c)>=0)c++;items[i].col=c;
    }
    items.forEach(function(p){var mx=p.col;items.forEach(function(q){if(q!==p&&p.top<q.bot&&p.bot>q.top)mx=Math.max(mx,q.col);});p.numCols=mx+1;});
  }

  function _wkoPlaceBlocks(hgrid,ds){
    var blocks=(_wkoDB[ds]||[]);if(!blocks.length)return;
    var items=blocks.map(function(b){
      var s=_wkoPT(b.start),e=_wkoPT(b.end);
      var top=(s.h-HSW)*HPXW+(s.m/60)*HPXW,bot=(e.h-HSW)*HPXW+(e.m/60)*HPXW;
      return{b:b,top:top,bot:Math.max(bot,top+20),col:0,numCols:1};
    });
    _wkoCalcCols(items);
    items.forEach(function(it){
      var b=it.b;var col=b.color||'#1A6FD4';
      var el=document.createElement('div');el.className='wko-block';
      el.style.top=it.top+'px';el.style.height=Math.max(18,it.bot-it.top-2)+'px';
      el.style.borderLeftColor=col;el.style.background=col+'22';
      if(it.numCols>1){var nc=it.numCols;var ci=it.col;el.style.left='calc(2px + '+ci+' * (100% - 4px) / '+nc+')';el.style.right='';el.style.width='calc((100% - 4px) / '+nc+')';}
      var bt=document.createElement('div');bt.className='wko-btime';bt.style.color=col;bt.textContent=(b.start||'')+(b.end?' – '+b.end:'');
      var btt=document.createElement('div');btt.className='wko-btitle';btt.style.color=col;btt.textContent=b.title||'';
      el.appendChild(bt);el.appendChild(btt);
      (function(bb,dds){el.onclick=function(e){e.stopPropagation();wkoBmOpen(dds,null,bb.id);};})(b,ds);
      hgrid.appendChild(el);
    });
  }

        _wkoGcTok=r.access_token;_calGcFetched={};_calGcEvs={};

  function _wkoFetchGc(ds){
    if(!_wkoGcTok||!_wkoGapiRdy||_wkoGcEvs[ds]!==undefined)return;
    _wkoGcEvs[ds]=null;
    var d=new Date(ds+'T00:00:00');
    var tMin=d.toISOString(),tMax=new Date(d.getTime()+86400000).toISOString();
    gapi.client.calendar.calendarList.list({minAccessRole:'reader'}).then(function(cl){
      var cals=(cl.result.items||[]).map(function(c){return{id:c.id,color:c.backgroundColor};});
      if(!cals.length)cals=[{id:'primary',color:null}];
      var all=[],done=0;
      cals.forEach(function(cal){
        gapi.client.calendar.events.list({calendarId:cal.id,timeMin:tMin,timeMax:tMax,singleEvents:true,orderBy:'startTime',maxResults:25}).then(function(r){
          var evs=(r.result.items||[]).filter(function(e){return e.start&&e.start.dateTime;});
          evs.forEach(function(e){e._calColor=cal.color;});all=all.concat(evs);
          if(++done===cals.length){_wkoGcEvs[ds]=all;_wkoRenderGrid();}
        }).catch(function(){if(++done===cals.length){_wkoGcEvs[ds]=all||[];_wkoRenderGrid();}});
      });
    }).catch(function(e){if(e.status===401){_wkoGcTok=null;_wkoRenderGcBtn();}});
  }

        updateFn:(function(id){return function(newDs){for(var i=0;i<standaloneTasks.length;i++){if(standaloneTasks[i].id===id){standaloneTasks[i].deadline=newDs;_pass.standaloneTasks=standaloneTasks;saveData2();_wkoRenderRpanel();return;}}};})(t.id)
      });

    (projects||[]).forEach(function(p){

      (p.stageTasks[stage]||[]).forEach(function(t){

          updateFn:(function(pid,st,tid){return function(newDs){for(var i=0;i<projects.length;i++){if(projects[i].id===pid){var arr=projects[i].stageTasks[st]||[];for(var j=0;j<arr.length;j++){if(arr[j].id===tid){arr[j].deadline=newDs;saveData2();_wkoRenderRpanel();return;}}}}};})(p.id,stage,t.id)
        });
      });
    });
    // Sort within each day by saved order; done tasks always go last
    weekTasks.sort(function(a,b){

      var ad=a.done?1:0,bd=b.done?1:0;if(ad!==bd)return ad-bd;

      if(ai!==-1&&bi!==-1)return ai-bi;

    _wkoLastWeekTasks=weekTasks;
    // Group by day — always show all 7 days, reminders first then tasks

        sc.appendChild(_wkoRpCard(t.text,false,c,colorIdx-1,t.sub,{sec:'deadline',ds:t.deadline,taskid:String(t.id),dataIdx:colorIdx-1},t.onCheck,{type:'deadline',updateFn:t.updateFn}));

      if(dayDone.length){

        tog.textContent=(isCol?'▶ ':'▼ ')+dayDone.length+(dayDone.length===1?' completada':' completadas');

        sc.appendChild(tog);
        if(!isCol)dayDone.forEach(function(t,i){
          sc.appendChild(_wkoRpCard(t.text,true,'#888',colorIdx+i,t.sub,{sec:'deadline',ds:t.deadline,taskid:String(t.id),dataIdx:colorIdx+i},t.onCheck,{type:'deadline',updateFn:t.updateFn}));

        empty.dataset.dday=ds;empty.textContent='Suelta aquí o usa los botones de arriba';

    // ── SECTION 4: Tareas pendientes ──

    sh4.appendChild(sl4);sc.appendChild(sh4);
    var pending=(standaloneTasks||[]).filter(function(t){return !t.done;});
    if(!pending.length){var e3=document.createElement('div');e3.className='wko-rp-empty';e3.textContent='Sin tareas pendientes';sc.appendChild(e3);}
    else{
      pending.slice(0,25).forEach(function(t,i){

          type:'deadline',

            for(var j=0;j<standaloneTasks.length;j++){if(standaloneTasks[j].id===id){standaloneTasks[j].deadline=newDs;_pass.standaloneTasks=standaloneTasks;saveData2();_wkoRenderRpanel();return;}}
          };})(t.id)
        }));

    }
    rp.appendChild(sc);
    sc.scrollTop=_prevScroll;
  }

  // ── LONG-PRESS DRAG (mobile-friendly) ────────────────────────
  // Touch: hold 420ms without moving to start drag (allows normal scroll)
  // Mouse: drag starts immediately (desktop behavior unchanged)
  function _wkoLongPressDrag(el, text, color, dragCfg){
    // ── MOUSE (desktop): immediate drag ──
    el.addEventListener('pointerdown',function(e){
      if(e.pointerType==='touch')return; // handled by touch events below
      if(e.button&&e.button!==0)return;
      _wkoRpDragStart(e,text,color,el,dragCfg);
    },{passive:false});

    // ── TOUCH (mobile): long press 420ms ──
    var _t=null,_sx=0,_sy=0,_lx=0,_ly=0;
    el.addEventListener('touchstart',function(e){
      var tc=e.touches[0];
      _sx=tc.clientX;_sy=tc.clientY;_lx=tc.clientX;_ly=tc.clientY;
      _t=setTimeout(function(){
        _t=null;
        el.classList.add('drag-ready');
        setTimeout(function(){el.classList.remove('drag-ready');},300);
        _wkoRpDragStartXY(_lx,_ly,text,color,el,dragCfg);
      },420);
    },{passive:true});
    el.addEventListener('touchmove',function(e){
      if(!_t)return;
      var tc=e.touches[0];_lx=tc.clientX;_ly=tc.clientY;
      var dx=tc.clientX-_sx,dy=tc.clientY-_sy;
      if(dx*dx+dy*dy>64){clearTimeout(_t);_t=null;} // >8px = scrolling
    },{passive:true});
    function _tcancel(){if(_t){clearTimeout(_t);_t=null;}}
    el.addEventListener('touchend',_tcancel,{passive:true});
    el.addEventListener('touchcancel',_tcancel,{passive:true});
  }
  function _wkoRpDragStartXY(cx,cy,text,color,srcCard,dragCfg){
    if(srcCard)srcCard.classList.add('dragging');
    var ghost=document.createElement('div');ghost.className='wko-rp-ghost';
    ghost.style.cssText='background:rgba('+_wkoHexRgb(color)+',.25);border:0.5px solid '+color+';border-left:3px solid '+color+';';
    ghost.textContent=text;
    document.body.appendChild(ghost);
    _wkoRpDrag={text:text,color:color,ghost:ghost,hoverSlot:null,hoverDc:null,hoverDayEl:null,srcCard:srcCard||null,
      insertBefore:true,type:(dragCfg&&dragCfg.type)||'block',updateFn:(dragCfg&&dragCfg.updateFn)||null};
    ghost.style.left=(cx+14)+'px';ghost.style.top=(cy-18)+'px';
    // Touch: use touchmove/touchend to drive the drag
    function _onTouchMove(e){
      e.preventDefault();
      var tc=e.touches[0];
      var synth={clientX:tc.clientX,clientY:tc.clientY,preventDefault:function(){}};
      _wkoRpOnMove(synth);
    }
    function _onTouchEnd(e){
      document.removeEventListener('touchmove',_onTouchMove);
      document.removeEventListener('touchend',_onTouchEnd);
      var synth={clientX:cx,clientY:cy,preventDefault:function(){}};
      _wkoRpOnUp(synth);
    }
    document.addEventListener('touchmove',_onTouchMove,{passive:false});
    document.addEventListener('touchend',_onTouchEnd,{passive:false});
    // Mouse: keep pointer events
    document.addEventListener('pointermove',_wkoRpOnMove,{passive:false});
    document.addEventListener('pointerup',_wkoRpOnUp);
  }

  // ── DRAG FROM RIGHT PANEL ─────────────────────────────────────
  var _wkoRpDrag=null;
  var _wkoRpInsertEl=null;

  function _wkoMoveInsert(refCard,before){
    if(!_wkoRpInsertEl){_wkoRpInsertEl=document.createElement('div');_wkoRpInsertEl.className='wko-rp-insert';}
    if(refCard&&refCard.parentNode){
      if(before)refCard.parentNode.insertBefore(_wkoRpInsertEl,refCard);
      else{if(refCard.nextSibling)refCard.parentNode.insertBefore(_wkoRpInsertEl,refCard.nextSibling);else refCard.parentNode.appendChild(_wkoRpInsertEl);}
    }
  }
  function _wkoRemoveInsert(){
    if(_wkoRpInsertEl&&_wkoRpInsertEl.parentNode)_wkoRpInsertEl.parentNode.removeChild(_wkoRpInsertEl);
  }

  function _wkoRpDragStart(e,text,color,srcCard,dragCfg){
    if(e.button&&e.button!==0)return;
    e.preventDefault();
    if(srcCard)srcCard.classList.add('dragging');
    var ghost=document.createElement('div');ghost.className='wko-rp-ghost';
    ghost.style.cssText='background:rgba('+_wkoHexRgb(color)+',.25);border:0.5px solid '+color+';border-left:3px solid '+color+';';
    ghost.textContent=text;
    document.body.appendChild(ghost);
    _wkoRpDrag={
      text:text,color:color,ghost:ghost,hoverSlot:null,hoverDc:null,hoverDayEl:null,srcCard:srcCard||null,
      insertBefore:true,
      type:(dragCfg&&dragCfg.type)||'block',
      updateFn:(dragCfg&&dragCfg.updateFn)||null
    };
    _wkoRpMoveGhost(e);
    document.addEventListener('pointermove',_wkoRpOnMove,{passive:false});
    document.addEventListener('pointerup',_wkoRpOnUp);
  }
  function _wkoRpMoveGhost(e){
    if(!_wkoRpDrag)return;
    _wkoRpDrag.ghost.style.left=(e.clientX+14)+'px';
    _wkoRpDrag.ghost.style.top=(e.clientY-18)+'px';
  }
  function _wkoRpOnMove(e){
    e.preventDefault();
    _wkoRpMoveGhost(e);
    var el=document.elementFromPoint(e.clientX,e.clientY);
    var dc=el&&el.closest('.wko-dc:not(.dragging)');
    var slot=el&&el.closest('.wko-slot');
    var dayEl=el&&(el.closest('.wko-rp-day[data-dday]')||el.closest('.wko-rp-day-empty[data-dday]'));
    // Slot highlight
    if(_wkoRpDrag.hoverSlot&&_wkoRpDrag.hoverSlot!==slot){_wkoRpDrag.hoverSlot.classList.remove('drop-hi');_wkoRpDrag.hoverSlot=null;}
    if(slot){slot.classList.add('drop-hi');_wkoRpDrag.hoverSlot=slot;}
    // Day header/empty zone highlight
    if(_wkoRpDrag.hoverDayEl&&_wkoRpDrag.hoverDayEl!==dayEl){_wkoRpDrag.hoverDayEl.classList.remove('drop-hi');_wkoRpDrag.hoverDayEl=null;}
    if(dayEl&&!dc){dayEl.classList.add('drop-hi');_wkoRpDrag.hoverDayEl=dayEl;}
    // Card insert indicator
    if(dc&&dc!==_wkoRpDrag.srcCard){
      var rect=dc.getBoundingClientRect();
      var before=e.clientY<rect.top+rect.height/2;
      _wkoRpDrag.hoverDc=dc;_wkoRpDrag.insertBefore=before;
      _wkoMoveInsert(dc,before);
    }else if(!slot){
      _wkoRemoveInsert();_wkoRpDrag.hoverDc=null;
    }
  }
  function _wkoRpOnUp(e){
    document.removeEventListener('pointermove',_wkoRpOnMove);
    document.removeEventListener('pointerup',_wkoRpOnUp);
    if(!_wkoRpDrag)return;
    if(_wkoRpDrag.hoverSlot)_wkoRpDrag.hoverSlot.classList.remove('drop-hi');
    if(_wkoRpDrag.hoverDayEl)_wkoRpDrag.hoverDayEl.classList.remove('drop-hi');
    _wkoRemoveInsert();
    _wkoRpDrag.ghost.remove();
    if(_wkoRpDrag.srcCard)_wkoRpDrag.srcCard.classList.remove('dragging');
    var drag=_wkoRpDrag;_wkoRpDrag=null;
    var slot=drag.hoverSlot;
    var dc=drag.hoverDc;
    // Drop on day header/empty zone → assign deadline
    if(drag.hoverDayEl&&drag.updateFn&&!dc&&!slot){
      drag.updateFn(drag.hoverDayEl.dataset.dday);return;
    }
    var srcCard=drag.srcCard;

    if(dc&&srcCard&&srcCard!==dc){
      var srcSec=srcCard.dataset.sec||'';
      var tgtSec=dc.dataset.sec||'';

      if(srcSec==='deadline'&&tgtSec==='deadline'){
        var srcTid=srcCard.dataset.taskid;
        var tgtTid=dc.dataset.taskid;
        var srcT=null,tgtT=null;
        (_wkoLastWeekTasks||[]).forEach(function(t){if(String(t.id)===srcTid)srcT=t;if(String(t.id)===tgtTid)tgtT=t;});
        if(srcT&&tgtT&&srcT!==tgtT){
          if(srcT.deadline!==tgtT.deadline){
            if(srcT.updateFn)srcT.updateFn(tgtT.deadline);
          }else{
            // Same day: reorder using precise insert position
            var wk=_wkoWK();
            var flatOrder=(_wkoLastWeekTasks||[]).map(function(t){return String(t.id);});
            var si=flatOrder.indexOf(srcTid);
            if(si!==-1){
              flatOrder.splice(si,1);
              var newTi=flatOrder.indexOf(tgtTid);
              if(newTi!==-1){
                if(!drag.insertBefore)newTi++;
                flatOrder.splice(newTi,0,srcTid);
                _wkoTaskOrder[wk]=flatOrder;_wkoSave();_wkoRenderRpanel();
              }
            }
          }
        }
      }else{
        // Non-deadline reorder
        var srcDs2=srcCard.dataset.ds,tgtDs2=dc.dataset.ds;
        var srcIdx=parseInt(srcCard.dataset.idx),tgtIdx=parseInt(dc.dataset.idx);
        if(srcSec===tgtSec&&srcDs2===tgtDs2&&srcIdx!==tgtIdx){
          if(srcSec==='tasks'&&srcDs2){
            var arr=(_wkoDT[srcDs2]||[]).slice();
            var itm=arr.splice(srcIdx,1)[0];
            arr.splice(drag.insertBefore?tgtIdx:Math.min(tgtIdx+1,arr.length),0,itm);
            _wkoDT[srcDs2]=arr;_wkoSave();_wkoRenderRpanel();
          }else if(srcSec==='standalone'){
            var pend=(standaloneTasks||[]).filter(function(t){return !t.done;});
            var done2=(standaloneTasks||[]).filter(function(t){return t.done;});
            var moved=pend.splice(srcIdx,1)[0];
            pend.splice(drag.insertBefore?tgtIdx:Math.min(tgtIdx+1,pend.length),0,moved);
            standaloneTasks=pend.concat(done2);_pass.standaloneTasks=standaloneTasks;
            saveData2();_wkoRenderRpanel();
          }
        }
      }
    }else if(slot){
      var dcol=slot.closest('.wko-dcol');
      if(dcol){
        var grid=dcol.parentElement;
        var dcols=Array.from(grid.querySelectorAll(':scope > .wko-dcol'));
        var dayIdx=dcols.indexOf(dcol);
        var days=_wkoGetDays();
        if(dayIdx>=0&&dayIdx<days.length){
          {
            // Always create time block when dropping on a time slot
            var hgrid=slot.parentElement;
            var slots=Array.from(hgrid.querySelectorAll('.wko-slot'));
            var slotIdx=slots.indexOf(slot);
            var hour=HSW+slotIdx;
            var ds=fmt(days[dayIdx]);
            if(!_wkoDB[ds])_wkoDB[ds]=[];
            _wkoDB[ds].push({id:Date.now(),title:drag.text,start:_wkoFT(hour,0),end:_wkoFT(Math.min(hour+1,HEW),0),color:drag.color||'#1A6FD4',sub:''});
            _wkoDB[ds].sort(function(a,b){return(a.start||'')<(b.start||'')?-1:1;});
            // If the dragged card has a deadline updateFn, also move its deadline to this day
            if(drag.updateFn)drag.updateFn(ds);
            _wkoSave();_wkoRenderGrid();
          }
        }
      }
    }
  }

  // ── MONTH GOALS & REMINDERS ───────────────────────────────────
  function _monthKey(){return curYear+'-'+String(curMonth+1).padStart(2,'0');}

  function _sidebarCelebrate(container){
    var cols=['#E8A020','#1A6FD4','#27AE72','#8B5CF6','#D4537E'];
    for(var i=0;i<14;i++){(function(ci){
      setTimeout(function(){
        var dot=document.createElement('div');dot.className='cal-month-dot';
        dot.style.cssText='left:'+(5+Math.random()*90)+'%;top:4px;background:'+cols[ci%cols.length]+';animation-delay:0ms;';
        container.appendChild(dot);setTimeout(function(){dot.remove();},800);
      },ci*35);
    })(i);}

  function renderMonthGoals(){
    var wrap=document.getElementById('monthGoalsList');if(!wrap)return;
    wrap.innerHTML='';
    var mk=_monthKey();
    var goals=monthGoals[mk]||[];
    goals.forEach(function(g,i){
      var item=document.createElement('div');item.className='cal-month-item';
      var chk=document.createElement('div');chk.className='cal-month-chk'+(g.done?' done':'');
      if(g.done)chk.innerHTML='<svg width="8" height="8" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
      chk.onclick=(function(ii){return function(){
        var arr=monthGoals[mk]||[];if(!arr[ii])return;
        arr[ii]=Object.assign({},arr[ii],{done:!arr[ii].done});
        saveData();renderMonthGoals();
      };})(i);
      var txt=document.createElement('div');txt.className='cal-month-text'+(g.done?' done':'');txt.textContent=g.text;
      txt.title='Clic para editar';txt.style.cursor='text';
      txt.onclick=(function(ii,gtext){return function(){
        var inp=document.createElement('input');inp.className='cal-month-inp';inp.value=gtext;inp.style.cssText='flex:1;margin:0;';
        txt.replaceWith(inp);inp.focus();inp.select();
        var save=function(){
          var v=inp.value.trim();if(!v){inp.replaceWith(txt);return;}
          var arr=monthGoals[mk]||[];if(!arr[ii])return;
          arr[ii]=Object.assign({},arr[ii],{text:v});
          saveData();renderMonthGoals();
        };
        inp.onblur=save;
        inp.onkeydown=function(e){if(e.key==='Enter'){inp.onblur=null;save();}if(e.key==='Escape'){inp.onblur=null;inp.replaceWith(txt);}};
      };})(i,g.text);
      var del=document.createElement('button');del.className='cal-month-del';del.textContent='×';
      del.onclick=(function(ii){return function(){
        var arr=(monthGoals[mk]||[]).slice();arr.splice(ii,1);
        monthGoals[mk]=arr;saveData();renderMonthGoals();
      };})(i);
      item.appendChild(chk);item.appendChild(txt);item.appendChild(del);
      wrap.appendChild(item);
    });
    if(goals.length&&goals.every(function(g){return g.done;})){
      var done=document.createElement('div');done.className='cal-month-all-done';done.textContent='¡Mes cumplido! 🎉';wrap.appendChild(done);
      var sec=document.getElementById('monthGoalsList').closest('.cal-month-sec');
      if(sec)_sidebarCelebrate(sec);
    }
    if(_mgInputOpen){
      var iw=document.createElement('div');iw.className='cal-month-inp-wrap';
      var inp=document.createElement('input');inp.className='cal-month-inp';inp.placeholder='Nuevo objetivo…';
      var ok=document.createElement('button');ok.className='cal-month-inp-ok';ok.textContent='↵';
      var doAdd=function(){
        var v=inp.value.trim();if(!v)return;
        if(!monthGoals[mk])monthGoals[mk]=[];
        monthGoals[mk].push({id:Date.now(),text:v,done:false});
        _mgInputOpen=false;saveData();renderMonthGoals();
      };
      inp.onkeydown=function(e){if(e.key==='Enter')doAdd();if(e.key==='Escape'){_mgInputOpen=false;renderMonthGoals();}};
      ok.onclick=doAdd;iw.appendChild(inp);iw.appendChild(ok);wrap.appendChild(iw);
      setTimeout(function(){inp.focus();},30);
    }
    var addBtn=document.getElementById('btnAddMonthGoal');
    if(addBtn)addBtn.style.display=_mgInputOpen?'none':'';
  }

  function renderMonthReminders(){
    var wrap=document.getElementById('monthRemsList');if(!wrap)return;
    wrap.innerHTML='';
    var mk=_monthKey();
    var rems=monthReminders[mk]||[];
    rems.forEach(function(r,i){
      var item=document.createElement('div');item.className='cal-month-item';
      var chk=document.createElement('div');chk.className='cal-month-chk'+(r.done?' done':'');
      if(r.done)chk.innerHTML='<svg width="8" height="8" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
      chk.onclick=(function(ii){return function(){
        var arr=monthReminders[mk]||[];if(!arr[ii])return;
        arr[ii]=Object.assign({},arr[ii],{done:!arr[ii].done});
        saveData();renderMonthReminders();
      };})(i);
      var txt=document.createElement('div');txt.className='cal-month-text'+(r.done?' done':'');txt.textContent=r.text;
      txt.title='Clic para editar';txt.style.cursor='text';
      txt.onclick=(function(ii,rtext){return function(){
        var inp=document.createElement('input');inp.className='cal-month-inp';inp.value=rtext;inp.style.cssText='flex:1;margin:0;';
        txt.replaceWith(inp);inp.focus();inp.select();
        var save=function(){
          var v=inp.value.trim();if(!v){inp.replaceWith(txt);return;}
          var arr=monthReminders[mk]||[];if(!arr[ii])return;
          arr[ii]=Object.assign({},arr[ii],{text:v});
          saveData();renderMonthReminders();
        };
        inp.onblur=save;
        inp.onkeydown=function(e){if(e.key==='Enter'){inp.onblur=null;save();}if(e.key==='Escape'){inp.onblur=null;inp.replaceWith(txt);}};
      };})(i,r.text);
      var del=document.createElement('button');del.className='cal-month-del';del.textContent='×';
      del.onclick=(function(ii){return function(){
        var arr=(monthReminders[mk]||[]).slice();arr.splice(ii,1);
        monthReminders[mk]=arr;saveData();renderMonthReminders();
      };})(i);
      item.appendChild(chk);item.appendChild(txt);item.appendChild(del);
      wrap.appendChild(item);
    });
    if(_mrInputOpen){
      var iw=document.createElement('div');iw.className='cal-month-inp-wrap';
      var inp=document.createElement('input');inp.className='cal-month-inp';inp.placeholder='Nuevo recordatorio…';
      var ok=document.createElement('button');ok.className='cal-month-inp-ok';ok.textContent='↵';
      var doAdd=function(){
        var v=inp.value.trim();if(!v)return;
        var mk2=_monthKey();
        if(!monthReminders[mk2])monthReminders[mk2]=[];
        monthReminders[mk2].push({id:Date.now(),text:v,done:false});
        _mrInputOpen=false;saveData();renderMonthReminders();
      };
      inp.onkeydown=function(e){if(e.key==='Enter')doAdd();if(e.key==='Escape'){_mrInputOpen=false;renderMonthReminders();}};
      ok.onclick=doAdd;iw.appendChild(inp);iw.appendChild(ok);wrap.appendChild(iw);
      setTimeout(function(){inp.focus();},30);
    }
    var addBtn=document.getElementById('btnAddMonthRem');
    if(addBtn)addBtn.style.display=_mrInputOpen?'none':'';
  }

  window.openMonthGoalInput=function(){_mgInputOpen=true;renderMonthGoals();};
  window.openMonthRemInput=function(){_mrInputOpen=true;renderMonthReminders();};

  // ── INIT ──────────────────────────────────────────────────────
  DOC.onSnapshot(function(snap){
    if(snap.exists){
      var d=snap.data();
      _pass=Object.assign({},d);
      if(d.projects&&d.projects.length) projects=d.projects;
      if(d.categories&&d.categories.length) categories=d.categories;
      if(d.standaloneTasks) standaloneTasks=d.standaloneTasks;
      if(d.calendarEvents) calendarEvents=d.calendarEvents;
      if(d.calCategories&&d.calCategories.length) calCategories=d.calCategories;
      if(d.dailyPriorities) dailyPriorities=d.dailyPriorities;
      if(d.monthGoals) monthGoals=d.monthGoals;
      if(d.monthReminders) monthReminders=d.monthReminders;
      // Don't overwrite weekPlans while the planner is open — doing so breaks
      // the object references held by the exercise/class input closures, causing
      // typed times to be lost before Apply is clicked.
      if(d.weekPlans && !_wkoW) weekPlans=d.weekPlans;
      if(d.dailyBlocks && _wkoW){_wkoDB=JSON.parse(JSON.stringify(d.dailyBlocks));_wkoRenderGrid && _wkoRenderGrid();}
      if(d.dayTasks && _wkoW){_wkoDT=JSON.parse(JSON.stringify(d.dayTasks||{}));}
      if(d.weekGoals){_wkoGoals=JSON.parse(JSON.stringify(d.weekGoals));}
      if(d.weekTaskOrder){_wkoTaskOrder=JSON.parse(JSON.stringify(d.weekTaskOrder));}
      if(d.mealPlan){_wkoMealPlan=JSON.parse(JSON.stringify(d.mealPlan));}
      if(_wkoW){_wkoRenderRpanel && _wkoRenderRpanel();}
    }
    render();
    if(selectedDate&&curView!=='day') renderDayEvents(selectedDate);
    if(!_wkoW&&window.location.search.indexOf('week=1')>-1){history.replaceState(null,'',location.pathname);openWeekPlanner();}
  },function(e){console.warn('Error:',e);render();});

})();
</script>
<script>
// Fix iOS Safari 100vh — set --vh to actual inner height, re-render on change
(function(){
  function _setVh(){document.documentElement.style.setProperty('--vh',window.innerHeight+'px');}
  _setVh();
  var _rvt=null;
  window.addEventListener('resize',function(){
    _setVh();
    clearTimeout(_rvt);
    _rvt=setTimeout(function(){if(typeof render==='function')render();},120);
  });
  // Also re-render once the page is fully painted (handles Safari initial layout delay)
  window.addEventListener('load',function(){_setVh();setTimeout(function(){if(typeof render==='function')render();},80);});
})();
</script>

<!-- MINI FOCUS TIMER -->
<script>
(function(){
  var SK='trazzo_focus_session';
  var _el=null,_int=null;
  function _fmt(sec){var s=Math.max(0,sec);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
  function _read(){try{return JSON.parse(localStorage.getItem(SK)||'null');}catch(e){return null;}}
  function _write(s){if(!s||s.remaining<=0){localStorage.removeItem(SK);return;}localStorage.setItem(SK,JSON.stringify(s));}
  function _hide(){if(_int){clearInterval(_int);_int=null;}if(_el){_el.remove();_el=null;}}
  function _startTick(){
    if(_int)clearInterval(_int);
    _int=setInterval(function(){
      var s=_read();if(!s||!s.running){clearInterval(_int);_int=null;if(_el){var pp=document.getElementById('_mfpp');if(pp)pp.textContent='▶';}return;}
      s.remaining--;s.ts=Date.now();_write(s);
      var tEl=document.getElementById('_mft');if(tEl)tEl.textContent=_fmt(s.remaining);
      if(s.remaining<=0){clearInterval(_int);_int=null;_hide();}
    },1000);
  }
  function _render(){
    var sess=_read();if(!sess||sess.remaining<=0){_hide();return;}
    if(sess.running&&sess.ts){var el=Math.floor((Date.now()-sess.ts)/1000);if(el>0){sess.remaining=Math.max(0,sess.remaining-el);sess.ts=Date.now();_write(sess);if(sess.remaining<=0){_hide();return;}}}
    if(!_el){
      _el=document.createElement('div');
      _el.style.cssText='position:fixed;top:12px;right:14px;z-index:99999;display:flex;align-items:center;gap:7px;background:#1a1a1a;border:0.5px solid rgba(232,160,32,0.4);border-radius:20px;padding:6px 8px 6px 12px;font-family:Inter,sans-serif;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.7);user-select:none;';
      _el.innerHTML='<span style="font-size:12px;color:#E8A020;font-weight:700;">⚡</span><span id="_mfn" style="max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:500;color:rgba(255,255,255,0.55);"></span><span id="_mft" style="font-size:12px;font-weight:700;color:#E8A020;font-variant-numeric:tabular-nums;min-width:40px;text-align:right;"></span><button id="_mfpp" style="background:rgba(255,255,255,0.07);border:none;color:rgba(255,255,255,0.5);font-size:12px;cursor:pointer;border-radius:10px;padding:2px 8px;font-family:Inter,sans-serif;line-height:1.7;" title="Pausa/Reanudar">⏸</button><button id="_mfst" style="background:none;border:none;color:rgba(255,255,255,0.25);font-size:16px;cursor:pointer;padding:0 4px;line-height:1;" title="Detener">×</button>';
      document.body.appendChild(_el);
      _el.addEventListener('click',function(e){if(e.target.tagName!=='BUTTON')location.href='focus.html';});
      document.getElementById('_mfpp').addEventListener('click',function(e){e.stopPropagation();_toggle();});
      document.getElementById('_mfst').addEventListener('click',function(e){e.stopPropagation();localStorage.removeItem(SK);_hide();});
    }
    document.getElementById('_mfn').textContent=sess.taskText||'';
    document.getElementById('_mft').textContent=_fmt(sess.remaining);
    document.getElementById('_mfpp').textContent=sess.running?'⏸':'▶';
    if(sess.running&&!_int)_startTick();else if(!sess.running&&_int){clearInterval(_int);_int=null;}
  }
  function _toggle(){var s=_read();if(!s)return;s.running=!s.running;s.ts=Date.now();_write(s);var pp=document.getElementById('_mfpp');if(pp)pp.textContent=s.running?'⏸':'▶';if(s.running)_startTick();else if(_int){clearInterval(_int);_int=null;}}
  _render();
})();
</script>
