<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="stylesheet" href="theme.css">
<title>Calendario — Dcoder Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#0c0c0c;color:#fff;font-family:'Inter',sans-serif;overflow:hidden;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:52px;border-bottom:0.5px solid rgba(255,255,255,0.06);flex-shrink:0;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-pill{background:#fff;color:#0c0c0c;font-size:11px;font-weight:800;padding:5px 10px;border-radius:8px;}
.logo-name{font-size:14px;font-weight:700;letter-spacing:.04em;}
.nav-btn{background:none;border:none;color:rgba(255,255,255,0.32);font-size:12px;font-weight:500;padding:6px 14px;border-radius:20px;cursor:pointer;font-family:'Inter',sans-serif;transition:background .15s,color .15s;}
.nav-btn:hover{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.78);}
.nav-btn.active{background:rgba(255,255,255,0.11);color:#fff;font-weight:600;}
.cal-wrap{display:flex;height:calc(100vh - 52px);overflow:hidden;}
/* SIDEBAR */
.cal-sidebar{width:220px;flex-shrink:0;border-right:0.5px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;gap:0;overflow-y:auto;padding:20px 16px 16px;}
.cal-sidebar::-webkit-scrollbar{width:3px;}
.cal-sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);}
.cal-new-btn{background:#fff;color:#0c0c0c;border:none;font-size:12px;font-weight:700;padding:9px 16px;border-radius:12px;cursor:pointer;font-family:'Inter',sans-serif;width:100%;text-align:left;margin-bottom:20px;display:flex;align-items:center;gap:6px;}
.cal-new-btn:hover{background:#e8e8e8;}
/* MINI CALENDAR */
.mini-cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.mini-cal-lbl{font-size:11px;font-weight:700;color:rgba(255,255,255,0.55);}
.mini-nav-btn{background:none;border:none;color:rgba(255,255,255,0.3);cursor:pointer;font-size:15px;line-height:1;padding:2px 5px;border-radius:4px;}
.mini-nav-btn:hover{color:#fff;}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
.mini-wday{text-align:center;font-size:8px;font-weight:700;color:rgba(255,255,255,0.22);padding:3px 0;text-transform:uppercase;}
.mini-day{text-align:center;font-size:10px;color:rgba(255,255,255,0.45);padding:4px 2px;border-radius:5px;cursor:pointer;transition:all .12s;position:relative;}
.mini-day:hover{background:rgba(255,255,255,0.08);color:#fff;}
.mini-day.today{color:#fff;font-weight:700;}
.mini-day.today::after{content:'';position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#1A6FD4;}
.mini-day.selected{background:rgba(255,255,255,0.14);color:#fff;font-weight:700;}
.mini-day.other-month{color:rgba(255,255,255,0.15);}
.mini-day.has-events::before{content:'';position:absolute;top:1px;right:2px;width:3px;height:3px;border-radius:50%;background:#E8A020;}
/* CATEGORIES SIDEBAR */
.cat-section{margin-top:18px;}
.cat-section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.cat-section-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,0.2);}
.cat-add-btn{background:none;border:none;color:rgba(255,255,255,0.2);font-size:16px;cursor:pointer;padding:0;line-height:1;transition:color .15s;}
.cat-add-btn:hover{color:rgba(255,255,255,0.6);}
.cat-item{display:flex;align-items:center;gap:7px;font-size:11px;color:rgba(255,255,255,0.45);padding:4px 6px;border-radius:7px;cursor:pointer;transition:background .12s;}
.cat-item:hover{background:rgba(255,255,255,0.05);color:#fff;}
.cat-item.active{background:rgba(255,255,255,0.07);color:#fff;}
.cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.cat-count{margin-left:auto;font-size:9px;color:rgba(255,255,255,0.2);}
/* DAILY PRIORITIES SIDEBAR */
.prio-section{margin-top:16px;padding-top:14px;border-top:0.5px solid rgba(255,255,255,0.06);}
.prio-section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.prio-section-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,0.2);}
.prio-date-lbl{font-size:9px;color:rgba(255,255,255,0.18);margin-bottom:6px;}
.prio-add-btn{background:none;border:none;color:rgba(255,255,255,0.2);font-size:16px;cursor:pointer;padding:0;line-height:1;transition:color .15s;}
.prio-add-btn:hover{color:rgba(255,255,255,0.55);}
.prio-item{display:flex;align-items:flex-start;gap:6px;padding:4px 0;border-bottom:0.5px solid rgba(255,255,255,0.04);}
.prio-item:last-of-type{border-bottom:none;}
.prio-check{width:15px;height:15px;border-radius:4px;border:1.5px solid rgba(255,255,255,0.2);background:transparent;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:1px;}
.prio-check.done{border-color:#27AE72;background:#27AE72;}
.prio-text{font-size:11px;color:rgba(255,255,255,0.7);flex:1;line-height:1.4;word-break:break-word;}
.prio-text.done{color:rgba(255,255,255,0.22);text-decoration:line-through;}
.prio-del{background:none;border:none;color:rgba(255,255,255,0.1);font-size:13px;cursor:pointer;padding:0 2px;line-height:1;flex-shrink:0;transition:color .15s;}
.prio-del:hover{color:rgba(226,75,74,0.7);}
.prio-input-wrap{display:flex;gap:5px;margin-top:7px;}
.prio-input{flex:1;background:#1e1e1e;border:0.5px solid rgba(255,255,255,0.1);border-radius:7px;padding:5px 8px;font-size:11px;color:#fff;font-family:Inter,sans-serif;outline:none;}
.prio-input:focus{border-color:rgba(255,255,255,0.3);}
.prio-input::placeholder{color:rgba(255,255,255,0.18);}
.prio-input-ok{background:rgba(255,255,255,0.08);border:none;color:#fff;font-size:12px;border-radius:7px;padding:0 9px;cursor:pointer;font-family:Inter,sans-serif;line-height:28px;}
.prio-input-ok:hover{background:rgba(255,255,255,0.15);}
/* MAIN AREA */
.cal-main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.cal-nav-bar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;border-bottom:0.5px solid rgba(255,255,255,0.06);flex-shrink:0;}
.view-toggle{display:flex;background:rgba(255,255,255,0.05);border-radius:8px;padding:2px;gap:2px;}
.view-btn{background:none;border:none;color:rgba(255,255,255,0.35);font-size:11px;font-weight:600;padding:5px 12px;border-radius:6px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
.view-btn.active{background:#fff;color:#0c0c0c;}
.cal-nav-center{display:flex;align-items:center;gap:10px;}
.cal-period{font-size:15px;font-weight:700;letter-spacing:-.01em;min-width:200px;text-align:center;}
.cal-arrow{background:none;border:0.5px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.5);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.cal-arrow:hover{border-color:rgba(255,255,255,0.3);color:#fff;}
.cal-today-btn{background:none;border:0.5px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.55);font-size:11px;font-weight:600;padding:5px 12px;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
.cal-today-btn:hover{border-color:rgba(255,255,255,0.3);color:#fff;}
/* MEMBER FILTER BAR */
.member-bar{display:flex;align-items:center;gap:6px;padding:7px 20px;border-bottom:0.5px solid rgba(255,255,255,0.06);flex-shrink:0;overflow-x:auto;}
.member-bar::-webkit-scrollbar{display:none;}
.member-bar-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,0.18);margin-right:2px;white-space:nowrap;flex-shrink:0;}
.member-chip{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.08);border-radius:20px;padding:3px 10px 3px 4px;cursor:pointer;font-size:11px;font-weight:600;color:rgba(255,255,255,0.38);transition:all .15s;white-space:nowrap;flex-shrink:0;}
.member-chip.active{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);color:#fff;}
.member-chip .av{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;flex-shrink:0;}
/* MONTH GRID */
.cal-grid-wrap{flex:1;overflow-y:auto;padding:0;}
.cal-grid-wrap::-webkit-scrollbar{width:4px;}
.cal-grid-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px;}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);height:100%;}
.month-hdr{text-align:center;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,0.25);padding:8px 0;border-bottom:0.5px solid rgba(255,255,255,0.06);background:#0c0c0c;position:sticky;top:0;z-index:10;}
.month-day{border-right:0.5px solid rgba(255,255,255,0.05);border-bottom:0.5px solid rgba(255,255,255,0.05);padding:8px 7px 6px;cursor:pointer;min-height:100px;transition:background .1s;display:flex;flex-direction:column;gap:3px;}
.month-day:hover{background:rgba(255,255,255,0.025);}
.month-day.today{background:rgba(26,111,212,0.07);}
.month-day.today .month-day-num{color:#5B9FFF;font-weight:700;}
.month-day.selected{background:rgba(255,255,255,0.05);}
.month-day.other-month{opacity:.35;}
.month-day-num{font-size:12px;font-weight:500;color:rgba(255,255,255,0.6);line-height:1;margin-bottom:3px;}
.month-day.today .month-day-num{width:20px;height:20px;background:#1A6FD4;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
/* EVENT CHIPS */
.ev-chip{font-size:9px;font-weight:600;padding:2px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:opacity .12s;line-height:1.4;border-left:2.5px solid transparent;}
.ev-chip:hover{opacity:.8;}
.ev-more{font-size:9px;color:rgba(255,255,255,0.3);padding:1px 6px;cursor:pointer;}
.ev-more:hover{color:rgba(255,255,255,0.6);}
.ev-chip-delivery{background:rgba(26,111,212,.15)!important;border-left-color:#1A6FD4!important;color:#5AB4E8!important;}
.ev-chip-task{background:rgba(232,160,32,.15)!important;border-left-color:#E8A020!important;color:#E8A020!important;}
.ev-chip-reminder{background:rgba(39,174,114,.15)!important;border-left-color:#27AE72!important;color:#27AE72!important;}
.ev-chip-event{background:rgba(139,92,246,.15)!important;border-left-color:#8B5CF6!important;color:#8B5CF6!important;}
/* WEEK GRID */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);height:100%;}
.week-col{border-right:0.5px solid rgba(255,255,255,0.05);display:flex;flex-direction:column;overflow:hidden;}
.week-col-hdr{padding:10px 10px 8px;border-bottom:0.5px solid rgba(255,255,255,0.06);flex-shrink:0;cursor:pointer;transition:background .12s;}
.week-col-hdr:hover{background:rgba(255,255,255,0.03);}
.week-day-name{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,0.25);}
.week-day-num{font-size:22px;font-weight:800;letter-spacing:-.02em;color:rgba(255,255,255,0.7);line-height:1.1;margin-top:2px;}
.week-col.today .week-day-num{color:#5B9FFF;}
.week-col.selected .week-col-hdr{background:rgba(255,255,255,0.04);}
.week-events{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:5px;}
.week-events::-webkit-scrollbar{width:2px;}
.week-ev-card{border-radius:7px;padding:6px 8px;cursor:pointer;border-left:3px solid transparent;transition:opacity .12s;font-size:11px;}
.week-ev-card:hover{opacity:.8;}
.week-ev-title{font-weight:600;color:rgba(255,255,255,0.88);margin-bottom:1px;}
.week-ev-sub{font-size:9px;color:rgba(255,255,255,0.38);}
/* DAY VIEW */
.day-view-outer{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.day-allday-strip{border-bottom:0.5px solid rgba(255,255,255,0.06);padding:6px 10px 6px 64px;display:flex;gap:5px;flex-wrap:wrap;min-height:34px;align-items:center;flex-shrink:0;}
.day-allday-lbl{font-size:9px;color:rgba(255,255,255,0.18);white-space:nowrap;margin-right:2px;}
.day-allday-ev{font-size:10px;font-weight:600;padding:2px 9px;border-radius:20px;cursor:pointer;transition:opacity .12s;}
.day-allday-ev:hover{opacity:.8;}
.day-hour-scroll{flex:1;overflow-y:auto;position:relative;}
.day-hour-scroll::-webkit-scrollbar{width:4px;}
.day-hour-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px;}
.day-hour-grid{position:relative;}
.hour-row{display:flex;align-items:flex-start;height:64px;border-bottom:0.5px solid rgba(255,255,255,0.04);}
.hour-label{width:58px;flex-shrink:0;font-size:10px;color:rgba(255,255,255,0.2);font-weight:500;padding:0 10px 0 0;text-align:right;margin-top:-7px;user-select:none;}
.hour-slot{flex:1;position:relative;height:100%;cursor:pointer;}
.hour-slot:hover{background:rgba(255,255,255,0.015);}
.hour-half{position:absolute;top:50%;left:0;right:0;border-top:0.5px solid rgba(255,255,255,0.03);pointer-events:none;}
.now-dot{position:absolute;left:50px;width:10px;height:10px;border-radius:50%;background:#E24B4A;z-index:12;pointer-events:none;transform:translateY(-4px);}
.now-line{position:absolute;left:60px;right:0;height:1.5px;background:#E24B4A;z-index:12;pointer-events:none;}
.day-ev-block{position:absolute;left:62px;right:10px;border-radius:9px;padding:5px 9px;cursor:pointer;overflow:hidden;border-left:3px solid transparent;transition:opacity .12s;z-index:5;}
.day-ev-block:hover{opacity:.82;}
.day-ev-time-lbl{font-size:9px;font-weight:600;opacity:.7;margin-bottom:1px;}
.day-ev-title{font-size:11px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.day-ev-sub{font-size:9px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
/* DAY PANEL */
.cal-day-panel{width:0;border-left:0.5px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;overflow:hidden;transition:width .25s;flex-shrink:0;}
.cal-day-panel.open{width:280px;}
.cdp-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;border-bottom:0.5px solid rgba(255,255,255,0.06);flex-shrink:0;}
.cdp-date{font-size:14px;font-weight:700;}
.cdp-close{background:none;border:none;color:rgba(255,255,255,0.3);font-size:18px;cursor:pointer;padding:0 4px;line-height:1;}
.cdp-close:hover{color:#fff;}
.cdp-events-wrap{flex:1;overflow-y:auto;padding:12px;}
.cdp-events-wrap::-webkit-scrollbar{width:3px;}
.cdp-events-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);}
.cdp-section-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,0.22);margin-bottom:8px;margin-top:14px;}
.cdp-section-lbl:first-child{margin-top:0;}
.cdp-event-row{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,0.04);margin-bottom:5px;cursor:pointer;transition:background .12s;}
.cdp-event-row:hover{background:rgba(255,255,255,0.07);}
.cdp-ev-info{flex:1;min-width:0;}
.cdp-ev-title{font-size:12px;font-weight:600;color:rgba(255,255,255,0.85);margin-bottom:2px;line-height:1.3;}
.cdp-ev-sub{font-size:10px;color:rgba(255,255,255,0.35);}
.cdp-empty{text-align:center;color:rgba(255,255,255,0.18);font-size:11px;padding:28px 0;}
.cdp-actions{padding:12px;border-top:0.5px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;gap:7px;flex-shrink:0;}
.cdp-btn{background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.6);font-size:11px;font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer;font-family:'Inter',sans-serif;text-align:left;transition:all .15s;width:100%;}
.cdp-btn:hover{background:rgba(255,255,255,0.1);color:#fff;}
/* EVENT MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);z-index:500;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.overlay.open{opacity:1;pointer-events:all;}
.modal{background:#161616;border:0.5px solid rgba(255,255,255,0.1);border-radius:20px;padding:26px;width:460px;max-width:94vw;display:flex;flex-direction:column;gap:14px;transform:translateY(8px);transition:transform .2s;max-height:90vh;overflow-y:auto;}
.modal::-webkit-scrollbar{width:3px;}
.modal::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);}
.overlay.open .modal{transform:none;}
.modal-title{font-size:15px;font-weight:700;}
.ml{font-size:10px;font-weight:700;color:rgba(255,255,255,0.3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px;}
.mi{background:#1e1e1e;border:0.5px solid rgba(255,255,255,0.1);border-radius:10px;padding:9px 13px;font-size:13px;color:#fff;font-family:'Inter',sans-serif;outline:none;width:100%;transition:border-color .15s;}
.mi:focus{border-color:rgba(255,255,255,0.3);}
.mi::placeholder{color:rgba(255,255,255,0.18);}
input[type=date].mi,input[type=time].mi{color-scheme:dark;cursor:pointer;}
input[type=date].mi::-webkit-calendar-picker-indicator,input[type=time].mi::-webkit-calendar-picker-indicator{filter:invert(0.5);cursor:pointer;opacity:.5;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}
.btn-c{background:rgba(255,255,255,0.07);border:none;color:rgba(255,255,255,0.45);font-size:12px;font-weight:600;padding:8px 16px;border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;}
.btn-ok{background:#fff;border:none;color:#0c0c0c;font-size:12px;font-weight:700;padding:8px 16px;border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;}
.ev-color-row{display:flex;gap:6px;flex-wrap:wrap;}
.ev-color-sw{width:22px;height:22px;border-radius:6px;border:2.5px solid transparent;cursor:pointer;transition:border .12s;}
.ev-color-sw.sel{border-color:#fff;}
.btn-del{background:rgba(226,75,74,0.1);border:0.5px solid rgba(226,75,74,0.25);color:#E24B4A;font-size:12px;font-weight:600;padding:8px 14px;border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;}
.btn-del:hover{background:rgba(226,75,74,0.2);}
/* MODAL CATEGORY PILLS */
.cat-select-row{display:flex;gap:5px;flex-wrap:wrap;}
.cat-select-pill{padding:4px 11px;border-radius:20px;font-size:10px;font-weight:700;cursor:pointer;border:1.5px solid transparent;background:none;font-family:Inter,sans-serif;transition:all .15s;}
.cat-select-pill.sel{border-color:currentColor;filter:brightness(1.2);}
/* ASSIGNEE CHIPS */
.assignee-row{display:flex;gap:5px;flex-wrap:wrap;}
.assignee-chip{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;cursor:pointer;border:1.5px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.45);font-family:Inter,sans-serif;transition:all .15s;}
.assignee-chip.sel{border-color:rgba(255,255,255,0.35);background:rgba(255,255,255,0.1);color:#fff;}
/* CATEGORY EDITOR OVERLAY */
.cat-edit-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);z-index:600;display:flex;align-items:center;justify-content:center;}
.cat-edit-panel{background:#181818;border:0.5px solid rgba(255,255,255,0.1);border-radius:18px;padding:22px 24px;width:min(94vw,380px);display:flex;flex-direction:column;gap:12px;font-family:Inter,sans-serif;}

<script>
(function(){

  });
  var db = firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(function(){});
  var DOC = db.collection('workspace').doc('proyectos');

  // ── STATE ────────────────────────────────────────────────────
  var projects=[], categories=[], standaloneTasks=[], calendarEvents=[];
  var calCategories=[], dailyPriorities={}, weekPlans={};
  var _pass={};
  var _wpWeek=null; var _wpSelDay=null;
  var today=new Date(); today.setHours(0,0,0,0);
  var curView='month';

  var _evSelCat=null;
  var _evSelAssignee=null;
  var selectedMember=null;
  var selectedCatFilter=null;
  var _prioInputOpen=false;
  var _prioDate=null; // which date priorities we're showing

  var EV_COLORS=['#1A6FD4','#27AE72','#D4537E','#E8A020','#8B5CF6','#FF4642','#2CC5D2','#A5D63A','#FF8134','#C0436E'];
  var CAT_COLORS=['#1A6FD4','#27AE72','#D4537E','#E8A020','#8B5CF6','#2CC5D2','#FF8134','#A5D63A'];
  var _newCatColor=CAT_COLORS[0];
  var MNS_LONG=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var MNS_SHORT=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var DAYS_L=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  var DAYS_S=['Lu','Ma','Mi','Ju','Vi','Sa','Do'];
  var DAYS_FULL=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  var HOUR_START=7, HOUR_END=23, HOUR_PX=64;

  var DEFAULT_CAL_CATS=[
    {id:'trabajo',  name:'Trabajo',        color:'#1A6FD4'},
    {id:'diseno',   name:'Diseño',         color:'#8B5CF6'},
    {id:'reunion',  name:'Reunión',        color:'#27AE72'},
    {id:'personal', name:'Personal',       color:'#E8A020'},
    {id:'admin',    name:'Administración', color:'#D4537E'}
  ];

  function getCalCats(){return(calCategories&&calCategories.length)?calCategories:DEFAULT_CAL_CATS.map(function(c){return Object.assign({},c);});}
  function getTeamMembers(){
    if(_pass.teamMembers&&_pass.teamMembers.length) return _pass.teamMembers;
    return ['Ignacio','Alejandra','Roberto','Yo'];
  }
  function memberColor(name){
    var cols=['#1A6FD4','#27AE72','#D4537E','#E8A020','#8B5CF6','#2CC5D2'];
    var s=0; for(var i=0;i<name.length;i++) s+=name.charCodeAt(i);
    return cols[s%cols.length];
  }
  function memberInitials(name){
    var p=name.trim().split(' ');
    return p.length>=2?(p[0][0]+p[1][0]).toUpperCase():name.slice(0,2).toUpperCase();
  }

  // ── SAVE ────────────────────────────────────────────────────
  function saveData(){
    var p=Object.assign({},_pass,{calendarEvents:calendarEvents,calCategories:calCategories,dailyPriorities:dailyPriorities});
    DOC.set(p).catch(function(e){console.warn('Save error:',e);});
  }
  function saveData2(){saveData();}

  // ── HELPERS ──────────────────────────────────────────────────
  function getCat(id){for(var i=0;i<categories.length;i++){if(categories[i].id===id)return categories[i];}return null;}
  function getWeekStart(d){var r=new Date(d);r.setHours(0,0,0,0);var dow=r.getDay();var diff=(dow===0?-6:1-dow);r.setDate(r.getDate()+diff);return r;}
  function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function parse(s){return new Date(s+'T00:00:00');}
  function sameDay(a,b){return fmt(a)===fmt(b);}
  function addDays(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r;}

  // ── EVENT COLLECTION ──────────────────────────────────────────
  function getAllEvents(){
    var evs=[];
    projects.forEach(function(p){
      if(!p.deadline) return;
      if(p.catId==='cotizaciones') return;
      var cat=getCat(p.catId);
      evs.push({id:'proj_'+p.id,date:p.deadline,title:p.name,sub:p.client||'',color:cat?cat.color:'#1A6FD4',type:'delivery',icon:'📦'});
    });
    projects.forEach(function(p){
      if(!p.stageTasks) return;
      if(p.catId==='cotizaciones') return;
      var cat=getCat(p.catId);
      var stage=p.stage;
      var tasks=p.stageTasks[stage]||[];
      tasks.forEach(function(t){
        if(t.deadline&&!t.done) evs.push({id:'task_'+t.id,date:t.deadline,title:t.text,sub:p.name+' · '+stage,color:cat?cat.color:'#E8A020',type:'task',icon:'✓',projId:p.id,stage:stage,taskId:t.id});
      });
    });
    standaloneTasks.forEach(function(t){
      if(t.deadline&&!t.done) evs.push({id:'st_'+t.id,date:t.deadline,title:t.text,sub:'Tarea libre',color:'#E8A020',type:'task',icon:'✓',taskId:t.id,isStandalone:true,resp:t.resp||''});
    });
    return evs;
  }

  function getCustomEventsFor(dateStr){
    var result=[];
    calendarEvents.forEach(function(ev){
      if(ev.date===dateStr){result.push(ev);return;}
      if(!ev.repeat||ev.repeat==='none') return;
      var base=parse(ev.date),target=parse(dateStr);
      if(base>target) return;
      var match=false;
      switch(ev.repeat){
        case 'daily':match=true;break;
        case 'weekly':match=(Math.round((target-base)/86400000)%7===0);break;
        case 'monthly':match=(target.getDate()===base.getDate());break;
        case 'yearly':match=(target.getDate()===base.getDate()&&target.getMonth()===base.getMonth());break;
      }
      if(match) result.push(Object.assign({},ev,{date:dateStr,isRepeat:true}));
    });
    return result;
  }

  function getEventsForDate(dateStr){
    var base=getAllEvents().filter(function(e){return e.date===dateStr;});
    var calEvs=[];
    getCustomEventsFor(dateStr).forEach(function(ev){
      calEvs.push({id:'cal_'+ev.id+(ev.isRepeat?'_r':''),date:ev.date,title:ev.title,sub:ev.notes||'',color:ev.color||'#27AE72',type:ev.type||'reminder',icon:'🔔',calId:ev.id,isRepeat:ev.isRepeat,time:ev.time||'',catId:ev.catId||'',resp:ev.resp||''});
    });
    var calTaskKeys={};
    calEvs.forEach(function(e){if(e.type==='task') calTaskKeys[e.title+'|'+e.date]=true;});
    base=base.filter(function(e){
      if(e.id&&e.id.indexOf('st_')===0&&calTaskKeys[e.title+'|'+e.date]) return false;
      return true;
    });
    var evs=base.concat(calEvs);
    evs.sort(function(a,b){return(a.time||'99:99')<(b.time||'99:99')?-1:1;});
    return evs;
  }

  function applyFilters(evs){
    if(selectedMember){
      evs=evs.filter(function(ev){
        return (ev.resp&&ev.resp===selectedMember)||(ev.sub&&ev.sub.indexOf(selectedMember)>=0);
      });
    }
    if(selectedCatFilter){
      evs=evs.filter(function(ev){return ev.catId===selectedCatFilter;});
    }
    return evs;
  }

  // ── DAY VIEW ──────────────────────────────────────────────────
  function renderDay(){
    var d=curDayDate; var ds=fmt(d);
    document.getElementById('calPeriod').textContent=DAYS_FULL[d.getDay()]+', '+d.getDate()+' de '+MNS_LONG[d.getMonth()]+' '+d.getFullYear();
    // Close right panel in day view
    document.getElementById('calDayPanel').classList.remove('open');

    var grid=document.getElementById('calGrid'); grid.innerHTML='';
    grid.style.cssText='flex:1;display:flex;flex-direction:column;overflow:hidden;';

    // All-day strip
    var allDayStrip=document.createElement('div'); allDayStrip.className='day-allday-strip';
    var allDayLbl=document.createElement('span'); allDayLbl.className='day-allday-lbl'; allDayLbl.textContent='Todo el día';
    allDayStrip.appendChild(allDayLbl);
    grid.appendChild(allDayStrip);

    // Hour scroll
    var scroll=document.createElement('div'); scroll.className='day-hour-scroll'; scroll.id='dayHourScroll';
    var hourGrid=document.createElement('div'); hourGrid.className='day-hour-grid';
    hourGrid.style.minHeight=((HOUR_END-HOUR_START)*HOUR_PX)+'px';
    hourGrid.style.position='relative';

    for(var h=HOUR_START;h<HOUR_END;h++){
      var row=document.createElement('div'); row.className='hour-row';
      var lbl=document.createElement('div'); lbl.className='hour-label';
      lbl.textContent=String(h).padStart(2,'0')+':00';
      var slot=document.createElement('div'); slot.className='hour-slot';
      var half=document.createElement('div'); half.className='hour-half';
      slot.appendChild(half);
      (function(hour){
        slot.onclick=function(e){
          if(e.target!==slot&&e.target!==half) return;
          openEventModal(ds,null,null,String(hour).padStart(2,'0')+':00');
        };
      })(h);
      row.appendChild(lbl); row.appendChild(slot); hourGrid.appendChild(row);
    }

    // Now indicator
    var now=new Date();
    if(sameDay(d,today)){
      var nowH=now.getHours(),nowM=now.getMinutes();
      if(nowH>=HOUR_START&&nowH<HOUR_END){
        var nowTop=(nowH-HOUR_START)*HOUR_PX+(nowM/60)*HOUR_PX;
        var dot=document.createElement('div'); dot.className='now-dot'; dot.style.top=(nowTop-4)+'px';
        var line=document.createElement('div'); line.className='now-line'; line.style.top=nowTop+'px';
        hourGrid.appendChild(dot); hourGrid.appendChild(line);
      }
    }

    // Events
    var evs=applyFilters(getEventsForDate(ds));
    var allDayEvs=[],timedEvs=[];
    evs.forEach(function(ev){if(ev.time)timedEvs.push(ev);else allDayEvs.push(ev);});

    allDayEvs.forEach(function(ev){
      var typeClass={delivery:'ev-chip-delivery',task:'ev-chip-task',reminder:'ev-chip-reminder',event:'ev-chip-event'}[ev.type]||'ev-chip-reminder';
      var typeIcon={delivery:'📦',task:'✓',reminder:'🔔',event:'📅'}[ev.type]||'🔔';
      var chip=document.createElement('div'); chip.className='day-allday-ev '+typeClass;
      chip.textContent=typeIcon+' '+ev.title;
      chip.onclick=function(){if(ev.calId)openEventModal(ds,null,ev.calId);else if(ev.taskId)openCalTaskEdit(ev);};
      allDayStrip.appendChild(chip);
    });

    // Overlap grouping for timed events
    timedEvs.sort(function(a,b){return(a.time||'')<(b.time||'')?-1:1;});
    var groups=[];
    timedEvs.forEach(function(ev){
      var parts=(ev.time||'00:00').split(':');
      var h2=parseInt(parts[0]),m2=parseInt(parts[1]||0);
      var top=(h2-HOUR_START)*HOUR_PX+(m2/60)*HOUR_PX;
      var bottom=top+HOUR_PX;
      var placed=false;
      for(var g=0;g<groups.length;g++){
        var grp=groups[g];
        var overlap=false;
        for(var k=0;k<grp.length;k++){if(!(bottom<=grp[k].top||top>=grp[k].bottom)){overlap=true;break;}}
        if(!overlap){grp.push({ev:ev,top:top,bottom:bottom,col:grp.length});placed=true;break;}
      }
      if(!placed) groups.push([{ev:ev,top:top,bottom:bottom,col:0}]);
    });

    groups.forEach(function(grp){
      var n=grp.length;
      grp.forEach(function(item){
        var ev=item.ev;
        var typeColor={delivery:'#1A6FD4',task:'#E8A020',reminder:'#27AE72',event:'#8B5CF6'}[ev.type]||ev.color||'#27AE72';
        var block=document.createElement('div'); block.className='day-ev-block';
        var availW='calc(100% - 70px)';
        var wPct=Math.floor(100/n)+'%';
        var leftOff=60+(item.col*Math.floor((100/n)/100*1));
        block.style.top=item.top+'px';
        block.style.height=Math.max(24,item.bottom-item.top-2)+'px';
        block.style.left='calc(62px + '+item.col+'*((100% - 70px)/'+n+'))';
        block.style.right=((n-item.col-1)*(100/n))+'%';
        if(n===1){block.style.left='62px';block.style.right='10px';}
        block.style.background=typeColor+'22';
        block.style.borderLeftColor=typeColor;
        var timeLbl=document.createElement('div'); timeLbl.className='day-ev-time-lbl'; timeLbl.style.color=typeColor; timeLbl.textContent=ev.time;
        var titleEl=document.createElement('div'); titleEl.className='day-ev-title'; titleEl.style.color=typeColor; titleEl.textContent=ev.title;
        block.appendChild(timeLbl); block.appendChild(titleEl);
        if(ev.sub&&(item.bottom-item.top)>40){var subEl=document.createElement('div');subEl.className='day-ev-sub';subEl.style.color=typeColor;subEl.textContent=ev.sub;block.appendChild(subEl);}
        block.onclick=function(e){e.stopPropagation();if(ev.calId)openEventModal(ds,null,ev.calId);else if(ev.taskId)openCalTaskEdit(ev);};
        hourGrid.appendChild(block);
      });
    });

    scroll.appendChild(hourGrid); grid.appendChild(scroll);
    renderMiniCal();
    renderMemberBar();

    // Scroll to current/morning time
    setTimeout(function(){
      var sc=document.getElementById('dayHourScroll'); if(!sc)return;
      var scrollH=sameDay(d,today)?Math.max(0,(now.getHours()-HOUR_START-1)*HOUR_PX):(8-HOUR_START)*HOUR_PX;
      sc.scrollTop=scrollH;
    },40);
  }

  function renderPriorities(dateStr){

    var lbl=document.getElementById('prioDateLbl');

      check.onclick=(function(pid){return function(){togglePriority(pid);};})(p.id);

      var del=document.createElement('button'); del.className='prio-del'; del.textContent='×';

      var doAdd=function(){var v=inp.value.trim();if(!v)return;addPriority(v);};
      inp.onkeydown=function(e){if(e.key==='Enter'){doAdd();}else if(e.key==='Escape'){_prioInputOpen=false;renderPriorities(_prioDate);}};
      ok.onclick=doAdd;
      inputWrap.appendChild(inp); inputWrap.appendChild(ok); wrap.appendChild(inputWrap);
      setTimeout(function(){inp.focus();},50);

  window.openPriorityInput=function(){

  function addPriority(text){
    if(!_prioDate)_prioDate=fmt(today);
    if(!dailyPriorities[_prioDate])dailyPriorities[_prioDate]=[];
    dailyPriorities[_prioDate].push({id:Date.now(),text:text,done:false});
    _prioInputOpen=false;
    saveData();
    renderPriorities(_prioDate);
  }
  function togglePriority(id){
    var list=dailyPriorities[_prioDate]||[];
    dailyPriorities[_prioDate]=list.map(function(p){return p.id===id?Object.assign({},p,{done:!p.done}):p;});
    saveData();
    renderPriorities(_prioDate);
  }
  function deletePriority(id){
    dailyPriorities[_prioDate]=(dailyPriorities[_prioDate]||[]).filter(function(p){return p.id!==id;});
    saveData();
    renderPriorities(_prioDate);
  }

  // ── WEEKLY PLANNER ────────────────────────────────────────────
  function _getMondayOf(d){
    var r=new Date(d); r.setHours(0,0,0,0);
    var day=r.getDay(); r.setDate(r.getDate()-(day===0?6:day-1)); return r;
  }
  function _fmtWeekRange(mon){
    var sun=new Date(mon); sun.setDate(mon.getDate()+6);
    var M=MNS_SHORT;
    return mon.getDate()+' '+M[mon.getMonth()]+' – '+sun.getDate()+' '+M[sun.getMonth()]+' '+sun.getFullYear();
  }
  function _wpKey(){return fmt(_wpWeek);}
  function _wpGetDays(){
    var days=[]; for(var i=0;i<7;i++){var d=new Date(_wpWeek);d.setDate(d.getDate()+i);days.push(d);} return days;
  }
  function _wpDayData(ds){
    var k=_wpKey();
    if(!weekPlans[k])weekPlans[k]={};
    if(!weekPlans[k].days)weekPlans[k].days={};
    if(!weekPlans[k].days[ds])weekPlans[k].days[ds]={};
    var dd=weekPlans[k].days[ds];
    if(!dd.exercise)dd.exercise=[];
    if(!dd.food)dd.food={where:null,notes:''};
    if(!dd.classes)dd.classes=[];
    if(!dd.deliveries)dd.deliveries=[];
    return dd;
  }

    var titleEl=document.createElement('span'); titleEl.className='wpg-sec-title';

    w.sec.appendChild(fr);
    var nt=document.createElement('textarea'); nt.className='wpg-food-notes';
    nt.placeholder='Opciones de comida, meal prep…'; nt.value=dd.food.notes||''; nt.rows=2;
    nt.oninput=function(){dd.food.notes=nt.value;_wpAutoSave();};
    nt.onfocus=function(){nt.style.borderColor='rgba(232,160,32,.35)';};
    nt.onblur=function(){nt.style.borderColor='rgba(255,255,255,.08)';};
    w.sec.appendChild(nt);
    parent.appendChild(w.sec);
  }
  function _wpRenderClasses(parent,ds,dd){
    var w=_wpSecWrap('#8B5CF6','📚','Inglés / Clases');
    dd.classes.forEach(function(item){
      w.sec.appendChild(_wpMakeSlot(item,dd.classes,'Materia o nota…',function(){renderWeekPlanContent();}));
    });
    w.sec.appendChild(_wpAddBtn('+ Agregar clase','#8B5CF6',function(){
      dd.classes.push({id:Date.now(),time:'',notes:''});_wpAutoSave();renderWeekPlanContent();
    }));
    parent.appendChild(w.sec);
  }
  function _wpRenderDeliveries(parent,ds,dd){
    var w=_wpSecWrap('#1A6FD4','📦','Entregas');
    dd.deliveries.forEach(function(item){
      var row=document.createElement('div'); row.className='wpg-slot';
      var sel=document.createElement('select'); sel.className='wpg-proj-sel';
      var optC=document.createElement('option'); optC.value='__custom__'; optC.textContent='— Externo / personalizado —'; sel.appendChild(optC);
      var active=(projects||[]).filter(function(p){return !p.status||p.status==='active'||p.status==='en-progreso'||p.status==='En progreso'||p.status==='en progreso';});
      active.forEach(function(p){
        var o=document.createElement('option'); o.value=String(p.id); o.textContent=p.name||p.title||'Sin nombre';
        if(item.projectId===String(p.id))o.selected=true; sel.appendChild(o);
      });
      if(!item.projectId||item.projectId==='__custom__')optC.selected=true;
      var ci=document.createElement('input'); ci.type='text'; ci.className='wpg-custom-input';
      ci.placeholder='Nombre del proyecto…'; ci.value=item.customName||'';
      ci.style.display=(item.projectId&&item.projectId!=='__custom__')?'none':'block';
      ci.oninput=function(){item.customName=ci.value;item.projectName=ci.value;_wpAutoSave();};
      sel.onchange=function(){
        if(sel.value==='__custom__'){item.projectId=null;item.projectName=item.customName||'';ci.style.display='block';}
        else{item.projectId=sel.value;var pr=active.find(function(p){return String(p.id)===sel.value;});item.projectName=pr?(pr.name||pr.title||''):'';ci.style.display='none';}
        _wpAutoSave();
      };
      var db=document.createElement('button'); db.className='wpg-slot-del'; db.innerHTML='×';
      db.onmouseenter=function(){db.style.color='rgba(226,75,74,.75)';};
      db.onmouseleave=function(){db.style.color='rgba(255,255,255,.18)';};
      db.onclick=function(){var idx=dd.deliveries.indexOf(item);if(idx!==-1)dd.deliveries.splice(idx,1);_wpAutoSave();renderWeekPlanContent();};
      row.appendChild(sel); row.appendChild(ci); row.appendChild(db); w.sec.appendChild(row);
    });
    w.sec.appendChild(_wpAddBtn('+ Agregar entrega','#1A6FD4',function(){
      dd.deliveries.push({id:Date.now(),projectId:null,projectName:'',customName:''});_wpAutoSave();renderWeekPlanContent();
    }));
    parent.appendChild(w.sec);
  }

  window.openWeekPlanner=function(){
    _wpWeek=_getMondayOf(selectedDate?parse(selectedDate):today);
    _wpSelDay=null;
    renderWeekPlanContent();
    document.getElementById('wpOverlay').classList.add('open');
  };
  window.closeWeekPlanner=function(){
    document.getElementById('wpOverlay').classList.remove('open');
    _wpWeek=null;
    // Re-sync weekPlans from _pass now that the panel is closed
    if(_pass.weekPlans) weekPlans=_pass.weekPlans;
  };
  window.navWeekPlan=function(n){
    _wpWeek=new Date(_wpWeek); _wpWeek.setDate(_wpWeek.getDate()+n*7);
    _wpSelDay=null;
    renderWeekPlanContent();
  };

  function renderWeekPlanContent(){
    var lbl=document.getElementById('wpWeekLbl'); if(lbl)lbl.textContent=_fmtWeekRange(_wpWeek);
    var cont=document.getElementById('wpContent'); if(!cont)return;
    cont.innerHTML=''; cont.style.cssText='display:flex;flex-direction:column;gap:14px;';
    var days=_wpGetDays(); var todayStr=fmt(today);
    var k=_wpKey();
    // Default select today if in week, else Monday
    if(!_wpSelDay){
      var inWeek=days.filter(function(d){return fmt(d)===todayStr;});
      _wpSelDay=inWeek.length?todayStr:fmt(days[0]);
    }
    // Day tabs
    var tabsRow=document.createElement('div'); tabsRow.style.cssText='display:flex;gap:5px;';
    var DAY_NAMES=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    days.forEach(function(d){
      var ds=fmt(d);
      var tab=document.createElement('button'); tab.className='wpg-daytab'+(ds===_wpSelDay?' active':'')+(ds===todayStr?' today-tab':'');
      var nm=document.createElement('div'); nm.className='wpg-daytab-name'; nm.textContent=DAY_NAMES[d.getDay()]; tab.appendChild(nm);
      var nu=document.createElement('div'); nu.className='wpg-daytab-num'; nu.textContent=d.getDate(); tab.appendChild(nu);
      // Dot if day has data
      var dd2=k&&weekPlans[k]&&weekPlans[k].days&&weekPlans[k].days[ds];
      if(dd2&&(dd2.exercise&&dd2.exercise.length||dd2.classes&&dd2.classes.length||dd2.food&&dd2.food.where||dd2.deliveries&&dd2.deliveries.length)){
        var dot=document.createElement('div'); dot.className='wpg-dot'; tab.appendChild(dot);
      }
      (function(selDs){tab.onclick=function(){_wpSelDay=selDs;renderWeekPlanContent();};})(ds);
      tabsRow.appendChild(tab);
    });
    cont.appendChild(tabsRow);
    // Day detail
    var detail=document.createElement('div'); detail.style.cssText='display:flex;flex-direction:column;gap:10px;';
    var dd=_wpDayData(_wpSelDay);
    _wpRenderExercise(detail,_wpSelDay,dd);
    _wpRenderFood(detail,_wpSelDay,dd);
    _wpRenderClasses(detail,_wpSelDay,dd);
    _wpRenderDeliveries(detail,_wpSelDay,dd);
    cont.appendChild(detail);
    // Apply button
    var applyBtn=document.createElement('button'); applyBtn.id='_wpApplyBtn'; applyBtn.className='wpg-apply-btn';
    applyBtn.textContent='Aplicar semana al Daily Hub';
    applyBtn.onclick=function(){_wpApplyToHub(k);};
    cont.appendChild(applyBtn);
  }

  function _wpApplyToHub(k){
    var plan=weekPlans[k]; if(!plan||!plan.days)return;
    var days=_wpGetDays();
    var dailyBlocks=JSON.parse(JSON.stringify(_pass.dailyBlocks||{}));
    var dayTasks=JSON.parse(JSON.stringify(_pass.dayTasks||{}));
    var standaloneTasks=JSON.parse(JSON.stringify(_pass.standaloneTasks||[]));
    // Remove old wpGenerated entries for this week
    days.forEach(function(d){
      var ds=fmt(d);
      if(dailyBlocks[ds])dailyBlocks[ds]=dailyBlocks[ds].filter(function(b){return !b.wpGenerated;});
      if(dayTasks[ds])dayTasks[ds]=dayTasks[ds].filter(function(t){return !t.wpGenerated;});
    });
    // Remove old wpGenerated food tasks from standaloneTasks
    standaloneTasks=standaloneTasks.filter(function(t){return !(t.wpGenerated&&t.source==='PlannerFood');});
    // Write new entries
    days.forEach(function(d){
      var ds=fmt(d); var dd=plan.days[ds]; if(!dd)return;
      if(!dailyBlocks[ds])dailyBlocks[ds]=[];
      if(!dayTasks[ds])dayTasks[ds]=[];
      // Exercise → dailyBlocks
      (dd.exercise||[]).forEach(function(ex){
        if(!ex.time)return;
        var ph=ex.time.split(':'); var eh=(parseInt(ph[0])+1)%24; var et=String(eh).padStart(2,'0')+':'+ph[1];
        dailyBlocks[ds].push({id:'wp_ex_'+ex.id,start:ex.time,end:et,title:'Ejercicio'+(ex.notes?' · '+ex.notes:''),color:'#27AE72',wpGenerated:true,personal:true});
      });
      // Classes → dailyBlocks
      (dd.classes||[]).forEach(function(cl){
        if(!cl.time)return;
        var ph=cl.time.split(':'); var eh=(parseInt(ph[0])+1)%24; var et=String(eh).padStart(2,'0')+':'+ph[1];
        dailyBlocks[ds].push({id:'wp_cl_'+cl.id,start:cl.time,end:et,title:cl.notes||'Inglés',color:'#8B5CF6',wpGenerated:true,personal:true});
      });
      dailyBlocks[ds].sort(function(a,b){return(a.start||'')<(b.start||'')?-1:1;});
      // Food → standaloneTasks (visible in tareas.html)
      if(dd.food&&dd.food.where){
        var ft=dd.food.where==='casa'
          ?('Planear comida en casa'+(dd.food.notes?' · '+dd.food.notes:''))
          :('Preparar comida para llevar o planear comida'+(dd.food.notes?' · '+dd.food.notes:''));
        standaloneTasks.push({
          id:'wp_food_'+ds, text:ft, done:false, deadline:ds,
          colStatus:null, sortOrder:Date.now(), resp:'',
          wpGenerated:true, source:'PlannerFood', notes:''
        });
      }
      // Deliveries → dayTasks
      (dd.deliveries||[]).forEach(function(deliv,i){
        var name=deliv.projectName||deliv.customName||'Entrega';
        dayTasks[ds].push({id:'wp_deliv_'+ds+'_'+i,text:'Entrega: '+name,done:false,wpGenerated:true,source:'Planner',projId:deliv.projectId||null});
      });
    });
    var p=Object.assign({},_pass,{dailyBlocks:dailyBlocks,dayTasks:dayTasks,standaloneTasks:standaloneTasks,weekPlans:weekPlans});
    DOC.set(p).then(function(){
      _pass=Object.assign({},_pass,{dailyBlocks:dailyBlocks,dayTasks:dayTasks,standaloneTasks:standaloneTasks});
      var btn=document.getElementById('_wpApplyBtn');
      if(btn){btn.textContent='✓ Aplicado al Daily Hub';setTimeout(function(){if(btn)btn.textContent='Aplicar semana al Daily Hub';},2500);}
    }).catch(function(e){console.warn(e);});
  }

  var _wpSaveT=null;
  function _wpAutoSave(){
    var sv=document.getElementById('wpSaved');
    if(sv){sv.textContent='Guardando…';sv.style.opacity='1';}
    if(_wpSaveT)clearTimeout(_wpSaveT);
    _wpSaveT=setTimeout(function(){
      var p=Object.assign({},_pass,{weekPlans:weekPlans});
      DOC.set(p).catch(function(e){console.warn(e);});
      var sv2=document.getElementById('wpSaved');
      if(sv2){sv2.textContent='✓ Guardado';setTimeout(function(){if(sv2)sv2.style.opacity='0';},1800);}
    },900);
  }

  // ── INIT ──────────────────────────────────────────────────────
  DOC.onSnapshot(function(snap){
    if(snap.exists){
      var d=snap.data();
      _pass=Object.assign({},d);
      if(d.projects&&d.projects.length) projects=d.projects;
      if(d.categories&&d.categories.length) categories=d.categories;
      if(d.standaloneTasks) standaloneTasks=d.standaloneTasks;
      if(d.calendarEvents) calendarEvents=d.calendarEvents;
      if(d.calCategories&&d.calCategories.length) calCategories=d.calCategories;
      if(d.dailyPriorities) dailyPriorities=d.dailyPriorities;
      // Don't overwrite weekPlans while the planner is open — doing so breaks
      // the object references held by the exercise/class input closures, causing
      // typed times to be lost before Apply is clicked.
      if(d.weekPlans && !_wpWeek) weekPlans=d.weekPlans;
    }
    render();
    if(selectedDate&&curView!=='day') renderDayEvents(selectedDate);
  },function(e){console.warn('Error:',e);render();});

})();
</script>

<!-- MINI FOCUS TIMER -->
<script>
(function(){
  var SK='trazzo_focus_session';
  var _el=null,_int=null;
  function _fmt(sec){var s=Math.max(0,sec);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
  function _read(){try{return JSON.parse(localStorage.getItem(SK)||'null');}catch(e){return null;}}
  function _write(s){if(!s||s.remaining<=0){localStorage.removeItem(SK);return;}localStorage.setItem(SK,JSON.stringify(s));}
  function _hide(){if(_int){clearInterval(_int);_int=null;}if(_el){_el.remove();_el=null;}}
  function _startTick(){
    if(_int)clearInterval(_int);
    _int=setInterval(function(){
      var s=_read();if(!s||!s.running){clearInterval(_int);_int=null;if(_el){var pp=document.getElementById('_mfpp');if(pp)pp.textContent='▶';}return;}
      s.remaining--;s.ts=Date.now();_write(s);
      var tEl=document.getElementById('_mft');if(tEl)tEl.textContent=_fmt(s.remaining);
      if(s.remaining<=0){clearInterval(_int);_int=null;_hide();}
    },1000);
  }
  function _render(){
    var sess=_read();if(!sess||sess.remaining<=0){_hide();return;}
    if(sess.running&&sess.ts){var el=Math.floor((Date.now()-sess.ts)/1000);if(el>0){sess.remaining=Math.max(0,sess.remaining-el);sess.ts=Date.now();_write(sess);if(sess.remaining<=0){_hide();return;}}}
    if(!_el){
      _el=document.createElement('div');
      _el.style.cssText='position:fixed;top:12px;right:14px;z-index:99999;display:flex;align-items:center;gap:7px;background:#1a1a1a;border:0.5px solid rgba(232,160,32,0.4);border-radius:20px;padding:6px 8px 6px 12px;font-family:Inter,sans-serif;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.7);user-select:none;';
      _el.innerHTML='<span style="font-size:12px;color:#E8A020;font-weight:700;">⚡</span><span id="_mfn" style="max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:500;color:rgba(255,255,255,0.55);"></span><span id="_mft" style="font-size:12px;font-weight:700;color:#E8A020;font-variant-numeric:tabular-nums;min-width:40px;text-align:right;"></span><button id="_mfpp" style="background:rgba(255,255,255,0.07);border:none;color:rgba(255,255,255,0.5);font-size:12px;cursor:pointer;border-radius:10px;padding:2px 8px;font-family:Inter,sans-serif;line-height:1.7;" title="Pausa/Reanudar">⏸</button><button id="_mfst" style="background:none;border:none;color:rgba(255,255,255,0.25);font-size:16px;cursor:pointer;padding:0 4px;line-height:1;" title="Detener">×</button>';
      document.body.appendChild(_el);
      _el.addEventListener('click',function(e){if(e.target.tagName!=='BUTTON')location.href='focus.html';});
      document.getElementById('_mfpp').addEventListener('click',function(e){e.stopPropagation();_toggle();});
      document.getElementById('_mfst').addEventListener('click',function(e){e.stopPropagation();localStorage.removeItem(SK);_hide();});
    }
    document.getElementById('_mfn').textContent=sess.taskText||'';
    document.getElementById('_mft').textContent=_fmt(sess.remaining);
    document.getElementById('_mfpp').textContent=sess.running?'⏸':'▶';
    if(sess.running&&!_int)_startTick();else if(!sess.running&&_int){clearInterval(_int);_int=null;}
  }
  function _toggle(){var s=_read();if(!s)return;s.running=!s.running;s.ts=Date.now();_write(s);var pp=document.getElementById('_mfpp');if(pp)pp.textContent=s.running?'⏸':'▶';if(s.running)_startTick();else if(_int){clearInterval(_int);_int=null;}}
  _render();
})();
</script>
<script src="theme.js"></script>
