<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#000"/>
  <defs>
    <clipPath id="cl"><rect x="0" y="0" width="256" height="512"/></clipPath>
    <clipPath id="cr"><rect x="256" y="0" width="256" height="512"/></clipPath>
  </defs>

  <!-- Left side: thick ring arc (C shape) -->
  <circle cx="256" cy="256" r="206" fill="none" stroke="white" stroke-width="46" clip-path="url(#cl)"/>

  <!-- Right side: solid white semicircle -->
  <circle cx="256" cy="256" r="206" fill="white" clip-path="url(#cr)"/>

  <!-- Small hollow ring (left half) -->
  <circle cx="164" cy="256" r="50" fill="none" stroke="white" stroke-width="13"/>

  <!-- Black solid disk (right half — the "hole") -->
  <circle cx="328" cy="256" r="60" fill="#000"/>

  <!-- Dashes — right side, 4 marks radiating outward -->
  <g transform="translate(256,256)">
    <rect x="220" y="-10" width="36" height="17" rx="4" fill="white" transform="rotate(-52)"/>
    <rect x="222" y="-10" width="32" height="17" rx="4" fill="white" transform="rotate(-22)"/>
    <rect x="222" y="-10" width="32" height="17" rx="4" fill="white" transform="rotate(15)"/>
    <rect x="218" y="-10" width="36" height="17" rx="4" fill="white" transform="rotate(47)"/>
  </g>
</svg>
